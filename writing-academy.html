<script>
"use strict";
const DATA = {"CH":[{"n":1,"title":"Από την ιδέα στο σχέδιο του βιβλίου","mentor":{"name":"Ευτυχία Πένα","role":"μέντορας των Βάσεων","g":"pen","line":"Ένα βιβλίο γράφεται μία σελίδα τη φορά. Η πρώτη σελίδα είναι η πιο δύσκολη, γι' αυτό ξεκινάμε μικρά."},"lesson":[{"h":"Δύο μεγάλες οικογένειες βιβλίων","p":["Κάθε βιβλίο ανήκει σε μία από δύο μεγάλες οικογένειες. Η **μυθοπλασία** αφηγείται φανταστικές ιστορίες με φανταστικούς ή εμπνευσμένους ήρωες: μυθιστόρημα, διήγημα, παραμύθι, θεατρικό έργο. Η **μη μυθοπλασία** μιλά για πραγματικά γεγονότα, πρόσωπα ή γνώσεις: εγχειρίδιο, βιογραφία, δοκίμιο, ταξιδιωτικός οδηγός, βιβλίο μαγειρικής.","Η διαφορά δεν είναι στο πόσο καλά γράφεται το βιβλίο, αλλά στη συμφωνία με τον αναγνώστη. Όποιος ανοίγει ένα μυθιστόρημα δέχεται ότι η ιστορία είναι επινοημένη. Όποιος ανοίγει ένα εγχειρίδιο περιμένει ότι όσα διαβάζει είναι σωστά και μπορεί να τα εμπιστευτεί.","Υπάρχουν και μεικτά είδη, όπως το ιστορικό μυθιστόρημα, που βάζει φανταστικούς ήρωες σε πραγματική εποχή, ή η λογοτεχνική βιογραφία. Για έναν αρχάριο αρκεί να ρωτά πάντα: «Τι υπόσχομαι στον αναγνώστη, ιστορία ή γνώση;»"]},{"h":"Η ιδέα και η υπόσχεση προς τον αναγνώστη","p":["Μια ιδέα δεν είναι ακόμη βιβλίο. Γίνεται βιβλίο όταν χωράει σε μία πρόταση που υπόσχεται κάτι. Στη μη μυθοπλασία η πρόταση έχει τη μορφή: «Το βιβλίο αυτό βοηθά **ποιον** να κάνει **τι**.»","> Το βιβλίο αυτό βοηθά ανθρώπους που δεν έχουν γράψει ποτέ να τελειώσουν το πρώτο τους διήγημα σε τρεις μήνες.","Στη μυθοπλασία η πρόταση λέει ποιος είναι ο ήρωας, τι θέλει και τι τον εμποδίζει. Λέγεται και **λογλάιν** (από το αγγλικό logline).","> Μια νεαρή φαροφύλακας θέλει να κρατήσει τον φάρο της ανοιχτό, αλλά η εταιρεία έχει υπογράψει να τον κλείσει πριν από τον χειμώνα.","Αν δεν μπορείς να γράψεις την πρόταση, συνήθως δεν έχεις ακόμη αρκετά καθαρή ιδέα. Αυτό δεν είναι αποτυχία. Είναι το σήμα να σκεφτείς λίγο ακόμη πριν γράψεις σελίδες."]},{"h":"Ο αναγνώστης που έχεις στο μυαλό σου","p":["Κανείς δεν γράφει για «όλους». Ο καλός συγγραφέας έχει στο μυαλό του έναν συγκεκριμένο αναγνώστη: πόσων χρόνων είναι, τι ξέρει ήδη, γιατί ανοίγει το βιβλίο και τι θέλει να νιώσει ή να μάθει όταν το κλείσει.","Από τον αναγνώστη εξαρτώνται πολλές επιλογές: το μήκος των προτάσεων, το πόσο θα εξηγήσεις έναν όρο, αν θα βάλεις παραδείγματα, ακόμη και πόσο μεγάλο θα είναι το βιβλίο. Ένα εγχειρίδιο για αρχάριους εξηγεί κάθε όρο. Ένα εγχειρίδιο για ειδικούς τον αφήνει ανεξήγητο.","Μια πρακτική τεχνική είναι να γράψεις ένα μικρό προφίλ με όνομα: «Η Ελένη, 17 ετών, διαβάζει στο λεωφορείο και βαριέται τις μεγάλες περιγραφές.» Όποτε αμφιβάλλεις, ρώτα: «Θα το καταλάβαινε η Ελένη;»"]},{"h":"Είδος και μέγεθος","p":["Το μέγεθος ενός έργου μετριέται σε λέξεις. Η συνήθης διάκριση για την πεζογραφία είναι η εξής, με προσεγγιστικά όρια:","- διήγημα: έως περίπου 7.500 λέξεις\n- νουβέλα μικρού μήκους (novelette): 7.500 έως 17.500 λέξεις\n- νουβέλα (novella): 17.500 έως 40.000 λέξεις\n- μυθιστόρημα: πάνω από 40.000 λέξεις","Τα όρια αλλάζουν λίγο από εκδότη σε εκδότη και από διαγωνισμό σε διαγωνισμό, αλλά βοηθούν να σχεδιάσεις. Ένας αρχάριος κάνει συχνά το λάθος να ξεκινά με υπερβολικά μεγάλο έργο. Ένα καλοτελειωμένο διήγημα διδάσκει περισσότερα από ένα μυθιστόρημα που μένει στη μέση.","Στη μη μυθοπλασία το μέγεθος εξαρτάται από τον σκοπό. Ένα πρακτικό εγχειρίδιο 20.000 έως 50.000 λέξεων είναι συνηθισμένο και αρκεί, αν λέει ακριβώς όσα υπόσχεται."]},{"h":"Το σχέδιο: περίγραμμα και πρόγραμμα","p":["Το **περίγραμμα** (outline) είναι ο χάρτης του βιβλίου. Στη μυθοπλασία το φτιάχνεις με λίγα σημεία: πώς αρχίζει η ιστορία, ποια είναι τα κύρια γεγονότα και πώς τελειώνει. Στη μη μυθοπλασία είναι ο κατάλογος των κεφαλαίων, με μία γραμμή για τον στόχο του καθενός.","Το περίγραμμα δεν είναι δεσμευτικό. Αλλάζει όσο γράφεις. Η αξία του είναι ότι ξέρεις σε κάθε στιγμή πού πηγαίνεις.","Χρειάζεσαι και **πρόγραμμα**. Αν στοχεύεις σε 300 λέξεις την ημέρα, σε 100 ημέρες έχεις 30.000 λέξεις. Μικροί, σταθεροί στόχοι κερδίζουν τις μεγάλες εμπνεύσεις που έρχονται σπάνια."]},{"h":"Η συνήθεια γραφής και η λευκή σελίδα","p":["Η λευκή σελίδα φοβίζει επειδή περιμένουμε το πρώτο μας κείμενο να είναι καλό. Δεν χρειάζεται. Το πρώτο προσχέδιο υπάρχει για να υπάρξει κείμενο, όχι για να είναι τέλειο. Μπορείς να το διορθώσεις μόνο αν υπάρχει.","Δύο ξεχωριστές δουλειές μην τις κάνεις ταυτόχρονα: η **γραφή** (δημιουργώ) και η **επιμέλεια** (διορθώνω). Αν διορθώνεις κάθε πρόταση καθώς τη γράφεις, θα προχωράς αργά και θα κουράζεσαι. Γράψε πρώτα, διόρθωσε αργότερα.","Βοηθά να έχεις σταθερή ώρα και τόπο, να σταματάς όταν ξέρεις τι θα γράψεις μετά, ώστε η επόμενη μέρα να ξεκινά εύκολα, και να καταγράφεις πόσες λέξεις έγραψες. Η πρόοδος που φαίνεται δίνει κίνητρο."]},{"h":"Ελληνικά ή αγγλικά;","p":["Η γλώσσα του βιβλίου είναι επιλογή με συνέπειες. Γράφε στη γλώσσα που ελέγχεις καλύτερα και στην οποία διαβάζει το κοινό σου. Στα ελληνικά απευθύνεσαι σε μικρότερη αγορά με λιγότερο ανταγωνισμό. Στα αγγλικά το κοινό είναι τεράστιο, αλλά και ο ανταγωνισμός.","Αν σκέφτεσαι να έχεις και τις δύο εκδοχές, μην κάνεις μηχανική μετάφραση λέξη προς λέξη. Κάθε γλώσσα έχει δικές της εκφράσεις, δικό της ρυθμό και δικά της σημεία στίξης. Μια πρόταση που ακούγεται φυσική στα αγγλικά μπορεί να ακούγεται ξένη στα ελληνικά, και το αντίστροφο.","> Δεν γράφουμε «κάνω νόημα» επειδή το λένε οι Άγγλοι ({{it makes sense}}). Στα ελληνικά λέμε «βγάζει νόημα» ή «έχει λογική».","Στο πρόγραμμα αυτό θα βρίσκεις παραδείγματα και από τις δύο γλώσσες, ώστε να συγκρίνεις πώς δουλεύει η ίδια τεχνική σε καθεμία."]}],"sum":["Μυθοπλασία = φανταστικές ιστορίες. Μη μυθοπλασία = πραγματικά γεγονότα ή γνώση.","Μια ιδέα γίνεται βιβλίο όταν χωράει σε **μία πρόταση-υπόσχεση** (λογλάιν στη μυθοπλασία).","Γράφεις για έναν **συγκεκριμένο αναγνώστη**, όχι για «όλους».","Περίγραμμα για τον δρόμο, πρόγραμμα για τον χρόνο, μικροί καθημερινοί στόχοι.","Πρώτα **γράφεις**, μετά **επιμελείσαι**. Το πρώτο προσχέδιο δεν χρειάζεται να είναι καλό."],"ex":{"t":"Παράδειγμα: από ιδέα σε πρόταση-υπόσχεση","x":"Ιδέα: «κάτι για τα νησιά».\nΠροβληματική πρόταση: «Ένα βιβλίο για τα νησιά.»\nΚαλύτερη πρόταση: «Ένας οδηγός για ταξιδιώτες που θέλουν να γνωρίσουν πέντε μικρά νησιά του Αιγαίου χωρίς αυτοκίνητο.»"},"cards":[["Μυθοπλασία","Έργο με φανταστική ιστορία: μυθιστόρημα, διήγημα, παραμύθι, θεατρικό."],["Μη μυθοπλασία","Έργο για πραγματικά γεγονότα ή γνώσεις: εγχειρίδιο, βιογραφία, δοκίμιο, οδηγός."],["Λογλάιν (logline)","Μία πρόταση που λέει ποιος είναι ο ήρωας, τι θέλει και τι τον εμποδίζει."],["Πρόταση-υπόσχεση","Στη μη μυθοπλασία: «Το βιβλίο αυτό βοηθά ποιον να κάνει τι.»"],["Προφίλ αναγνώστη","Σύντομη περιγραφή του αναγνώστη που έχεις στο μυαλό σου: ηλικία, γνώσεις, κίνητρο."],["Διήγημα και μυθιστόρημα (όρια)","Διήγημα: έως περίπου 7.500 λέξεις. Μυθιστόρημα: πάνω από 40.000 λέξεις."],["Νουβέλα (novella)","Έργο περίπου 17.500 έως 40.000 λέξεων."],["Περίγραμμα (outline)","Ο χάρτης του βιβλίου: τα κύρια σημεία ή ο κατάλογος κεφαλαίων με στόχο ανά κεφάλαιο."],["Πρώτο προσχέδιο","Η πρώτη ολοκληρωμένη μορφή του κειμένου. Υπάρχει για να υπάρξει κείμενο, όχι για να είναι τέλειο."],["Γραφή και επιμέλεια","Δύο ξεχωριστές δουλειές: δημιουργώ και διορθώνω. Δεν τις κάνω ταυτόχρονα."]],"qs":[{"t":"mcq","q":"Ποια είναι η βασική διαφορά μυθοπλασίας και μη μυθοπλασίας;","o":["Η μυθοπλασία αφηγείται φανταστικές ιστορίες, η μη μυθοπλασία πραγματικά γεγονότα ή γνώσεις","Η μυθοπλασία είναι πάντα μεγαλύτερη σε έκταση","Η μη μυθοπλασία δεν έχει ποτέ αφήγηση","Η μυθοπλασία γράφεται μόνο σε στίχους"],"why":"Η μυθοπλασία αφηγείται επινοημένες ιστορίες· η μη μυθοπλασία μιλά για πραγματικά γεγονότα ή γνώσεις."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Ένα εγχειρίδιο προγραμματισμού ανήκει στη μη μυθοπλασία.","a":true,"why":"Δίνει γνώσεις για πραγματικό αντικείμενο, άρα είναι μη μυθοπλασία."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Παραμύθι","o":["Μυθοπλασία","Μη μυθοπλασία"],"why":"Το παραμύθι είναι φανταστική ιστορία."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Βιογραφία","o":["Μη μυθοπλασία","Μυθοπλασία"],"why":"Η βιογραφία αφηγείται τη ζωή πραγματικού προσώπου."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Ταξιδιωτικός οδηγός","o":["Μη μυθοπλασία","Μυθοπλασία"],"why":"Δίνει πραγματικές πληροφορίες για τόπους."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Διήγημα","o":["Μυθοπλασία","Μη μυθοπλασία"],"why":"Το διήγημα είναι σύντομη επινοημένη αφήγηση."},{"t":"mcq","q":"Ποιο από τα παρακάτω είναι μεικτό είδος;","o":["Ιστορικό μυθιστόρημα","Τηλεφωνικός κατάλογος","Βιβλίο μαγειρικής","Λεξικό"],"why":"Το ιστορικό μυθιστόρημα βάζει φανταστικούς ήρωες σε πραγματική εποχή."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Ο αναγνώστης που ανοίγει ένα μυθιστόρημα δέχεται ότι η ιστορία είναι επινοημένη.","a":true,"why":"Αυτή είναι η σιωπηρή συμφωνία της μυθοπλασίας."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Αν γράφω μη μυθοπλασία, μπορώ να επινοώ ελεύθερα στοιχεία χωρίς να το πω.","a":false,"why":"Ο αναγνώστης εμπιστεύεται ότι όσα διαβάζει είναι σωστά."},{"t":"mcq","q":"Τι είναι το λογλάιν (logline);","o":["Μία πρόταση που λέει ποιος είναι ο ήρωας, τι θέλει και τι τον εμποδίζει","Ο τίτλος του βιβλίου","Ο πρώτος διάλογος του μυθιστορήματος","Το όνομα του εκδότη"],"why":"Είναι μία πρόταση με ήρωα, στόχο και εμπόδιο."},{"t":"mcq","q":"Ποια πρόταση είναι σωστή πρόταση-υπόσχεση για μη μυθοπλασία;","o":["Το βιβλίο αυτό βοηθά αρχάριους να μάθουν να ράβουν τα πρώτα τους ρούχα","Ένα βιβλίο για όλα όσα αγαπώ","Κάτι για το ράψιμο","Μια πολύ ωραία ιδέα"],"why":"Λέει ποιον βοηθά και σε τι."},{"t":"mcq","q":"Ποιο στοιχείο ΔΕΝ είναι απαραίτητο σε ένα λογλάιν;","o":["Ο αριθμός των σελίδων","Ο ήρωας","Ο στόχος του ήρωα","Το εμπόδιο"],"why":"Το λογλάιν έχει ήρωα, στόχο και εμπόδιο, όχι τον αριθμό σελίδων."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Αν δεν μπορώ να γράψω την πρόταση-υπόσχεση, πιθανόν η ιδέα δεν έχει ακόμη καθαρό περίγραμμα.","a":true,"why":"Είναι σήμα να σκεφτώ λίγο ακόμη πριν γράψω σελίδες."},{"t":"mcq","q":"Γιατί λέμε ότι δεν γράφουμε «για όλους»;" ώνω","διαφημίζω","μεταφράζω"],"why":"Η σωστή σειρά: πρώτα γράφω."},{"t":"mcq","q":"Τι βοηθά να ξεκινά εύκολα η επόμενη μέρα γραφής;","o":["Να σταματάς όταν ξέρεις τι θα γράψεις μετά","Να σταματάς πάντα στη μέση μιας λέξης","Να μη γράφεις ποτέ σε σταθερή ώρα","Να σβήνεις όσα έγραψες χθες"],"why":"Έτσι έχεις πάντα το επόμενο βήμα έτοιμο."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η καταγραφή του αριθμού λέξεων κάθε μέρα μπορεί να δίνει κίνητρο.","a":true,"why":"Η πρόοδος που φαίνεται ενθαρρύνει."},{"t":"mcq","q":"Ποιο είναι πλεονέκτημα του να γράφεις στα αγγλικά;","o":["Το κοινό είναι τεράστιο","Δεν υπάρχει ανταγωνισμός","Δεν χρειάζεται επιμέλεια","Δεν έχει σημασία η ποιότητα"],"why":"Ο αγγλόφωνος κόσμος είναι τεράστιος, αλλά ο ανταγωνισμός επίσης."},{"t":"mcq","q":"Ποιο είναι πλεονέκτημα του να γράφεις στα ελληνικά;","o":["Απευθύνεσαι σε μικρότερη αγορά με λιγότερο ανταγωνισμό","Το κοινό είναι μεγαλύτερο από το αγγλόφωνο","Δεν υπάρχουν εκδοτικοί οίκοι","Δεν υπάρχουν αναγνώστες"],"why":"Η ελληνική αγορά είναι μικρότερη και έχει λιγότερο ανταγωνισμό."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η μηχανική μετάφραση λέξη προς λέξη είναι ο καλύτερος τρόπος να φτιάξω δίγλωσση έκδοση.","a":false,"why":"Κάθε γλώσσα έχει δικές της εκφράσεις και δικό της ρυθμό."},{"t":"fix","q":"Η κριτική έγραψε: «Το βιβλίο κάνει νόημα.»","x":"Ποια διατύπωση ακούγεται φυσική στα ελληνικά;","o":["Το βιβλίο βγάζει νόημα.","Το βιβλίο κάνει νόημα.","Το βιβλίο κτίζει νόημα.","Το βιβλίο πάει νόημα."],"why":"Στα ελληνικά λέμε «βγάζει νόημα» ή «έχει λογική»."},{"t":"mcq","q":"Σε ποιο από τα παρακάτω βοηθά περισσότερο ένα σταθερό πρόγραμμα γραφής;","o":["Να τελειώσεις το βιβλίο","Να αλλάξεις το θέμα κάθε μέρα","Να αποφύγεις την επιμέλεια","Να περιμένεις έμπνευση"],"why":"Η συνέπεια είναι ο πιο αξιόπιστος τρόπος να τελειώσεις ένα βιβλίο."},{"t":"ord","q":"Βάλε τα βήματα στη σωστή σειρά για να ξεκινήσεις ένα βιβλίο.","lines":["Ιδέα","Πρόταση-υπόσχεση","Προφίλ αναγνώστη","Περίγραμμα","Πρώτο προσχέδιο"],"why":"Ιδέα, υπόσχεται, δεν χρειάζεται να είναι μεγαλύτερο."},{"t":"mcq","q":"Ποιο από τα παρακάτω είναι μυθοπλασία;","o":["Θεατρικό έργο","Βιβλίο μαγειρικής","Εγχειρίδιο χρήσης","Ιστορία της τέχνης"],"why":"Το θεατρικό έργο είναι είδος μυθοπλασίας."},{"t":"mcq","q":"Σε ποια περίπτωση χρησιμοποιείς το προφίλ αναγνώστη;","o":["Όταν αμφιβάλλεις αν κάτι ταιριάζει στο κοινό σου","Μόνο στο τέλος του βιβλίου","Μόνο στο εξώφυλλο","Ποτέ"],"why":"Όταν αμφιβάλλεις για επιλογές ύφους ή περιεχομένου."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η συνέπεια (σταθερή ώρα και τόπος γραφής) βοηθά να τελειώσεις το βιβλίο.","a":true,"why":"Η συνήθεια πετυχαίνει όσα η έμπνευση δεν εγγυάται."},{"t":"mcq","q":"Ποιο είναι το πρώτο βήμα όταν η ιδέα είναι ακόμη θολή;","o":["Να γράψω μία πρόταση που τη συνοψίζει","Να τυπώσω το βιβλίο","Να διαλέξω εξώφυλλο","Να βρω εκδότη"],"why":"Η μία πρόταση καθαρίζει την ιδέα πριν γράψεις σελίδες."},{"t":"fix","q":"Αναγνώστης: «όλοι».","x":"Τι θα βελτίωνες στο προφίλ αναγνώστη;","o":["Θα έγραφα συγκεκριμένα: ηλικία, γνώσεις, κίνητρο","Θα το άφηνα ως έχει","Θα έγραφα «όλοι και κανείς»","Θα αφαιρούσα τον αναγνώστη"],"why":"Ένα συγκεκριμένο προφίλ οδηγεί καλύτερα τις επιλογές."}],"labs":[{"t":"Η πρόταση-υπόσχεση του βιβλίου σου","p":"Γράψε μία πρόταση για το βιβλίο που θέλεις να γράψεις. Αν είναι μυθοπλασία, πες ποιος είναι ο ήρωας, τι θέλει και τι τον εμποδίζει. Αν είναι μη μυθοπλασία, πες ποιον βοηθά και σε τι.","h":"Μία μόνο πρόταση, όχι παράγραφος. Αν χρειάζεται δύο φορές «και», χώρισέ την.","m":"Μυθοπλασία: «Ένας γέρος ψαράς στην Κάρπαθο πρέπει να μάθει σε έναν έφηβο το μυστικό του ψαρέματος πριν χαθεί η λιμνοθάλασσα από το νέο λιμάνι.»\nΜη μυθοπλασία: «Το βιβλίο αυτό βοηθά εκπαιδευτικούς που δεν έχουν γράψει ποτέ να εκδώσουν μόνοι τους ένα εγχειρίδιο για τους μαθητές τους.»","c":["Είναι μία πρόταση.","Λέει ποιος ή ποιον αφορά.","Λέει τι θέλει ο ήρωας ή τι κερδίζει ο αναγνώστης.","Στη μυθοπλασία υπάρχει εμπόδιο."]},{"t":"Ο αναγνώστης σου με όνομα","p":"Φτιάξε το προφίλ ενός αναγνώστη σε 4 έως 5 γραμμές: όνομα, ηλικία, τι ξέρει ήδη για το θέμα, γιατί θα ανοίξει το βιβλίο σου και πού το διαβάζει.","h":"Γράψε ιδιαίτερα συγκεκριμένα πράγματα, όχι «ένας άνθρωπος που αγαπά τα βιβλία».","m":"«Ο Νίκος, 34 ετών, εργάζεται σε γραφείο και ταξιδεύει δύο ώρες τη μέρα με το τρένο. Ξέρει τα βασικά για τη φωτογραφία, αλλά δεν έχει ιδέα από φωτισμό. Θα διαβάσει το βιβλίο στο κινητό, σε μικρά κομμάτια των δέκα λεπτών. Θέλει να τραβά καλύτερες φωτογραφίες στα ταξίδια του.»","c":["Έχει όνομα και ηλικία.","Λέει τι ξέρει ήδη.","Λέει γιατί διαβάζει.","Δεν ισχύει για «όλους»."]},{"t":"Περίγραμμα πέντε σημείων και πρόγραμμα","p":"Γράψε το περίγραμμα του βιβλίου σου σε πέντε σημεία (πέντε κεφάλαια ή πέντε βασικά γεγονότα). Μετά πρόσθεσε έναν στόχο λέξεων ανά ημέρα και μία σταθερή ώρα γραφής.","h":"Υπολόγισε: στόχος ημέρας επί 100 ημέρες. Χωράει το βιβλίο που φαντάζεσαι;","m":"1. Η φαροφύλακας παραλαμβάνει τον φάρο.\n2. Έρχεται η επιστολή για το κλείσιμο.\n3. Οι κάτοικοι δεν τη βοηθούν.\n4. Η καταιγίδα δείχνει την αξία του φάρου.\n5. Ο φάρος μένει, με κόστος.\nΣτόχος: 300 λέξεις κάθε πρωί στις 7:00, 5 ημέρες την εβδομάδα. Σε 20 εβδομάδες: 30.000 λέξεις.","c":["Έχει πέντε σαφή σημεία.","Ο στόχος ημέρας είναι ρεαλιστικός.","Υπάρχει σταθερή ώρα.","Ο υπολογισμός συμφωνεί με το μέγεθος του βιβλίου."]}]},{"n":2,"title":"Πλοκή και δομή","mentor":{"name":"Κύριος Ιστορίας","role":"μέντορας της Αφήγησης","g":"lamp","line":"Η πλοκή δεν είναι «τι συμβαίνει». Είναι γιατί συμβαίνει ένα πράγμα και τι προκαλεί το επόμενο."},"lesson":[{"h":"Τι είναι η πλοκή","p":["Η **πλοκή** είναι η αλυσίδα των γεγονότων μιας ιστορίας, δεμένα μεταξύ τους με αιτία και αποτέλεσμα. Η διαφορά μεταξύ ιστορίας και πλοκής φαίνεται σε ένα κλασικό παράδειγμα:","> «Ο βασιλιάς πέθανε και μετά πέθανε και η βασίλισσα.» (ιστορία: δύο γεγονότα στη σειρά)\n> «Ο βασιλιάς πέθανε και η βασίλισσα πέθανε από τη λύπη της.» (πλοκή: το δεύτερο γεγονός έχει αιτία)","Όταν ο αναγνώστης νιώθει ότι «αυτό συνέβη επειδή συνέβη εκείνο», παρακολουθεί πλοκή. Όταν τα γεγονότα απλώς διαδέχονται το ένα το άλλο, η ιστορία μοιάζει με κατάλογο.","Η έννοια ισχύει και στη μη μυθοπλασία, με άλλη μορφή: κάθε κεφάλαιο ενός εγχειριδίου πρέπει να βγαίνει από το προηγούμενο και να προετοιμάζει το επόμενο."]},{"h":"Αρχή, μέση, τέλος: η τριμερής δομή","p":["Η πιο γνωστή δομή είναι τριμερής. Η **πρώτη πράξη** (αρχή) παρουσιάζει τον ήρωα, τον κόσμο του και το πρόβλημα που αναστατώνει τη ζωή του. Η **δεύτερη πράξη** (μέση) είναι η πάλη του ήρωα με τα εμπόδια, με αυξανόμενη δυσκολία. Η **τρίτη πράξη** (τέλος) φέρνει την κορύφωση και τη λύση.","Συχνά η αρχή καταλαμβάνει περίπου το ένα τέταρτο του έργου, η μέση το μισό και το τέλος το υπόλοιπο τέταρτο. Δεν είναι νόμος, είναι πρακτική παρατήρηση που βοηθά στον προγραμματισμό.","Ανάμεσα στις πράξεις υπάρχουν **σημεία καμπής** (plot points): γεγονότα που αλλάζουν την κατεύθυνση της ιστορίας, ώστε ο ήρωας να μην μπορεί να γυρίσει πίσω."]},{"h":"Σύγκρουση: η μηχανή της ιστορίας","p":["Χωρίς **σύγκρουση** δεν υπάρχει ιστορία. Ο ήρωας θέλει κάτι και κάτι ή κάποιος τον εμποδίζει. Η σύγκρουση μπορεί να είναι εξωτερική (με άλλον άνθρωπο, με τη φύση, με την κοινωνία) ή εσωτερική (με τον φόβο, την αμφιβολία, μια αντίθετη επιθυμία).","Οι καλύτερες ιστορίες συνδυάζουν και τα δύο. Μια φαροφύλακας παλεύει με την εταιρεία που θέλει να κλείσει τον φάρο (εξωτερική), αλλά και με τον φόβο ότι η προσπάθεια είναι μάταιη (εσωτερική).","Ερώτημα ελέγχου για κάθε σκηνή: «Τι θέλει ο ήρωας εδώ και τι τον εμποδίζει;» Αν δεν υπάρχει απάντηση, η σκηνή πιθανόν δεν χρειάζεται."]},{"h":"Κλιμάκωση, κορύφωση, λύση","p":["Τα εμπόδια πρέπει να **κλιμακώνονται**: κάθε ένα δυσκολότερο από το προηγούμενο. Αν ο ήρωας ξεπερνά εύκολα το πρώτο και το δεύτερο, αλλά το τρίτο είναι ευκολότερο, η ένταση πέφτει.","Η **κορύφωση** (climax) είναι το σημείο της μεγαλύτερης έντασης, όπου η κεντρική σύγκρουση λύνεται. Η **λύση** (resolution) δείχνει τις συνέπειες και αφήνει τον αναγνώστη να ηρεμήσει.","Η **ανατροπή** (twist) είναι απροσδόκητη στροφή. Λειτουργεί μόνο όταν, αφού την ακούσεις, σκεφτείς «βέβαια, τα στοιχεία ήταν εκεί». Μια ανατροπή που βγαίνει από το πουθενά απογοητεύει."]},{"h":"Γνωστές δομές αφήγησης","p":["Εκτός από την τριμερή, υπάρχουν και άλλες δομές. Δεν τις χρησιμοποιείς ως καλούπι, αλλά ως εργαλείο σκέψης:","- **Πυραμίδα του Φράιταγκ** (Freytag): έκθεση, ανοδική δράση, κορύφωση, καθοδική δράση, καταστροφή ή λύση.\n- **Ταξίδι του ήρωα** (hero's journey): ο ήρωας φεύγει από τον γνώριμο κόσμο, περνά δοκιμασίες και επιστρέφει αλλαγμένος. Συνδέεται με τον Τζόζεφ Κάμπελ και τον Κρίστοφερ Βόγκλερ.\n- **Κισότενκετσου** (kishōtenketsu): τετραμερής ιαπωνική δομή χωρίς απαραίτητη σύγκρουση: εισαγωγή, ανάπτυξη, ανατροπή, συμφιλίωση.","Η μαθησιακή αξία είναι να δεις ότι ο κόσμος αφηγείται με πολλούς τρόπους. Στην ενότητα Μνήμη θα βρεις συνοπτικά όλες αυτές τις δομές."]},{"h":"Δομή στη μη μυθοπλασία","p":["Ένα εγχειρίδιο ή ένα δοκίμιο δεν έχει ήρωα, έχει όμως **πορεία**. Ο αναγνώστης ξεκινά με ένα πρόβλημα ή μια απορία και φτάνει σε μια λύση ή μια κατανόηση. Κάθε κεφάλαιο έχει έναν στόχο και ολοκληρώνεται με μια σύνοψη.","Η συνηθισμένη διάταξη είναι: **πρόβλημα, εξήγηση, παράδειγμα, εφαρμογή, σύνοψη**. Ξεκινάς από ό,τι ξέρει ήδη ο αναγνώστης και προχωράς σταδιακά, χωρίς να υποθέτεις γνώσεις που δεν έδωσες.","Χρήσιμος κανόνας: κάθε κεφάλαιο ανοίγει με μια υπόσχεση («θα μάθεις να…») και κλείνει με έλεγχο ότι η υπόσχεση τηρήθηκε."]},{"h":"Οι πρώτες και οι τελευταίες σελίδες","p":["Η αρχή κρατά ή χάνει τον αναγνώστη. Ένα καλό ξεκίνημα (hook) εγείρει μια ερώτηση, δείχνει τον ήρωα μέσα σε κίνηση ή τοποθετεί αμέσως το πρόβλημα. Δεν χρειάζεται έκρηξη. Αρκεί ένα αίσθημα ότι «κάτι πρόκειται να συμβεί».","> Την ημέρα που ήρθε το έγγραφο για τον φάρο, η Μαρίνα γέμισε τις λάμπες με λάδι, σαν να ήξερε ότι θα τις χρειαστεί πριν από τον χειμώνα.","Το τέλος πρέπει να τηρεί τις υποσχέσεις της αρχής. Δεν χρειάζεται να είναι ευτυχισμένο, αλλά να έχει αίσθημα ολοκλήρωσης. Η μεγαλύτερη αμαρτία είναι το τέλος που δεν απαντά στο κεντρικό ερώτημα."]}],"sum":["Πλοκή = γεγονότα δεμένα με **αιτία και αποτέλεσμα**, όχι απλή σειρά.","Τριμερής δομή: **αρχή** (πρόβλημα), **μέση** (αγώνας και κλιμάκωση), **τέλος** (κορύφωση και λύση).","Χωρίς **σύγκρουση** (εξωτερική ή εσωτερική) δεν υπάρχει ιστορία.","Τα εμπόδια **κλιμακώνονται**. Η ανατροπή πρέπει να έχει προετοιμαστεί.","Μη μυθοπλασία: πρόβλημα, εξήγηση, παράδειγμα, εφαρμογή, σύνοψη, με στόχο ανά κεφάλαιο."],"ex":{"t":"Παράδειγμα: ιστορία και πλοκή","x":"Ιστορία: «Η Μαρίνα έφτασε στον φάρο. Έβρεξε. Ήρθε η επιστολή.»\nΠλοκή: «Η Μαρίνα έφτασε στον φάρο. Επειδή έβρεξε, η επιστολή έφτασε βρεγμένη. Επειδή δεν διαβαζόταν, τη διάβασε με καθυστέρηση, και πήρε το μήνυμα για το κλείσιμο μόλις μία εβδομάδα πριν.»"},"cards":[["Πλοκή","Η αλυσίδα των γεγονότων, δεμένα με αιτία και αποτέλεσμα."],["Τριμερής δομή","Αρχή (πρόβλημα), μέση (αγώνας), τέλος (κορύφωση και λύση)."],["Σημείο καμπής (plot point)","Γεγονός που αλλάζει την κατεύθυνση της ιστορίας, ώστε ο ήρωας να μην γυρίσει πίσω."],["Σύγκρουση","Αντίθεση ανάμεσα σε ό,τι θέλει ο ήρωας και σε ό,τι τον εμποδίζει. Εξωτερική ή εσωτερική."],["Κλιμάκωση","Κάθε εμπόδιο είναι δυσκολότερο από το προηγούμενο."],["Κορύφωση (climax)","Το σημείο της μεγαλύτερης έντασης, όπου λύνεται η κεντρική σύγκρουση."],["Λύση (resolution)","Δείχνει τις συνέπειες της κορύφωσης και αφήνει τον αναγνώστη να ηρεμήσει."],["Ανατροπή (twist)","Απροσδόκητη στροφή που, εκ των υστέρων, φαίνεται λογική επειδή είχε προετοιμαστεί."],["Hook (αγκίστρι)","Ο τρόπος που η αρχή κρατά τον αναγνώστη: ερώτηση, κίνηση, πρόβλημα."],["Δομή κεφαλαίου μη μυθοπλασίας","Πρόβλημα, εξήγηση, παράδειγμα, εφαρμογή, σύνοψη."]],"qs":[{"t":"mcq","q":"Τι είναι η πλοκή;","o":["Η αλυσίδα γεγονότων που συνδέονται με αιτία και αποτέλεσμα","Η λίστα των χαρακτήρων","Ο τίτλος της ιστορίας","Η περιγραφή του χώρου"],"why":"Η πλοκή συνδέει τα γεγονότα με αιτία και αποτέλεσμα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"«Ο βασιλιάς πέθανε και μετά πέθανε και η βασίλισσα» είναι πλοκή, επειδή αφηγείται δύο γεγονότα.","a":false,"why":"Είναι απλή σειρά γεγονότων. Για πλοκή χρειάζεται αιτία: «από τη λύπη της»."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Ο βασιλιάς πέθανε και η βασίλισσα πέθανε από τη λύπη της.»","o":["Πλοκή","Απλή σειρά γεγονότων"],"why":"Το δεύτερο γεγονός έχει αιτία."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Ο Νίκος ξύπνησε. Έφαγε. Έφυγε για τη δουλειά.»","o":["Απλή σειρά γεγονότων","Πλοκή"],"why":"Δεν υπάρχει αιτιακή σύνδεση, απλή διαδοχή."},{"t":"mcq","q":"Ποια είναι τα τρία μέρη της τριμερούς δομής;","o":["Αρχή, μέση, τέλος","Τίτλος, κείμενο, υπογραφή","Ήρωας, εχθρός, φίλος","Πρόλογος, επίλογος, ευχαριστίες"],"why":"Αρχή, μέση, τέλος."},{"t":"mcq","q":"Τι κάνει η πρώτη πράξη;","o":["Παρουσιάζει τον ήρωα, τον κόσμο και το πρόβλημα","Λύνει την ιστορία","Δίνει την κορύφωση","Περιέχει μόνο περιγραφές"],"why":"Παρουσιάζει τον ήρωα, τον κόσμο και το πρόβλημα."},{"t":"mcq","q":"Ποιο μέρος της τριμερούς δομής συνήθως καταλαμβάνει το μισό του έργου;","o":["Η μέση","Η αρχή","Το τέλος","Ο πρόλογος"],"why":"Η μέση περιέχει τον κύριο αγώνα και την κλιμάκωση."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Οι αναλογίες ένα τέταρτο, μισό, ένα τέταρτο είναι αυστηρός νόμος της αφήγησης.","a":false,"why":"Είναι πρακτική παρατήρηση, όχι νόμος."},{"t":"mcq","q":"Τι είναι το σημείο καμπής (plot point);","o":["Γεγονός που αλλάζει την κατεύθυνση της ιστορίας","Η τελευταία σελίδα","Ο τίτλος του κεφαλαίου","Μια περιγραφή τοπίου"],"why":"Αλλάζει την κατεύθυνση της ιστορίας."},{"t":"mcq","q":"Χωρίς ποιο στοιχείο δεν υπάρχει ιστορία;","o":["Σύγκρουση","Εικονογράφηση","Μακρύς πρόλογος","Πολλοί χαρακτήρες"],"why":"Η σύγκρουση κινεί την πλοκή."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Ο ήρωας παλεύει με τον φόβο ότι θα αποτύχει.","o":["Εσωτερική σύγκρουση","Εξωτερική σύγκρουση"],"why":"Η μάχη μέσα στον ήρωα είναι εσωτερική σύγκρουση."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Ο ήρωας αντιμετωπίζει μια καταιγίδα.","o":["Εξωτερική σύγκρουση","Εσωτερική σύγκρουση"],"why":"Η σύγκρουση με τη φύση είναι εξωτερική."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Η ηρωίδα πρέπει να επιλέξει ανάμεσα στην ελευθερία της και στην ασφάλεια της οικογένειάς της.","o":["Εσωτερική σύγκρουση","Εξωτερική σύγκρουση"],"why":"Η δύσκολη εσωτερική επιλογή είναι εσωτερική σύγκρουση."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Οι καλύτερες ιστορίες συχνά συνδυάζουν εξωτερική και εσωτερική σύγκρουση.","a":true,"why":"Έτσι η δράση έχει και συναισθηματικό βάθος."},{"t":"mcq","q":"Ποιο ερώτημα ελέγχει αν μια σκηνή χρειάζεται;","o":["Τι θέλει ο ήρωας εδώ και τι τον εμποδίζει;","Πόσες λέξεις έχει η σκηνή;","Πόσο όμορφη είναι η περιγραφή;","Σε ποια σελίδα βρίσκεται;"],"why":"Αν δεν υπάρχει θέλω και εμπόδιο, η σκηνή ίσως δεν χρειάζεται."},{"t":"mcq","q":"Τι σημαίνει κλιμάκωση;","o":["Κάθε εμπόδιο είναι δυσκολότερο από το προηγούμενο","Η ένταση παραμένει σταθερή","Τα εμπόδια γίνονται πιο εύκολα","Ο ήρωας αλλάζει ονομασία"],"why":"Κάθε εμπόδιο είναι δυσκολότερο από το προηγούμενο."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Αν το τρίτο εμπόδιο είναι ευκολότερο από το δεύτερο, η ένταση πέφτει.","a":true,"why":"Η κλιμάκωση απαιτεί αυξανόμενη δυσκολία."},{"t":"mcq","q":"Τι είναι η κορύφωση (climax);","o":["Το σημείο μέγιστης έντασης, όπου λύνεται η κεντρική σύγκρουση","Η πρώτη σκηνή","Ο πρόλογος","Ο τίτλος του βιβλίου"],"why":"Εκεί λύνεται η κεντρική σύγκρουση."},{"t":"mcq","q":"Τι κάνει η λύση (resolution);","o":["Δείχνει τις συνέπειες της κορύφωσης και αφήνει τον αναγνώστη να ηρεμήσει","Ξεκινά ένα νέο πρόβλημα","Παρουσιάζει νέο ήρωα","Αλλάζει το είδος του έργου"],"why":"Μετά την κορύφωση, δείχνει τι άλλαξε."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Μια ανατροπή λειτουργεί καλά όταν έχει προετοιμαστεί από στοιχεία που υπήρχαν ήδη.","a":true,"why":"Ο αναγνώστης λέει: «Βέβαια, τα σημάδια ήταν εκεί»."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Μια ανατροπή που βγαίνει από το πουθενά είναι πάντα η καλύτερη.","a":false,"why":"Απογοητεύει, επειδή δεν ήταν προετοιμασμένη."},{"t":"mcq","q":"Ποια δομή έχει τα μέρη: έκθεση, ανοδική δράση, κορύφωση, καθοδική δράση, λύση;","o":["Η πυραμίδα του Φράιταγκ","Το κισότεν","Η δομή του λογλάιν","Η δομή του πίνακα περιεχομένων"],"why":"Αυτή είναι η πυραμίδα του Φράιταγκ."},{"t":"mcq","q":"Ποια δομή έχει τέσσερα μέρη και δεν στηρίζεται απαραίτητα στη σύγκρουση;","o":["Το κισότεν","Η τριμερής δομή","Η πυραμίδα του Φράιταγκ","Η δομή του επιστημονικού άρθρου"],"why":"Το κισότεν είναι ιαπωνική τετραμερής δομή."},{"t":"mcq","q":"Σε ποια δομή ο ήρωας φεύγει από τον γνώριμο κόσμο, περνά δοκιμασίες και επιστρέφει αλλαγμένος;","o":["Το ταξίδι του ήρωα","Το κισότεν","Ο κατάλογος κεφαλαίων","Η πυραμίδα της τιμολόγησης"],"why":"Αυτό είναι το ταξίδι του ήρωα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Οι γνωστές δομές αφήγησης είναι καλούπια που πρέπει να ακολουθούνται πιστά.","a":false,"why":"Είναι εργαλεία σκέψης, όχι καλούπια."},{"t":"mcq","q":"Τι έχει η μη μυθοπλασία αντί για ήρωα;","o":["Μια πορεία από ένα πρόβλημα ή απορία σε μια λύση ή κατανόηση","Μόνο εικόνες","Μόνο ορισμούς","Μόνο ευχαριστίες"],"why":"Μια πορεία από το πρόβλημα στη λύση ή την κατανόηση."},{"t":"ord","q":"Βάλε στη σωστή σειρά τη συνηθισμένη διάταξη κεφαλαίου μη μυθοπλασίας.","lines":["Πρόβλημα","Εξήγηση","Παράδειγμα","Εφαρμογή","Σύνοψη"],"why":"Πρόβλημα, εξήγηση, παράδειγμα, εφαρμογή, σύνοψη."},{"t":"ord","q":"Βάλε τα μέρη της πυραμίδας του Φράιταγκ στη σειρά.","lines":["Έκθεση","Ανοδική δράση","Κορύφωση","Καθοδική δράση","Λύση"],"why":"Έκθεση, ανοδική δράση, κορύφωση, καθοδική δράση, λύση."},{"t":"ord","q":"Βάλε στη σειρά τις τρεις πράξεις.","lines":["Πρώτη πράξη: ο ήρωας και το πρόβλημα","Δεύτερη πράξη: ο αγώνας και η κλιμάκωση","Τρίτη πράξη: κορύφωση και λύση"],"why":"Πρώτη πράξη, δεύτερη πράξη, τρίτη πράξη."},{"t":"mcq","q":"Τι πρέπει να κάνει ένα καλό ξεκίνημα (hook);","o":["Να δημιουργεί την αίσθηση ότι κάτι πρόκειται να συμβεί","Να λέει όλο το τέλος","Να περιγράφει είκοσι σελίδες τοπίο","Να απαριθμεί όλους τους ήρωες"],"why":"Κρατά τον αναγνώστη με ερώτηση, κίνηση ή πρόβλημα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Ένα καλό ξεκίνημα απαιτεί πάντα έκρηξη ή καταδίωξη.","a":false,"why":"Αρκεί η αίσθηση ότι κάτι πρόκειται να συμβεί."},{"t":"mcq","q":"Τι πρέπει να κάνει το τέλος;","o":["Να τηρεί τις υποσχέσεις της αρχής και να απαντά στο κεντρικό ερώτημα","Να αγνοεί το κεντρικό ερώτημα","Να είναι πάντα ευτυχισμένο","Να είναι πάντα τραγικό"],"why":"Το τέλος τηρεί τις υποσχέσεις της αρχής."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Η ___ είναι το σημείο της μεγαλύτερης έντασης.","o":["κορύφωση","εισαγωγή","έκθεση","επιμέλεια"],"why":"Στην κορύφωση λύνεται η κεντρική σύγκρουση."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Η ___ δείχνει τις συνέπειες της κορύφωσης.","o":["λύση","κορύφωση","εισαγωγή","ανατροπή"],"why":"Η λύση ηρεμεί τον αναγνώστη."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Τα εμπόδια πρέπει να ___.","o":["κλιμακώνονται","μειώνονται","εξαφανίζονται","επαναλαμβάνονται αυτούσια"],"why":"Κλιμακώνονται, δηλαδή δυσκολεύουν διαρκώς."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Η σύγκρουση με τον φόβο είναι ___ σύγκρουση.","o":["εσωτερική","εξωτερική","ιστορική","τυπογραφική"],"why":"Η μάχη μέσα στον ήρωα είναι εσωτερική."},{"t":"mcq","q":"Σε ποια περίπτωση ένα κεφάλαιο εγχειριδίου είναι καλά δομημένο;","o":["Όταν έχει στόχο, εξήγηση, παράδειγμα, εφαρμογή και σύνοψη","Όταν έχει μόνο ορισμούς","Όταν δεν έχει σύνοψη","Όταν αλλάζει θέμα κάθε σελίδα"],"why":"Έχει στόχο, εξήγηση, παράδειγμα και σύνοψη."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στη μη μυθοπλασία καλό είναι να υποθέτεις γνώσεις που δεν έδωσες.","a":false,"why":"Ο αναγνώστης χάνεται· προχωράς σταδιακά, από ό,τι ήδη ξέρει."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Κάθε κεφάλαιο εγχειριδίου μπορεί να ανοίγει με μια υπόσχεση και να κλείνει με έλεγχο ότι τηρήθηκε.","a":true,"why":"Έτσι ο αναγνώστης ξέρει τι κερδίζει."},{"t":"mcq","q":"Γιατί η σύγκρουση πρέπει να κλιμακώνεται;","o":["Για να αυξάνεται η ένταση","Για να μεγαλώνει το βιβλίο","Για να μπουν περισσότερες περιγραφές","Για να υπάρχουν περισσότεροι ήρωες"],"why":"Η αυξανόμενη δυσκολία κρατά την ένταση."},{"t":"mcq","q":"Ποιο από τα παρακάτω είναι σημείο καμπής;","o":["Η Μαρίνα υπογράφει το χαρτί και δεν μπορεί να γυρίσει πίσω","Η Μαρίνα πίνει καφέ","Βρέχει ελαφρά","Ο τίτλος του κεφαλαίου"],"why":"Ο ήρωας δεν μπορεί πια να γυρίσει πίσω."},{"t":"mcq","q":"Ποιο ερώτημα ελέγχει μια ανατροπή;","o":["Υπήρχαν ενδείξεις νωρίτερα στο κείμενο;","Είναι αρκετά τρομακτική;","Είναι μεγάλη σε έκταση;","Έχει εικόνα;"],"why":"Αν τα στοιχεία υπήρχαν από πριν, η ανατροπή είναι δίκαιη."},{"t":"fix","q":"«Η Άννα βγήκε. Ήρθε ο Πέτρος. Έβρεξε.»","x":"Ποια διόρθωση μετατρέπει τη σειρά γεγονότων σε πλοκή;","o":["Η Άννα βγήκε και, επειδή έβρεξε, γύρισε. Έτσι συνάντησε τον Πέτρο.","Η Άννα βγήκε. Έβρεξε. Ήρθε ο Πέτρος.","Η Άννα βγήκε και ο Πέτρος έβρεξε.","Έβρεξε και η Άννα βγήκε και ο Πέτρος."],"why":"Ο σύνδεσμος αιτίας δένει τα γεγονότα."},{"t":"mcq","q":"Ποιο γεγονός ταιριάζει στην πρώτη πράξη;","o":["Ο ήρωας μαθαίνει ότι θα χάσει το σπίτι του","Ο ήρωας ζει ήρεμος μέχρι το τέλος του βιβλίου","Ο ήρωας κερδίζει τα πάντα εύκολα","Ο ήρωας δεν θέλει τίποτα"],"why":"Η πρώτη πράξη δείχνει το πρόβλημα που αναστατώνει τη ζωή του ήρωα."},{"t":"mcq","q":"Τι πρέπει να έχει κάθε κεφάλαιο εγχειριδίου;","o":["Στόχο και σύνοψη","Ήρωα και κακό","Διάλογο και ανατροπή","Έκρηξη"],"why":"Στόχο και σύνοψη."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στην ανατροπή αρκεί να αλλάξεις την κατεύθυνση απότομα, χωρίς προετοιμασία.","a":false,"why":"Η προετοιμασία κάνει την ανατροπή δίκαιη."},{"t":"mcq","q":"Σε ποια περίπτωση η εισαγωγή μιας νέας σκηνής αξίζει;","o":["Όταν προχωρά την πλοκή ή αλλάζει κάτι","Όταν είναι απλώς όμορφη","Όταν συμπληρώνει σελίδες","Όταν δεν συμβαίνει τίποτα"],"why":"Η σκηνή προχωρά την πλοκή ή αποκαλύπτει κάτι νέο."},{"t":"mcq","q":"Ποια πρόταση περιγράφει καλύτερα την εξωτερική σύγκρουση;","o":["Η αντιπαράθεση του ήρωα με άλλον άνθρωπο, με τη φύση ή με την κοινωνία","Η αμφιβολία του ήρωα για τον εαυτό του","Ο φόβος του ήρωα","Η μνήμη του ήρωα"],"why":"Η αντιπαράθεση με άλλον άνθρωπο, τη φύση ή την κοινωνία."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Ο δήμαρχος αρνείται να υπογράψει την παράταση.","o":["Εξωτερική σύγκρουση","Εσωτερική σύγκρουση"],"why":"Ένα εμπόδιο από άλλο πρόσωπο."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Η Μαρίνα αναρωτιέται αν τελικά αξίζει να αντισταθεί.","o":["Εσωτερική σύγκρουση","Εξωτερική σύγκρουση"],"why":"Η αμφιβολία είναι εσωτερική."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η λύση πρέπει πάντα να είναι ευτυχισμένη.","a":false,"why":"Πρέπει να έχει αίσθημα ολοκλήρωσης, όχι απαραίτητα ευτυχία."}],"labs":[{"t":"Από ιστορία σε πλοκή","p":"Πάρε τρία γεγονότα που τα έχεις διαλέξει εσύ (π.χ. «Η Άννα έχασε το λεωφορείο. Έβρεχε. Συνάντησε τον Πέτρο.») και ξαναγράψ' τα ώστε το κάθε ένα να προκαλεί το επόμενο. Χρησιμοποίησε «επειδή», «γι' αυτό», «και έτσι».","h":"Ρώτα σε κάθε γεγονός: «Γιατί συνέβη αυτό;» και «Τι προκάλεσε;»","m":"«Η Άννα έχασε το λεωφορείο επειδή πήγε πίσω να πάρει την ομπρέλα στη βροχή. Επειδή έχασε το λεωφορείο, περπάτησε στον δρόμο του Πέτρου. Έτσι συναντήθηκαν, και οι δύο μουσκεμένοι.»","c":["Κάθε γεγονός έχει αιτία.","Χρησιμοποιεί συνδέσμους αιτίας.","Η τελευταία πρόταση έχει συνέπεια."]},{"t":"Η σύγκρουση μιας σκηνής","p":"Επέλεξε μια σκηνή από το βιβλίο που σχεδιάζεις (ή κάποια φανταστική). Γράψε σε τρεις γραμμές: τι θέλει ο ήρωας, τι τον εμποδίζει και πώς ξεκαθαρίζει η σύγκρουση στο τέλος της σκηνής.","h":"Αν δεν υπάρχει εμπόδιο, ψάξε τι μπορεί να χαλάσει το σχέδιο του ήρωα.","m":"Θέλει: η Μαρίνα να πείσει τον δήμαρχο να υπογράψει παράταση.\nΕμποδίζει: ο δήμαρχος εξαρτάται από την εταιρεία που θέλει να κλείσει τον φάρο.\nΤέλος σκηνής: ο δήμαρχος αρνείται, αλλά της δίνει κατά λάθος ένα έγγραφο που αποδεικνύει ότι η εταιρεία προσπάθησε να αγοράσει τη γη.","c":["Λέει τι θέλει ο ήρωας.","Λέει τι τον εμποδίζει.","Η σκηνή τελειώνει με αλλαγή."]},{"t":"Τριμερές περίγραμμα σε τρεις προτάσεις","p":"Γράψε το βιβλίο σου ή μια ιστορία που φαντάζεσαι, σε τρεις προτάσεις: μία για την αρχή (πρόβλημα), μία για τη μέση (αγώνας) και μία για το τέλος (κορύφωση και λύση). Αν είναι μη μυθοπλασία, γράψε: από πού ξεκινά ο αναγνώστης, τι μαθαίνει ενδιάμεσα και πού καταλήγει.","h":"Η μέση πρέπει να έχει τουλάχιστον ένα εμπόδιο δυσκολότερο από το πρώτο.","m":"Αρχή: Η Μαρίνα παραλαμβάνει τον φάρο και μαθαίνει ότι πρόκειται να κλείσει.\nΜέση: Παλεύει με την εταιρεία και τους κατοίκους και κάθε εμπόδιο είναι μεγαλύτερο από το προηγούμενο.\nΤέλος: Στη μεγάλη καταιγίδα ο φάρος σώζει ένα πλοίο και η απόφαση ανατρέπεται, με κόστος για τη Μαρίνα.","c":["Έχει αρχή, μέση και τέλος.","Η μέση περιέχει κλιμάκωση.","Το τέλος απαντά στο πρόβλημα της αρχής."]}]},{"n":3,"title":"Χαρακτήρες και διάλογος","mentor":{"name":"Κυρία Μάσκα","role":"μέντορας των Χαρακτήρων","g":"chat","line":"Ο αναγνώστης θυμάται τους ανθρώπους, όχι τα γεγονότα. Δώσε στον ήρωά σου μια επιθυμία και ένα αδύνατο σημείο."},"lesson":[{"h":"Ο πρωταγωνιστής: επιθυμία και ανάγκη","p":["Ένας ζωντανός ήρωας έχει **επιθυμία** (want) και **ανάγκη** (need). Η επιθυμία είναι ό,τι ο ήρωας νομίζει ότι θέλει και κυνηγά ενεργά: να κερδίσει έναν διαγωνισμό, να βρει έναν θησαυρό, να κρατήσει ανοιχτό έναν φάρο. Η ανάγκη είναι αυτό που πραγματικά χρειάζεται για να αλλάξει ή να ολοκληρωθεί, και συχνά δεν το ξέρει.","Ανάμεσα στην επιθυμία και στην ανάγκη γεννιέται το ενδιαφέρον. Η φαροφύλακας θέλει να σώσει τον φάρο, αλλά πραγματικά χρειάζεται να μάθει να ζητά βοήθεια.","Ο ήρωας χρειάζεται και ένα **ελάττωμα** ή αδυναμία. Ο τέλειος ήρωας δεν έχει τίποτα να χάσει και τίποτα να μάθει, γι' αυτό είναι βαρετός."]},{"h":"Η αλλαγή του ήρωα","p":["Σε πολλές ιστορίες ο ήρωας αλλάζει. Η πορεία αυτή λέγεται **τόξο του χαρακτήρα** (character arc). Ένα απλό σχήμα: ο ήρωας πιστεύει κάτι λανθασμένο, η ιστορία τον πιέζει, φτάνει σε κρίση και στο τέλος είτε αλλάζει είτε αρνείται να αλλάξει και το πληρώνει.","Δεν αλλάζουν όλοι οι ήρωες. Στις σειρές με σταθερό πρωταγωνιστή (π.χ. ντετέκτιβ) ο ήρωας μένει ο ίδιος και αλλάζει ο κόσμος γύρω του. Το ζητούμενο είναι η επιλογή να είναι συνειδητή.","Για να πειστεί ο αναγνώστης, η αλλαγή πρέπει να έχει **αιτία** μέσα στην ιστορία και να γίνεται σταδιακά."]},{"h":"Δευτερεύοντες χαρακτήρες και ανταγωνιστής","p":["Γύρω από τον ήρωα υπάρχουν πρόσωπα με ρόλους. Ο **ανταγωνιστής** (αντίπαλος) εμποδίζει τον ήρωα. Ο **σύμμαχος** τον βοηθά. Ο **μέντορας** τον καθοδηγεί. Ο **καθρέφτης** είναι χαρακτήρας που δείχνει τι θα μπορούσε να γίνει ο ήρωας.","Ο ανταγωνιστής δεν χρειάζεται να είναι «κακός». Ένας καλός αντίπαλος έχει δικά του κίνητρα και, από τη δική του οπτική, έχει δίκιο. Η εταιρεία που θέλει να κλείσει τον φάρο μπορεί να έχει πραγματικά οικονομικά προβλήματα.","Κάθε δευτερεύων χαρακτήρας πρέπει να υπάρχει για λόγο: να ωθεί, να εμποδίζει ή να φωτίζει τον ήρωα. Αν μπορείς να τον αφαιρέσεις χωρίς να χαλάσει η ιστορία, ίσως δεν χρειάζεται."]},{"h":"Δείξε τον χαρακτήρα, μην τον ονομάζεις","p":["Υπάρχουν δύο τρόποι να παρουσιάσεις έναν χαρακτήρα. Ο **άμεσος χαρακτηρισμός** το λέει ευθέως: «Ήταν γενναίος.» Ο **έμμεσος χαρακτηρισμός** το δείχνει με πράξεις, λόγια και επιλογές.","> Άμεσος: «Ήταν γενναίος.»\n> Έμμεσος: «Άφησε το φανάρι στη βάρκα του μικρού και βγήκε μόνος στη θάλασσα.»","Ο έμμεσος είναι συνήθως πιο πειστικός, επειδή ο αναγνώστης βγάζει μόνος του το συμπέρασμα. Ο άμεσος χρησιμοποιείται σε μικρές δόσεις, κυρίως για ταχύτητα.","Βοηθούν και οι **συγκεκριμένες λεπτομέρειες**: ένας τρόπος να κρατά το φλιτζάνι, μια φράση που επαναλαμβάνει, ένα αντικείμενο που κουβαλά πάντα."]},{"h":"Κίνητρο και επιλογή","p":["Κάθε πράξη του ήρωα πρέπει να βγαίνει από **κίνητρο**. Αν ο αναγνώστης αναρωτιέται «γιατί το έκανε αυτό;» και δεν βρίσκει απάντηση, ο χαρακτήρας χάνει την αξιοπιστία του.","Ο χαρακτήρας φαίνεται καλύτερα όταν αναγκάζεται να επιλέξει κάτω από πίεση. Δεν δείχνει ποιος είναι όταν όλα πάνε καλά, αλλά όταν η επιλογή κοστίζει. Η δύσκολη επιλογή ανάμεσα σε δύο πράγματα που αγαπά ο ήρωας είναι από τα ισχυρότερα εργαλεία.","Ο ήρωας πρέπει να είναι **ενεργός**: να παίρνει αποφάσεις και να προκαλεί γεγονότα, όχι απλώς να τα υφίσταται."]},{"h":"Ο διάλογος και τι κάνει","p":["Ο διάλογος δεν είναι αντιγραφή της πραγματικής συζήτησης. Στην πραγματικότητα μιλάμε με κενά («εεε», «ξέρεις»), επαναλήψεις και εκτροπές. Στη λογοτεχνία κρατάμε τον ρυθμό και την αίσθηση, και κόβουμε τα περιττά.","Ένας καλός διάλογος κάνει τουλάχιστον ένα από τα εξής: **προωθεί την πλοκή**, **αποκαλύπτει τον χαρακτήρα** ή **αλλάζει τη σχέση** των προσώπων. Αν δεν κάνει τίποτα από αυτά, κόψ' τον.","Το **υπόρρητο νόημα** (subtext) είναι ό,τι εννοούν οι χαρακτήρες χωρίς να το λένε ευθέως. Όταν η Μαρίνα λέει «Ο καφές κρύωσε» και εννοεί «Άργησες», ο διάλογος έχει βάθος.","Κάθε χαρακτήρας πρέπει να μιλά με τον δικό του τρόπο: λέξεις, ρυθμό, μήκος προτάσεων. Αν καλύψεις τα ονόματα, ο αναγνώστης πρέπει να μαντεύει ποιος μιλά."]},{"h":"Πώς γράφεται ο διάλογος: ελληνικά και αγγλικά","p":["Βασικός κανόνας και στις δύο γλώσσες: **κάθε αλλαγή ομιλητή ξεκινά νέα γραμμή (παράγραφο)**. Με τον τρόπο αυτό ο αναγνώστης καταλαβαίνει ποιος μιλά.","Στα ελληνικά ο διάλογος γράφεται με **εισαγωγικά** « » ή με **παύλα** στην αρχή της γραμμής. Αν το «είπε» ακολουθεί, δεν βάζουμε τελεία μέσα στα εισαγωγικά: το κόμμα έρχεται μετά το κλείσιμο, και η ετικέτα γράφεται με μικρό.","> «Φεύγω», είπε η Μαρίνα.\n> «Πού πας;» ρώτησε εκείνος.\n> — Στον φάρο, είπε.","Στα αγγλικά χρησιμοποιούμε διπλά (αμερικανικά) ή μονά (βρετανικά) εισαγωγικά. Στις αμερικανικές συμβάσεις το κόμμα και η τελεία μπαίνουν **μέσα** στα εισαγωγικά.","> “I’m leaving,” Marina said.\n> “Where are you going?” he asked.\n> She said, “To the lighthouse.”","Για τις ετικέτες διαλόγου προτίμησε απλά ρήματα («είπε», «ρώτησε», said, asked). Γίνονται σχεδόν αόρατα και δεν αποσπούν την προσοχή. Μην προσπαθείς να αντικαταστήσεις το «είπε» με δεκάδες ρήματα όπως «αναφώνησε», «αντιγύρισε»."]}],"sum":["Ο ήρωας έχει **επιθυμία** (ό,τι νομίζει ότι θέλει) και **ανάγκη** (ό,τι πραγματικά χρειάζεται), και ένα **ελάττωμα**.","Ο καλός ανταγωνιστής έχει δικά του κίνητρα. Κάθε δευτερεύων χαρακτήρας έχει λόγο ύπαρξης.","**Δείξε**, μην ονομάζεις: ο έμμεσος χαρακτηρισμός πείθει περισσότερο από τον άμεσο.","Κάθε πράξη έχει **κίνητρο**. Ο χαρακτήρας αποκαλύπτεται σε δύσκολες επιλογές.","Ο διάλογος προωθεί πλοκή, αποκαλύπτει χαρακτήρα ή αλλάζει σχέσεις. **Νέα γραμμή για κάθε ομιλητή**. Ετικέτες: απλά ρήματα."],"ex":{"t":"Παράδειγμα: ίδιος διάλογος, δύο τρόποι","x":"Αδύναμος: «Ήμουν πολύ θυμωμένη», είπε η Μαρίνα θυμωμένα.\nΚαλύτερος: «Ο καφές κρύωσε», είπε η Μαρίνα και κοίταξε το ρολόι.\n\nEnglish: “I’m leaving,” Marina said. (σωστά)\nEnglish: “I’m leaving.” Marina said. (λάθος στίξη)"},"cards":[["Επιθυμία (want)","Ό,τι ο ήρωας νομίζει ότι θέλει και κυνηγά ενεργά."],["Ανάγκη (need)","Ό,τι ο ήρωας πραγματικά χρειάζεται για να αλλάξει ή να ολοκληρωθεί, συχνά χωρίς να το ξέρει."],["Τόξο χαρακτήρα (character arc)","Η πορεία αλλαγής του ήρωα μέσα στην ιστορία."],["Ανταγωνιστής","Ο χαρακτήρας που εμποδίζει τον ήρωα. Καλό είναι να έχει κίνητρα."],["Άμεσος χαρακτηρισμός","Ο αφηγητής λέει ευθέως πώς είναι ο χαρακτήρας («Ήταν γενναίος»)."],["Έμμεσος χαρακτηρισμός","Ο χαρακτήρας φαίνεται από πράξεις, λόγια και επιλογές."],["Κίνητρο","Ο λόγος για τον οποίο ο χαρακτήρας κάνει κάτι."],["Υπόρρητο νόημα (subtext)","Ό,τι εννοούν οι χαρακτήρες χωρίς να το λένε ευθέως."],["Ετικέτα διαλόγου (dialogue tag)","Το «είπε», «ρώτησε» (said, asked) που δείχνει ποιος μιλά."],["Στίξη διαλόγου","Νέα γραμμή για κάθε ομιλητή. Ελληνικά: « » ή παύλα. Αγγλικά: “ ”, κόμμα ή τελεία μέσα στα εισαγωγικά (αμερικανικό)."]],"qs":[{"t":"mcq","q":"Τι είναι η επιθυμία (want) του ήρωα;","o":["Ό,τι ο ήρωας νομίζει ότι θέλει και κυνηγά ενεργά","Ό,τι ο ήρωας ήδη έχει","Η περιγραφή του χαρακτήρα","Το όνομά του"],"why":"Η επιθυμία είναι ό,τι νομίζει ότι θέλει και κυνηγά."},{"t":"mcq","q":"Τι είναι η ανάγκη (need) του ήρωα;","o":["Ό,τι πραγματικά χρειάζεται για να αλλάξει ή να ολοκληρωθεί, συχνά χωρίς να το ξέρει","Ό,τι θέλει να αγοράσει","Το επάγγελμά του","Η ηλικία του"],"why":"Η ανάγκη είναι αυτό που πραγματικά χρειάζεται για να αλλάξει ή να ολοκληρωθεί."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το ενδιαφέρον της ιστορίας γεννιέται συχνά ανάμεσα στην επιθυμία και στην ανάγκη του ήρωα.","a":true,"why":"Η ένταση ανάμεσά τους δίνει βάθος."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Ο τέλειος ήρωας, χωρίς ελαττώματα, είναι ο πιο ενδιαφέρων.","a":false,"why":"Δεν έχει τίποτα να χάσει ούτε να μάθει."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Η Μαρίνα θέλει να σώσει τον φάρο.","o":["Επιθυμία","Ανάγκη"],"why":"Είναι αυτό που ο ήρωας κυνηγά ενεργά."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Η Μαρίνα πρέπει να μάθει να ζητά βοήθεια.","o":["Ανάγκη","Επιθυμία"],"why":"Είναι αυτό που πραγματικά χρειάζεται για να αλλάξει."},{"t":"mcq","q":"Τι είναι το τόξο του χαρακτήρα (character arc);","o":["Η πορεία αλλαγής του ήρωα μέσα στην ιστορία","Η περιγραφή του χαρακτήρα στην αρχή","Το εξώφυλλο του βιβλίου","Η πρόταση-υπόσχεση"],"why":"Είναι η πορεία αλλαγής του ήρωα."},{"t":"ord","q":"Βάλε τα στάδια του τόξου του χαρακτήρα στη σωστή σειρά.","lines":["Ο ήρωας πιστεύει κάτι λανθασμένο","Η ιστορία τον πιέζει","Φτάνει σε κρίση","Αλλάζει ή αρνείται να αλλάξει"],"why":"Λανθασμένη πεποίθηση, πίεση, κρίση, αλλαγή (ή άρνηση αλλαγής)."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Όλοι οι ήρωες πρέπει να αλλάζουν στο τέλος της ιστορίας.","a":false,"why":"Στις σειρές με σταθερό ήρωα αλλάζει συχνά ο κόσμος γύρω του."},{"t":"mcq","q":"Για να πείθει η αλλαγή του ήρωα, πρέπει να...","o":["έχει αιτία μέσα στην ιστορία και να γίνεται σταδιακά","γίνεται ξαφνικά στην τελευταία σελίδα","μην έχει καμία αιτία","γίνεται στο πρώτο κεφάλαιο"],"why":"Η αλλαγή χρειάζεται αιτία και σταδιακή εξέλιξη."},{"t":"mcq","q":"Τι ρόλο έχει ο ανταγωνιστής;","o":["Εμποδίζει τον ήρωα","Βοηθά πάντα τον ήρωα","Αφηγείται την ιστορία","Γράφει το
