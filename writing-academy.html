ρθε, είδε, έφυγε.","Ήρθε ,είδε ,έφυγε.","Ήρθε , είδε , έφυγε.","Ήρθε,είδε,έφυγε."],"why":"Κενό μετά, όχι πριν."},{"t":"mcq","q":"Ποια πρόταση έχει σωστά αποσιωπητικά;","o":["Δεν ξέρω...","Δεν ξέρω....","Δεν ξέρω..","Δεν ξέρω ."],"why":"Τρεις τελείες, χωρίς κενό πριν."},{"t":"mcq","q":"Πότε βάζεις άνω και κάτω τελεία;","o":["Πριν από μια απαρίθμηση ή διευκρίνιση","Στο τέλος κάθε πρότασης","Μετά από κάθε λέξη","Πριν από κάθε ρήμα"],"why":"Για να προαναγγείλεις απαρίθμηση ή διευκρίνιση."},{"t":"mcq","q":"Ποια πρόταση είναι σωστά στιγμένη;","o":["Νίκο, πού είσαι;","Νίκο πού, είσαι;","Νίκο, πού είσαι.","Νίκο, πού, είσαι;"],"why":"Χωρίζεται η προσφώνηση και κλείνει η ερώτηση."},{"t":"mcq","q":"Ποια παράθεση είναι σωστά γραμμένη στα ελληνικά;","o":["Είπε «θα έρθω».","Είπε <<θα έρθω>>.","Είπε 'θα έρθω'.","Είπε (θα έρθω)."],"why":"Με γκιγιμέ."},{"t":"mcq","q":"Τι κάνεις όταν μιλά νέος χαρακτήρας στον διάλογο;","o":["Αρχίζεις νέα γραμμή","Συνεχίζεις στην ίδια γραμμή","Αλλάζεις γραμματοσειρά","Βάζεις δύο κενά"],"why":"Νέα γραμμή για κάθε ομιλητή."}],"cat":"Στίξη (ελληνικά)"},{"n":"m3","title":"Στίξη και συχνά λάθη στα αγγλικά","mentor":{"name":"Δόκτωρ Κόμμα","role":"φύλακας της μνήμης","g":"glass","line":"Αν γράφεις στα αγγλικά, μάθε τα ασυνήθιστα λάθη: its και it's, κόμμα και ερωτηματικό."},"lesson":[{"h":"Κόμμα, ελληνικό ερωτηματικό και άνω τελεία στα αγγλικά","p":["Στα αγγλικά το ερωτηματικό είναι το **?** (όχι το ελληνικό ;). Το σημείο ; στα αγγλικά λέγεται **semicolon** και είναι κάτι άλλο.","Το **comma** (,) χωρίζει στοιχεία λίστας και ξεκινάει δευτερεύουσες φράσεις: «When she arrived, he left.» Πριν από τα «and», «but», «so» που ενώνουν δύο πλήρεις προτάσεις μπαίνει κόμμα: «She wrote, but he read.»","Το **Oxford comma** είναι το κόμμα πριν από το τελευταίο «and» σε λίστα: «apples, pears, and plums». Είναι θέμα ύφους. Διάλεξε ένα και κράτα το."]},{"h":"Comma splice και semicolon","p":["**Comma splice** είναι το λάθος να ενώσεις δύο πλήρεις προτάσεις με μόνο ένα κόμμα: «I wrote all day, I was tired.» Δεν είναι σωστό.","Τρεις τρόποι διόρθωσης: τελεία («I wrote all day. I was tired.»), semicolon («I wrote all day; I was tired.») ή σύνδεσμος («I wrote all day, and I was tired.»)","Το **colon** (:) μπαίνει μετά από πλήρη πρόταση και ανοίγει λίστα ή διευκρίνιση: «She packed three things: a pen, a book, and a lamp.»"]},{"h":"Απόστροφος: its και it's, κτητική","p":["**it's** = it is ή it has: «It's late.» **its** = δικό του (κτητική), χωρίς απόστροφο: «The dog wagged its tail.»","Κτητική ενικού: προσθέτεις **'s**: «the dog's bone». Κτητική πληθυντικού που τελειώνει σε s: προσθέτεις μόνο **'**: «the dogs' bones». Πληθυντικός χωρίς s: «children's books».","Ο απόστροφος **δεν** κάνει πληθυντικό: σωστό «two books», λάθος «two book's»."]},{"h":"Διάλογος και συχνά ζεύγη λέξεων","p":["Σε έναν διάλογο κάθε νέος ομιλητής ξεκινά **νέα παράγραφο**. Το κόμμα μπαίνει μέσα στα εισαγωγικά (αμερικανικό ύφος): «\"I'm coming,\" she said.»","**their** (δικό τους), **there** (εκεί), **they're** (they are). **your** (δικό σου), **you're** (you are). **then** (τότε), **than** (σύγκριση). **affect** (ρήμα, επηρεάζω), **effect** (ουσιαστικό, αποτέλεσμα). **lose** (χάνω), **loose** (χαλαρό).","Το **a lot** γράφεται με δύο λέξεις. Το «I» είναι πάντα κεφαλαίο."]}],"sum":["Στα αγγλικά ερωτηματικό = **?**. Το **;** είναι semicolon.","**Comma splice**: δύο πλήρεις προτάσεις με μόνο κόμμα. Διόρθωση: τελεία, semicolon ή σύνδεσμος.","**its** = δικό του. **it's** = it is. Ο απόστροφος δεν κάνει πληθυντικό.","Νέος ομιλητής = νέα παράγραφος."],"ex":{"t":"Παράδειγμα","x":"\"Is it your book?\" she asked.\n\"No, it's not mine,\" he said. \"The dog's tail knocked it over, but I found it.\""},"cards":[["its / it's","its = δικό του. it's = it is ή it has."],["Comma splice","Δύο πλήρεις προτάσεις με μόνο κόμμα. Διόρθωσέ το με τελεία, semicolon ή σύνδεσμο."],["Oxford comma","Κόμμα πριν από το τελευταίο and σε λίστα. Προαιρετικό, αλλά σταθερό."],["their / there / they're","δικό τους / εκεί / they are"],["your / you're","δικό σου / you are"],["then / than","then = τότε. than = σύγκριση."],["affect / effect","affect = ρήμα. effect = ουσιαστικό."],["a lot","Δύο λέξεις."]],"qs":[{"t":"mcq","q":"Ποιο είναι το ερωτηματικό στα αγγλικά;","o":["?",";",":","·"],"why":"Στα αγγλικά το ερωτηματικό είναι το ?."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στα αγγλικά το ερωτηματικό είναι το ;","a":false,"why":"Το ; λέγεται semicolon. Το ερωτηματικό είναι το ?."},{"t":"mcq","q":"Ποια πρόταση είναι σωστή;","o":["The dog wagged its tail.","The dog wagged it's tail.","The dog wagged its' tail.","The dog wagged it tail."],"why":"Κτητική: its χωρίς απόστροφο."},{"t":"mcq","q":"Ποια πρόταση είναι σωστή;","o":["It's raining.","Its raining.","It's' raining.","Its' raining."],"why":"it's = it is."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"The cat licked ___ paw.","o":["its","it's","its'","it is"],"why":"Κτητική, χωρίς απόστροφο."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"___ late, so let's go.","o":["It's","Its","Its'","It"],"why":"It is → it's."},{"t":"mcq","q":"Ποια φράση σημαίνει «το βιβλίο του συγγραφέα»;","o":["the writer's book","the writers book","the writers' book","the writer book's"],"why":"Κτητική ενικού: 's."},{"t":"mcq","q":"Ποια φράση σημαίνει «τα βιβλία των συγγραφέων»;","o":["the writers' books","the writer's books","the writers's books","the writers book's"],"why":"Πληθυντικός σε s: μόνο απόστροφος."},{"t":"mcq","q":"Ποια φράση είναι σωστή;","o":["two books","two book's","two books'","two bookes"],"why":"Ο απόστροφος δεν κάνει πληθυντικό."},{"t":"mcq","q":"Ποια φράση είναι σωστή;","o":["the children's books","the childrens' books","the childrens books","the children books'"],"why":"Πληθυντικός χωρίς s: 's."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η πρόταση «I wrote all day, I was tired.» είναι comma splice.","a":true,"why":"Δύο πλήρεις προτάσεις με μόνο κόμμα."},{"t":"mcq","q":"Ποιο ΔΕΝ διορθώνει το comma splice «I wrote all day, I was tired»;","o":["I wrote all day, I was tired also.","I wrote all day. I was tired.","I wrote all day; I was tired.","I wrote all day, and I was tired."],"why":"Το μόνο κόμμα δεν αρκεί."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το semicolon μπορεί να ενώσει δύο σχετικές πλήρεις προτάσεις.","a":true,"why":"Π.χ. I wrote all day; I was tired."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το colon μπαίνει μετά από πλήρη πρόταση που ανοίγει λίστα.","a":true,"why":"She packed three things: a pen, a book, a lamp."},{"t":"mcq","q":"Ποια πρόταση είναι σωστή;","o":["Put the book over there.","Put the book over their.","Put the book over they're.","Put the book over thair."],"why":"Εκεί = there."},{"t":"mcq","q":"Ποια πρόταση είναι σωστή;","o":["They're bringing their books over there.","Their bringing they're books over there.","There bringing their books over their.","They're bringing there books over they're."],"why":"They're = they are, their = δικά τους, there = εκεί."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Is that ___ umbrella?","o":["your","you're","yore","youre"],"why":"Δικό σου = your."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"___ right about the title.","o":["You're","Your","Yore","Youre"],"why":"You are → you're."},{"t":"mcq","q":"Συμπλήρωσε: «She is taller ___ her sister.»","o":["than","then","that","thann"],"why":"Σύγκριση: than."},{"t":"mcq","q":"Συμπλήρωσε: «First we read, ___ we write.»","o":["then","than","that","thenn"],"why":"Τότε: then."},{"t":"mcq","q":"Ποια φράση είναι σωστή;","o":["The noise can affect your focus.","The noise can effect your focus.","The noise can effect on your focus.","The noise can afect your focus."],"why":"Affect = ρήμα."},{"t":"mcq","q":"Ποια φράση είναι σωστή;","o":["The effect was clear.","The affect was clear.","The effct was clear.","The efect was clear."],"why":"Effect = ουσιαστικό."},{"t":"mcq","q":"Ποια φράση είναι σωστή;","o":["I do not want to lose it.","I do not want to loose it.","I do not want to loss it.","I do not want to loosen it."],"why":"Lose = χάνω."},{"t":"tf","q":"Σωστό ή λάθος;","x":"«A lot» γράφεται ως μία λέξη: «alot».","a":false,"why":"Γράφεται με δύο λέξεις: a lot."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το αγγλικό «I» γράφεται πάντα με κεφαλαίο.","a":true,"why":"Ακόμα και στη μέση πρότασης."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Μετά από πλήρη πρόταση, ανοίγει λίστα","o":[":",","],"why":"Το colon."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Ενώνει δύο σχετικές πλήρεις προτάσεις","o":[";",":"],"why":"Το semicolon."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Εννοώ «δικό τους»","o":["their","there"],"why":"their."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Εννοώ «δικό του» (για πράγμα)","o":["its","it's"],"why":"its."},{"t":"mcq","q":"Πού μπαίνει το κόμμα στον διάλογο (αμερικανικό ύφος);","o":["\"I'm coming,\" she said.","\"I'm coming\", she said.","\"I'm coming\" she, said.","I'm coming, \"she said.\""],"why":"Μέσα στα εισαγωγικά."},{"t":"mcq","q":"Τι κάνεις όταν μιλά νέος ομιλητής;","o":["Ξεκινάς νέα παράγραφο","Συνεχίζεις στην ίδια παράγραφο","Βάζεις colon","Γράφεις με κεφαλαία"],"why":"Νέα παράγραφος."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"I wrote all day___ I was tired. (διόρθωση με semicolon)","o":[";",":",",","?"],"why":"Semicolon: ;"}],"cat":"Στίξη (αγγλικά)"},{"n":"m4","title":"Λογοτεχνικοί όροι","mentor":{"name":"Φτερούλα Ρυθμού","role":"φύλακας των λέξεων","g":"feather","line":"Κάθε τέχνη έχει τις λέξεις της. Μάθε τις ώστε να μιλάς για το κείμενό σου με ακρίβεια."},"lesson":[{"h":"Εικόνες και σχήματα λόγου","p":["Η **μεταφορά** λέει ότι κάτι *είναι* κάτι άλλο, χωρίς «σαν»: «Ο χρόνος είναι κλέφτης.» Η **παρομοίωση** συγκρίνει με «σαν» ή «όπως»: «Ήταν ήσυχη σαν λίμνη χωρίς αέρα.»","Η **προσωποποίηση** δίνει ανθρώπινες ιδιότητες σε κάτι που δεν είναι άνθρωπος: «Ο άνεμος ψιθύριζε στα παράθυρα.» Η **υπερβολή** μεγεθύνει για έμφαση: «Στο έχω πει εκατό φορές.»","Το **οξύμωρο** ενώνει δύο αντίθετες έννοιες: «ηχηρή σιωπή». Η **ειρωνεία** λέει το αντίθετο από αυτό που εννοεί: «Τι υπέροχος καιρός!» ενώ βρέχει καταρρακτωδώς."]},{"h":"Σύμβολο και αλληγορία","p":["Ο **συμβολισμός** κάνει ένα αντικείμενο, μια εικόνα ή μια πράξη να δηλώνει κάτι πέρα από τον εαυτό της: ένας φάρος μπορεί να συμβολίζει την ελπίδα.","Η **αλληγορία** είναι ολόκληρη ιστορία με δεύτερο, κρυμμένο νόημα. Το μυθιστόρημα «Η φάρμα των ζώων» του Τζορτζ Όργουελ διαβάζεται ως αλληγορία πολιτικών γεγονότων.","Το **θέμα** είναι η βασική ιδέα του έργου (π.χ. η απώλεια). Το **μοτίβο** είναι ένα στοιχείο που επανέρχεται (π.χ. η βροχή)."]},{"h":"Αφηγηματικές τεχνικές","p":["Ο **πρωτοπρόσωπος αφηγητής** μιλά με «εγώ» και ξέρει μόνο όσα βλέπει ή σκέφτεται. Ο **τριτοπρόσωπος** μιλά με «αυτός/αυτή». Ο **παντογνώστης** αφηγητής ξέρει τις σκέψεις όλων των χαρακτήρων.","Η **αναδρομή** (flashback) πηγαίνει πίσω στον χρόνο. Η **προοικονομία** (foreshadowing) υπονοεί από νωρίς κάτι που θα συμβεί αργότερα.","Η **κορύφωση** είναι το σημείο της μεγαλύτερης έντασης. Η **λύση** κλείνει τις εκκρεμότητες."]}],"sum":["Μεταφορά: *είναι*. Παρομοίωση: *σαν*.","Προσωποποίηση = ανθρώπινες ιδιότητες σε μη ανθρώπινο. Υπερβολή = μεγέθυνση. Ειρωνεία = λέω το αντίθετο.","Σύμβολο = κάτι δηλώνει κάτι άλλο. Αλληγορία = ολόκληρη ιστορία με δεύτερο νόημα.","Αφηγητής: πρωτοπρόσωπος, τριτοπρόσωπος, παντογνώστης. Αναδρομή = πίσω στον χρόνο. Προοικονομία = υπαινιγμός για το μέλλον."],"ex":{"t":"Παράδειγμα","x":"«Ο άνεμος ψιθύριζε στα παράθυρα (προσωποποίηση). Ήταν ήσυχη σαν λίμνη χωρίς αέρα (παρομοίωση). Ο φάρος έμενε αναμμένος (σύμβολο ελπίδας).»"},"cards":[["Μεταφορά","Κάτι *είναι* κάτι άλλο, χωρίς «σαν»."],["Παρομοίωση","Σύγκριση με «σαν» ή «όπως»."],["Προσωποποίηση","Ανθρώπινες ιδιότητες σε μη ανθρώπινο."],["Υπερβολή","Μεγέθυνση για έμφαση."],["Οξύμωρο","Δύο αντίθετες έννοιες μαζί: ηχηρή σιωπή."],["Ειρωνεία","Λέω το αντίθετο από αυτό που εννοώ."],["Αναδρομή (flashback)","Επιστροφή σε προηγούμενο χρόνο."],["Προοικονομία","Υπαινιγμός για κάτι που θα συμβεί αργότερα."]],"qs":[{ μεγάλη δοκιμασία και **επιστρέφει** αλλαγμένος.","Δεν χρειάζεται να ακολουθείς όλα τα στάδια. Είναι εργαλείο, όχι κανόνας."]},{"h":"Άλλες δομές","p":["Η **in medias res** ξεκινά από τη μέση της δράσης και εξηγεί το παρελθόν αργότερα.","Το **Snowflake** της μεθόδου του Ράντι Ίνγκερμανσον ξεκινά από μία πρόταση και την επεκτείνει σταδιακά σε παράγραφο, χαρακτήρες και σκηνές.","Το **κισότεν** (kishōtenketsu) είναι μια ασιατική δομή τεσσάρων μερών (εισαγωγή, ανάπτυξη, ανατροπή, συμφιλίωση) που δεν στηρίζεται απαραίτητα σε σύγκρουση."]}],"sum":["Τριμερής δομή: αρχή, μέση, τέλος, με δύο σημεία καμπής.","Πυραμίδα του Φράιταγκ: έκθεση, ανοδική δράση, κορύφωση, καθοδική δράση, λύση.","Ταξίδι του ήρωα: συνηθισμένος κόσμος, πρόσκληση, δοκιμασίες, μεγάλη δοκιμασία, επιστροφή.","In medias res: ξεκινάς από τη μέση της δράσης."],"ex":{"t":"Παράδειγμα","x":"Μια φαροφύλακας (συνηθισμένος κόσμος) μαθαίνει ότι ο φάρος θα κλείσει (πρόσκληση / πρόβλημα). Παλεύει να τον σώσει (δοκιμασίες) και φτάνει σε μια μεγάλη καταιγίδα (κορύφωση). Ο φάρος μένει ανοιχτός και εκείνη έχει αλλάξει (επιστροφή)."},"cards":[["Τριμερής δομή","Αρχή, μέση, τέλος."],["Πυραμίδα Φράιταγκ","Έκθεση, ανοδική δράση, κορύφωση, καθοδική δράση, λύση."],["Ταξίδι του ήρωα","Ο ήρωας φεύγει, δοκιμάζεται και επιστρέφει αλλαγμένος."],["In medias res","Ξεκινάς από τη μέση της δράσης."],["Snowflake","Ξεκινάς από μία πρόταση και επεκτείνεις σταδιακά."],["Κισότεν","Δομή τεσσάρων μερών που δεν χρειάζεται σύγκρουση."],["Σημείο καμπής","Γεγονός που αλλάζει την κατεύθυνση της ιστορίας."],["Κορύφωση","Η στιγμή της μεγαλύτερης έντασης."]],"qs":[{"t":"mcq","q":"Πόσα μέρη έχει η τριμερής δομή;","o":["Τρία","Δύο","Πέντε","Επτά"],"why":"Αρχή, μέση, τέλος."},{"t":"mcq","q":"Ποια είναι τα μέρη της τριμερούς δομής;","o":["Αρχή, μέση, τέλος","Τίτλος, κείμενο, πηγές","Έκθεση, κορύφωση, λύση, επίλογος","Εισαγωγή, ανάπτυξη, ανατροπή, συμφιλίωση"],"why":"Αρχή, μέση, τέλος."},{"t":"mcq","q":"Πόσα στάδια έχει η πυραμίδα του Φράιταγκ;","o":["Πέντε"," σότεν","Πυραμίδα Φράιταγκ","Κανείς"],"why":"Snowflake."},{"t":"mcq","q":"Ποια ιστορία τελειώνει όταν ο ήρωας «επιστρέφει» αλλαγμένος;","o":["Ταξίδι του ήρωα","Πυραμίδα Φράιταγκ","Κισότεν","In medias res"],"why":"Αυτό είναι το ταξίδι του ήρωα."},{"t":"mcq","q":"Τι περιέχει συνήθως το μεσαίο τμήμα της τριμερούς δομής;","o":["Εμπόδια, ανατροπές και κλιμάκωση","Μόνο την παρουσίαση του κόσμου","Μόνο τη λύση","Μόνο τον τίτλο"],"why":"Εμπόδια, ανατροπές, κλιμάκωση."},{"t":"mcq","q":"Τι γίνεται συνήθως στην αρχή της τριμερούς δομής;","o":["Παρουσιάζεται ο κόσμος και το πρόβλημα","Λύνεται το πρόβλημα","Πεθαίνει ο ήρωας","Γράφεται ο επίλογος"],"why":"Παρουσιάζεται ο κόσμος και το πρόβλημα."}],"cat":"Δομές πλοκής"},{"n":"m6","title":"Τυπογραφία και εκδοτικοί όροι","mentor":{"name":"Κύριος Τόμος","role":"φύλακας του εντύπου","g":"archive","line":"Όταν μιλάς με τυπογράφο, θέλεις να καταλαβαίνεις τις λέξεις του. Εδώ είναι οι βασικές."},"lesson":[{"h":"Γραμματοσειρές και διαστήματα","p":["Οι γραμματοσειρές **με πατούρες** (serif) έχουν μικρά «ποδαράκια» στα άκρα των γραμμάτων και χρησιμοποιούνται συχνά σε βιβλία. Οι **χωρίς πατούρες** (sans serif) είναι πιο απλές και συνηθίζονται σε οθόνες και τίτλους.","Το **μέγεθος** μετριέται σε **στιγμές** (points, pt). Το **διάστιχο** (leading) είναι η απόσταση ανάμεσα στις γραμμές. Το **tracking** είναι η απόσταση ανάμεσα στα γράμματα σε όλο το κείμενο. Το **kerning** ρυθμίζει την απόσταση ανάμεσα σε συγκεκριμένο ζεύγος γραμμάτων.","Τα **περιθώρια** είναι ο κενός χώρος γύρω από το κείμενο. Σε έντυπο χρειάζεται μεγαλύτερο εσωτερικό περιθώριο, ώστε το κείμενο να μην χάνεται στη ράχη."]},{"h":"Παύλες και εισαγωγικά","p":["Το **ενωτικό** ( - ) ενώνει λέξεις ή χωρίζει λέξη στο τέλος γραμμής. Η **μεγάλη παύλα** ( — ) χρησιμοποιείται σε διαλόγους και παρενθετικές φράσεις. Η **μέση παύλα** ( – ) δείχνει εύρος: «σελίδες 10–20».","Κράτα τα ίδια εισαγωγικά σε όλο το βιβλίο: « » για τα ελληνικά. Το σωστό σημάδι κάνει το κείμενο επαγγελματικό."]},{"h":"Τα μέρη του βιβλίου","p":["**Εξώφυλλο** (μπροστά), **πίσω εξώφυλλο** (με την περιγραφή), **ράχη** (η πλευρά που φαίνεται στο ράφι) και **αυτιά** ή φτερά (οι εσωτερικές αναδιπλούμενες άκρες σε μερικές εκδόσεις).","Στην αρχή: **σελίδα τίτλου**, **αφιέρωση**, **περιεχόμενα**, **πρόλογος** ή **εισαγωγή**. Στο τέλος: **επίλογος**, **παράρτημα**, **βιβλιογραφία**, **ευρετήριο**, **ευχαριστίες**.","Το **ευρετήριο** είναι λίστα όρων με τις σελίδες που εμφανίζονται. Η **βιβλιογραφία** είναι η λίστα των πηγών. Η **υποσημείωση** είναι σημείωση στο κάτω μέρος της σελίδας."]},{"h":"Διαδικασία έκδοσης","p":["Το **χειρόγραφο** (ή δακτυλογραφημένο) είναι το κείμενο πριν από την έκδοση. Το **τυπογραφικό δοκίμιο** είναι δείγμα της σελίδας όπως θα τυπωθεί, για να διορθωθούν τα λάθη. Η **επιμέλεια** είναι ο έλεγχος περιεχομένου και ύφους. Η **διόρθωση** (proofreading) είναι ο τελικός έλεγχος για ορθογραφικά και τυπογραφικά λάθη.","Τα σχήματα χαρτιού: το **A4** είναι 21 × 29,7 εκ. και το **A5** είναι το μισό του A4, δηλαδή 14,8 × 21 εκ. Συνηθισμένο σχήμα βιβλίου είναι το A5 ή κάτι κοντά σε αυτό."]}],"sum":["Serif = με πατούρες (βιβλία). Sans serif = χωρίς (οθόνες, τίτλοι).","Διάστιχο = ανάμεσα στις γραμμές. Tracking = όλο το κείμενο. Kerning = ζεύγος γραμμάτων.","Ενωτικό - , μεγάλη παύλα — , μέση παύλα – (εύρος).","Ευρετήριο = όροι και σελίδες. Βιβλιογραφία = πηγές. Υποσημείωση = κάτω στη σελίδα.","A5 είναι το μισό του A4."],"ex":{"t":"Παράδειγμα","x":"Γραμματοσειρά serif, 11 pt, διάστιχο 15 pt, μέγεθος A5 (14,8 × 21 εκ.), τα εισαγωγικά « » σε όλο το βιβλίο και εύρος σελίδων γραμμένο με μέση παύλα: 10–20."},"cards":[["Serif","Γραμματοσειρά με πατούρες."],["Sans serif","Γραμματοσειρά χωρίς πατούρες."],["Διάστιχο (leading)","Απόσταση ανάμεσα στις γραμμές."],["Kerning","Απόσταση ανάμεσα σε συγκεκριμένο ζεύγος γραμμάτων."],["Περιθώρια","Κενός χώρος γύρω από το κείμενο."],["Ευρετήριο","Λίστα όρων με τις σελίδες που εμφανίζονται."],["Βιβλιογραφία","Λίστα των πηγών."],["A5","14,8 × 21 εκ., το μισό του A4."]],"qs":[{"t":"mcq","q":"Ποια γραμματοσειρά έχει «ποδαράκια» στα άκρα των γραμμάτων;","o":["Serif","Sans serif","Και οι δύο το ίδιο","Καμία"],"why":"Η serif έχει πατούρες."},{"t":"mcq","q":"Ποια γραμματοσειρά δεν έχει πατούρες;","o":["Sans serif","Serif","Και οι δύο","Καμία"],"why":"Sans serif."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Οι γραμματοσειρές με πατούρες χρησιμοποιούνται συχνά στο κυρίως κείμενο των βιβλίων.","a":true,"why":"Γενικά διαβάζονται άνετα σε έντυπο."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το μέγεθος των γραμμάτων μετριέται σε στιγμές (pt).","a":true,"why":"Π.χ. 11 pt."},{"t":"mcq","q":"Τι είναι το διάστιχο;","o":["Η απόσταση ανάμεσα στις γραμμές","Η απόσταση ανάμεσα σε δύο ζεύγη γραμμάτων","Το πάχος των γραμμάτων","Το μέγεθος της σελίδας"],"why":"Η απόσταση ανάμεσα στις γραμμές."},{"t":"mcq","q":"Τι είναι το kerning;","o":["Η απόσταση ανάμεσα σε συγκεκριμένο ζεύγος γραμμάτων","Η απόσταση ανάμεσα στις γραμμές","Το χρώμα του χαρτιού","Το μέγεθος του εξωφύλλου"],"why":"Απόσταση ανάμεσα σε συγκεκριμένο ζεύγος γραμμάτων."},{"t":"mcq","q":"Τι είναι το tracking;","o":["Η απόσταση ανάμεσα στα γράμματα σε όλο το κείμενο","Η απόσταση ανάμεσα στις γραμμές","Ο τίτλος","Ο αριθμός σελίδων"],"why":"Η απόσταση ανάμεσα στα γράμματα σε όλο το κείμενο."},{"t":"mcq","q":"Τι είναι τα περιθώρια;","o":["Ο κενός χώρος γύρω από το κείμενο","Οι υποσημειώσεις","Το εξώφυλλο","Η ράχη"],"why":"Ο κενός χώρος γύρω από το κείμενο."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στο έντυπο, το εσωτερικό περιθώριο (προς τη ράχη) χρειάζεται συνήθως περισσότερο χώρο.","a":true,"why":"Για να μη χάνεται το κείμενο στη ράχη."},{"t":"mcq","q":"Ποιο σημάδι χρησιμοποιείς για εύρος σελίδων, π.χ. 10 έως 20;","o":["Μέση παύλα (–)","Ενωτικό (-) πάντα","Θαυμαστικό","Άνω τελεία"],"why":"Η μέση παύλα δείχνει εύρος."},{"t":"mcq","q":"Ποιο σημάδι ενώνει λέξεις ή χωρίζει λέξη στο τέλος γραμμής;","o":["Ενωτικό (-)","Μεγάλη παύλα (—)","Τελεία","Αποσιωπητικά"],"why":"Το ενωτικό."},{"t":"tf","q":"Σωστό ή /* ---------- building quiz items ---------- */
function mkQ(c, i) {
  const q = c.qs[i], it = { kind: "q", id: qid(c.n, i), ch: c.n, type: q.t, q: q.q, x: q.x, why: q.why };
  if (q.t === "tf") { it.opts = ["Σωστό", "Λάθος"]; it.correct = q.a ? 0 : 1; }
  else if (q.t === "ord") { it.lines = q.lines; it.pool = shuffle(q.lines.map((x, k) => k)); if (it.pool.every((v, k) => v === k)) it.pool.reverse(); it.pick = []; }
  else { const idx = shuffle(q.o.map((x, k) => k)); it.opts = idx.map(k => q.o[k]); it.correct = idx.indexOf(0); }
  return it;
}
const mkT = (n, i) => { const c = findC(n); return { kind: "card", id: tid(n, i), deck: "t", front: c.cards[i][0], back: c.cards[i][1], label: "Θεωρία · " + unitLabel(c), ch: n }; };
const mkA = i => ({ kind: "card", id: aid(i), deck: "a", front: AR[i].k, a: AR[i], label: "Κανόνας · " + AR[i].c });
function mkAQ(i) {
  const a = AR[i], same = AR.map((x, k) => k).filter(k => k !== i && AR[k].c === a.c && AR[k].k !== a.k);
  const pool = shuffle(same).slice(0, 3).map(k => AR[k].k);
  const all = shuffle(AR.map(x => x.k).filter(s => s !== a.k && pool.indexOf(s) < 0));
  while (pool.length < 3) pool.push(all.shift());
  const opts = shuffle([a.k].concat(pool));
  return { kind: "q", id: aid(i), isRef: true, type: "mcq", q: "Ποιος όρος ή κανόνας περιγράφεται εδώ;", x: a.d, opts, correct: opts.indexOf(a.k), why: a.k + ": " + a.d };
}
function pickPriority(ids, getRec, count) {
  const t = TODAY(), due = [], fr = [], rest = [];
  ids.forEach(x => { const r = getRec(x); if (!r || ((r[2] || 0) === 0 && r[0] === 0)) fr.push(x); else if (r[1] <= t) due.push(x); else rest.push(x); });
  rest.sort((a, b) => getRec(a)[0] - getRec(b)[0]);
  return shuffle(due).concat(shuffle(fr), rest).slice(0, count);
}
function start(mode, items, extra) {
  Q = Object.assign({ honors0: honorKeys(), mode, items, i: 0, answered: false, results: [], xp: 0, flipped: false, sheet: false }, extra || {});
  view = { name: "quiz" }; render(); window.scrollTo(0, 0);
}
function startRound(n, boss) {
  const c = findC(n), ids = c.qs.map((q, i) => i);
  const chosen = boss ? shuffle(ids).slice(0, 10) : pickPriority(ids, i => qRec(qid(n, i)), 8);
  start(boss ? "boss" : "round", shuffle(chosen).map(i => mkQ(c, i)), { ch: n, title: (boss ? "Διαγώνισμα · " : "Γύρος · ") + unitLabel(c) });
}
function fromRef(r) { return r.kind === "q" ? mkQ(findC(r.ch), r.i) : r.kind === "t" ? mkT(r.ch, r.i) : mkA(r.i); }
const refPick = (cat, n) => pickPriority(AR.map((a, i) => i).filter(i => cat === "Όλα" || AR[i].c === cat), i => kRec(aid(i)), n);

    '<section class="card"><div class="title-m">Οι βιβλιοθήκες σου</div><div style="margin-top:6px">' + ZONES.map((z, i) => {
      const st = zs[i], list = z.ns.length > 1 ? z.ns.length + " ενότητες μνήμης" : "κεφάλαιο " + z.ns[0];
      return '<div class="zrow ' + (st.done ? "" : "locked") + '" ' + zst(z) + ">" + shelf(z) + '<div class="sp"><div style="font-weight:700">' + esc(z.name) + '</div><div class="small muted">' + list + '</div><div class="bar" style="margin-top:6px"><i style="width:' + Math.round(100 * st.pass / st.total) + '%"></i></div></div><div style="text-align:right"><div style="font-weight:700;font-variant-numeric:tabular-nums">' + st.pass + "/" + st.total + "</div>" + (st.done ? '<span class="chip good">ανοιχτή</span>' : "") + "</div></div>";
    }).join("") + "</div></section>" +
    (club ? '<section class="club"><div class="tw">ΛΕΣΧΗ ΓΡΑΦΕΩΝ</div><div class="label" style="color:#A7B6D4">Κάρτα μέλους</div><div class="mname">' + esc(nm || "Γραφέας της Ακαδημίας") + '</div><div class="row wrap" style="gap:18px"><div><div class="small" style="color:#A7B6D4">Βαθμίδα</div><b>' + lv.name + '</b></div><div><div class="small" style="color:#A7B6D4">Μέλος από</div><b>' + fmtDate(S.club) + '</b></div><div><div class="small" style="color:#A7B6D4">Κωδικός</div><b>ΛΓ-' + (1000 + hash(nm || "grafeas") % 9000) + '</b></div></div><p class="small" style="color:#D3DCEE">Ανήκεις στους γραφείς που κατέκτησαν τις βάσεις, την αφήγηση και τους χαρακτήρες. Ο επόμενος στόχος: το ύφος, η επιμέλεια και η έκδοση.</p></section>'
      : '<section class="club locked"><div class="tw">ΛΕΣΧΗ ΓΡΑΦΕΩΝ · κλειδωμένη</div><div class="title-m">Η λέσχη των γραφέων</div><p class="small muted">Ξεκλειδώνει όταν περάσεις τα διαγωνίσματα των κεφαλαίων 1, 2 και 3.</p><div class="bar"><i style="width:' + Math.round(100 * clubHave / clubNeed) + '%;background:var(--z2)"></i></div><p class="small muted">' + clubHave + " από " + clubNeed + " διαγωνίσματα</p></section>") +
    '<section class="card"><div class="title-m">Επιτεύγματα</div><div class="badges" style="margin-top:12px">' + HONORS.filter(h => h.t === "b" || h.t === "z").map(h => '<div class="badge ' + (h.f() ? "on" : "off") + '" style="--zc:var(--' + h.c + ');--zs:var(--' + h.c + 's)"><span class="bi">' + (h.f() ? ICON.star : ICON.lock) + "</span><b>" + esc(h.n) + '</b><span class="small muted">' + esc(h.d) + "</span></div>").join("") + "</div></section>" +
    '<section style="display:flex;flex-direction:column;gap:12px"><div class="title-m">Πιστοποιητικό</div>' +
    (cert ? "" : '<div class="card soft"><b>Σου λείπουν ' + missing.length + " από " + total + " διαγωνίσματα.</b><p class=\"small muted\" style=\"margin:6px 0 10px\">Το πιστοποιητικό ξεκλειδώνει όταν περάσεις και τα 6 κεφάλαια και τις 6 ενότητες μνήμης με 80% και πάνω.</p><div class=\"chips\" style=\"flex-wrap:wrap;overflow:visible\">" + missing.slice(0, 12).map(c => '<button class="chip" data-act="openCh" data-n="' + c.n + '">' + (isM(c) ? esc(c.cat) : "Κεφ. " + c.n) + "</button>").join("") + "</div></div>") +
    '<div class="cert ' + (cert ? "" : "locked") + '"><div class="cert-in"><div class="cert-seal">Π</div><div class="uni">Ακαδημία Γραφής «Πένα και Μελάνι»</div><div class="cert-title">Πιστοποιητικό<br>Συγγραφής Βιβλίου</div><p>Πιστοποιείται ότι</p><div class="cert-name">' + esc(nm || "Το όνομά σου") + "</div><p>ολοκλήρωσε με επιτυχία το πρόγραμμα «Γράφω βιβλίο από το μηδέν»: " + CH.length + " κεφάλαια και " + MS.length + " ενότητες μνήμης, με επιτυχία σε όλα τα " + total + " διαγωνίσματα.</p>" +
    '<div class="sigs"><div class="sig"><div class="sg">Iris Quill</div><div class="sl"></div><small>Δρ. Iris Quill<br>Κοσμήτορας Σχολής Αφήγησης</small></div><div class="sig"><div class="sg">Orion Vellum</div><div class="sl"></div><small>Καθ. Orion Vellum<br>Πρύτανης της Ακαδημίας</small></div><div class="sig"><div class="sg">Mara Folio</div><div class="sl"></div><small>Mara Folio<br>Επικεφαλής Εκδόσεων</small></div></div>' +
    '<div class="small">Ημερομηνία: ' + (cert ? fmtDate(S.cert) : "──/──/────") + " · Αρ. " + (cert ? code : "APM-─────") + "</div></div></div>" +
    (cert && !nm ? '<p class="small" style="color:var(--bad)">Γράψε το όνομά σου στο πεδίο πιο πάνω για να εμφανιστεί στο πιστοποιητικό.</p>' : "") +
    (cert ? '<p class="small muted">Για να το κρατήσεις, κάνε στιγμιότυπο οθόνης.</p>' : "") +
    '<p class="small muted">Η Ακαδημία, οι υπογράφοντες και η λέσχη είναι φανταστικοί και υπάρχουν μόνο για διασκέδαση. Δεν πρόκειται για επίσημη πιστοποίηση.</p></section>' +
    '<p class="credit">Σχεδιασμός: Νικήτας Σουβατζής · Nikitas Souvatzis, εκπαιδευτικός</p>';
}

/* ---------- actions ---------- */
function startReviewSession() {
  const due = shuffle(dueItems()).slice(0, 12);
  if (!due.length) return go("review");
  start("review", due.map(fromRef), { title: "Επανάληψη" });
}
document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.getAttribute("data-act") === "sheetclose" && e.target.closest("[data-stop]") && !e.target.closest("button")) return;
  const act = el.dataset.act, v = el.dataset.v, n = /^\d+$/.test(el.dataset.n || "") ? +el.dataset.n : el.dataset.n;
  switch (act) {
    case "tab": Q = null; go(v); break;
    case "enter": enterApp(); break;
    case "exit": exitApp(); break;
    case "music": musicCycle(); break;
    case "openCh": Q = null; go("chapter", { n, tab: el.dataset.tab }); break;
    case "chtab": view.tab = v; render(); break;
    case "round": if (el.dataset.skiptheory) { S.ch[n] = Object.assign({ boss: 0 }, S.ch[n], { th: 1 }); save(); } startRound(n, false); break;
    case "startAfterTheory": S.ch[n] = Object.assign({ boss: 0 }, S.ch[n], { th: 1 }); save(); startRound(n, false); break;
    case "boss": startRound(n, true); break;
    case "mix": {
      const pool = []; ALL.forEach(c => c.qs.forEach((q, i) => { const r = qRec(qid(c.n, i)); if (r && r[2] > 0) pool.push({ ch: c.n, i }); }));
      let src = pool; if (pool.length < 10) { src = []; ALL.forEach(c => c.qs.forEach((q, i) => src.push({ ch: c.n, i }))); }
      start("mix", shuffle(src).slice(0, 10).map(r => mkQ(findC(r.ch), r.i)), { title: "Μίξη" }); break;
    }
    case "startReview": startReviewSession(); break;
    case "deck": { const ids = findC(n).cards.map((x, i) => i); const chosen = pickPriority(ids, i => kRec(tid(n, i)), 10); start("deck", chosen.map(i => mkT(n, i)), { title: "Κάρτες", ch: n }); break; }
    case "refsearch": go("ref"); break;
    case "refcat": refCat = v; render(); break;
    case "refdeck": start("deck", refPick(el.dataset.cat, 10).map(mkA), { title: "Κάρτες κανόνων" }); break;
    case "refquiz": start("refquiz", refPick(el.dataset.cat, 8).map(mkAQ), { title: "Κουίζ κανόνων", cat: el.dataset.cat }); break;
    case "opt": answer(+v); break;
    case "next": next(); break;
    case "quit": { const q0 = Q; Q = null; if (q0 && q0.ch) go("chapter", { n: q0.ch }); else if (q0 && (q0.mode === "refquiz" || q0.title === "Κάρτες κανόνων")) go("memory"); else if (q0 && q0.mode === "review") go("review"); else go("home"); break; }
    case "flip": Q.flipped = true; render(); break;
    case "grade": { const it = Q.items[Q.i]; const ok = v === "1"; Q.lastGain = recK(it.id, ok); Q.xp += Q.lastGain; Q.results.push({ it, ok }); next(); break; }
    case "ordpick": { const it = Q.items[Q.i]; if (!Q.answered) { it.pick.push(+v); render(); } break; }
    case "ordclear": { const it = Q.items[Q.i]; it.pick = []; render(); break; }
    case "ordcheck": { const it = Q.items[Q.i]; it.ok = it.pick.every((x, k) => x === k); Q.answered = true; finishAnswer(it); break; }
    case "sheet": Q.sheet = true; render(); break;
    case "sheetclose": if (Q) { Q.sheet = false; render(); } break;
    case "labdone": {
      const ta = document.querySelector('[data-lab="' + v + '"]'), rec = S.lab[v] || {};
      const first = !rec.d; S.lab[v] = { d: rec.d || Date.now(), x: ta ? ta.value.slice(0, 4000) : rec.x || "", t: Date.now() };
      if (first) addXp(30); save(); render(); break;
    }
    case "theme": {
      const root = document.documentElement, light = root.getAttribute("data-theme") === "light";
      if (light) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", "light");
      try { localStorage.setItem("akadimia-suggrafis.theme", light ? "dark" : "light"); } catch (e) {} break;
    }
    case "resetAsk": el.outerHTML = '<span class="small">Σίγουρα; Θα σβηστεί όλη η πρόοδος. </span><button class="btn small" data-act="resetDo" style="border-color:var(--bad);color:var(--bad)">Ναι, μηδένισε</button> <button class="btn small ghost" data-act="tab" data-v="home">Άκυρο</button>'; break;
    case "resetDo": S = fresh(); S.t = Date.now(); save(); if (cloud.ref) pushCloud(); go("home"); break;
  }
});
document.addEventListener("input", function (e) {
  const t = e.target;
  if (t.id === "nameIn") { S.name = t.value.slice(0, 40); S.t = Date.now(); saveLocal(); }
  else if (t.id === "refSearch") filterRef();
  else if (t.dataset && t.dataset.lab) { const rec = S.lab[t.dataset.lab] || { d: 0 }; rec.x = t.value.slice(0, 4000); rec.t = Date.now(); S.lab[t.dataset.lab] = rec; saveLocal(); }
});
document.addEventListener("change", function (e) { const t = e.target; if (t.id === "nameIn" || (t.dataset && t.dataset.lab)) save(); });
document.addEventListener("keydown", function (e) {
  if (!Q || view.name !== "quiz" || editing()) return;
  const it = Q.items[Q.i];
  if (e.key === "Enter" && Q.answered) { e.preventDefault(); next(); }
  else if (/^[1-4]$/.test(e.key) && it && it.opts && !Q.answered && +e.key <= it.opts.length) answer(+e.key - 1);
});
try { const th = localStorage.getItem("akadimia-suggrafis.theme"); if (th === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
(function () { const h = (location.hash || "").slice(1); if (TABS.indexOf(h) >= 0) view = { name: h }; })();
window.addEventListener("hashchange", function () { const h = (location.hash || "").slice(1); if (TABS.indexOf(h) >= 0 && !inSession() && h !== view.name) { view = { name: h }; render(); } });
musicLabels();
render();
initCloud();
</script>
