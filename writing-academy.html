se,"why":"Το «είπε» σχεδόν δεν φαίνεται και δεν αποσπά την προσοχή."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Έλα», είπε.","o":["Ελληνικά (εισαγωγικά « »)","Αμερικανικά αγγλικά"],"why":"Ελληνικός διάλογος με εισαγωγικά και ετικέτα."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"“Come,” she said.","o":["Αμερικανικά αγγλικά","Ελληνικά (εισαγωγικά « »)"],"why":"Αμερικανική σύμβαση με διπλά εισαγωγικά και κόμμα μέσα."},{"t":"mcq","q":"Σε ποια περίπτωση μια σκηνή διαλόγου πρέπει να κοπεί;","o":["Όταν δεν προωθεί πλοκή, δεν αποκαλύπτει χαρακτήρα και δεν αλλάζει σχέσεις","Όταν έχει περισσότερες από τρεις γραμμές","Όταν έχει ερωτηματικά","Όταν υπάρχουν δύο πρόσωπα"],"why":"Αν δεν κάνει τίποτα από τα τρία, δεν χρειάζεται."},{"t":"mcq","q":"Ποιο ελάττωμα ταιριάζει σε ήρωα που δεν ζητά ποτέ βοήθεια;","o":["Η περηφάνια","Η γενναιοδωρία","Η ευγένεια","Η σύντομη ομιλία"],"why":"Η περηφάνια εμποδίζει το αίτημα βοήθειας."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Ο ___ χαρακτηρισμός δείχνει τον χαρακτήρα με πράξεις.","o":["έμμεσος","άμεσος","τυπογραφικός","οικονομικός"],"why":"Ο έμμεσος δείχνει, ο άμεσος λέει."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Μια ___ είναι ένα «είπε» ή «ρώτησε» που δείχνει ποιος μιλά.","o":["ετικέτα διαλόγου","πρόταση-υπόσχεση","κορύφωση","ανατροπή"],"why":"Είναι η ετικέτα διαλόγου."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Στα αμερικανικά αγγλικά, η τελεία και το κόμμα μπαίνουν ___ από τα εισαγωγικά.","o":["μέσα","έξω","πριν από το πρόσωπο","μετά το κεφάλαιο"],"why":"Η αμερικανική σύμβαση βάζει κόμμα και τελεία μέσα."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Ο ανταγωνιστής έχει δικά του ___.","o":["κίνητρα","εξώφυλλα","προγράμματα","προσχέδια"],"why":"Τα κίνητρα κάνουν τον αντίπαλο αξιόπιστο."},{"t":"mcq","q":"Ποιο από τα παρακάτω είναι έμμεσος τρόπος να δείξεις ότι ο χαρακτήρας βιάζεται;","o":["Ανοιγόκλεισε το παλτό μισοκουμπωμένο και έτρεξε για το τρένο","«Βιαζόταν πολύ.»","«Ήταν ο πιο βιαστικός άνθρωπος.»","«Η βιασύνη τον κυρίευσε.»"],"why":"Η κίνηση και τα αντικείμενα δείχνουν τη βιασύνη."},{"t":"mcq","q":"Τι κάνει ένας χαρακτήρας ο οποίος δεν παίρνει ποτέ αποφάσεις;","o":["Είναι παθητικός και αδυνατίζει την πλοκή","Κάνει την ιστορία πιο γρήγορη","Γίνεται πιο ενδιαφέρων","Γίνεται ανταγωνιστής"],"why":"Είναι παθητικός και αφήνει την πλοκή χωρίς κινητήρα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Ο διάλογος πρέπει να λέει όλα όσα ήδη ξέρουν οι δύο χαρακτήρες, ώστε να τα μάθει ο αναγνώστης.","a":false,"why":"Δύο άνθρωποι που ξέρουν κάτι δεν το εξηγούν ο ένας στον άλλο· ο διάλογος θα ακούγεται ψεύτικος."},{"t":"mcq","q":"Ποια είναι σωστή αλλαγή γραμμής σε διάλογο;","o":["«Φεύγω;»\n«Ναι», είπε εκείνος.","«Φεύγω;» «Ναι», είπε εκείνος.","Και οι δύο φράσεις στην ίδια γραμμή χωρίς κενό","Όλη η συζήτηση σε μία γραμμή"],"why":"Κάθε ομιλητής στη δική του γραμμή."},{"t":"mcq","q":"Τι κάνει η δύσκολη επιλογή ανάμεσα σε δύο πράγματα που αγαπά ο ήρωας;","o":["Αποκαλύπτει τον χαρακτήρα και δημιουργεί ένταση","Ανατρέπει τον τίτλο","Δεν έχει αποτέλεσμα","Διαγράφει την πλοκή"],"why":"Δείχνει ποιος είναι ο ήρωας."}],"labs":[{"t":"Επιθυμία, ανάγκη, ελάττωμα","p":"Φτιάξε έναν ήρωα και γράψε σε τρεις γραμμές: τι θέλει, τι χρειάζεται πραγματικά και ποιο είναι το ελάττωμά του.","h":"Αν η επιθυμία και η ανάγκη ταυτίζονται, ψάξε μια ανάγκη που ο ήρωας δεν γνωρίζει.","m":"Ήρωας: ο Στέλιος, ψαράς στη Σύμη.\nΘέλει: να κερδίσει τον διαγωνισμό ψαρέματος της χρονιάς.\nΧρειάζεται: να δεχτεί τη βοήθεια του γιου του, με τον οποίο δεν μιλούν.\nΕλάττωμα: η περηφάνια του, που δεν τον αφήνει να ζητήσει συγγνώμη.","c":["Η επιθυμία είναι συγκεκριμένη.","Η ανάγκη διαφέρει από την επιθυμία.","Το ελάττωμα δυσκολεύει τον ήρωα."]},{"t":"Από άμεσο σε έμμεσο χαρακτηρισμό","p":"Ξαναγράψε τις τρεις προτάσεις έτσι ώστε ο αναγνώστης να συμπεράνει μόνος τον χαρακτήρα: α) «Ο Πέτρος ήταν τσιγκούνης.» β) «Η Ελένη ήταν ντροπαλή.» γ) «Ο παππούς ήταν στοργικός.»","h":"Σκέψου μια ματιά, μια κίνηση ή μια πράξη για κάθε χαρακτήρα.","m":"α) Ο Πέτρος μέτρησε τα ρέστα δύο φορές και κράτησε το ρολογάκι του σερβιτόρου στο χέρι.\nβ) Η Ελένη κοίταξε τα παπούτσια της όσο ο καθηγητής περίμενε την απάντηση.\nγ) Ο παππούς έσπασε το καρβέλι και έδωσε στο παιδί το μισό με το μαλακό ψίχουλο.","c":["Δεν περιέχει τη λέξη για τον χαρακτήρα (τσιγκούνης, ντροπαλή, στοργικός).","Δείχνει πράξη ή κίνηση.","Ο αναγνώστης μπορεί να βγάλει το συμπέρασμα."]},{"t":"Ένας διάλογος με υπόρρητο νόημα","p":"Γράψε διάλογο 6 έως 8 γραμμών ανάμεσα σε δύο πρόσωπα. Το ένα πρόσωπο άργησε στο ραντεβού και το άλλο είναι θυμωμένο, αλλά κανείς δεν λέει ευθέως ότι θυμώνει. Χρησιμοποίησε σωστή στίξη (ελληνικά ή αγγλικά).","h":"Άσε τα αντικείμενα (καφές, ρολόι) να μιλήσουν. Νέα γραμμή για κάθε ομιλητή.","m":"«Ο καφές κρύωσε», είπε η Μαρίνα.\n«Έχασα το λεωφορείο.»\n«Το ξέρω. Στις οκτώ έχασες και τον προηγούμενο.»\n«Λυπάμαι.»\n«Μην λυπάσαι. Πιες τον καφέ σου.»\nΚοίταξε το ρολόι και δεν είπε τίποτε άλλο.","c":["Κάθε ομιλητής έχει δική του γραμμή.","Τα εισαγωγικά και η στίξη είναι σωστά.","Ο θυμός δεν λέγεται ευθέως.","Οι ετικέτες είναι απλές."]}]},{"n":4,"title":"Ύφος και γλώσσα","mentor":{"name":"Φτερούλα Ρυθμού","role":"μέντορας του Ύφους","g":"feather","line":"Η σωστή λέξη κάνει το ίδιο έργο με δέκα αδύναμες. Διάλεγε με προσοχή και κόβε όσα δεν δουλεύουν."},"lesson":[{"h":"Φωνή, ύφος και τόνος","p":["Η **φωνή** είναι ο προσωπικός τρόπος του συγγραφέα ή του αφηγητή να μιλά: οι λέξεις που προτιμά, ο ρυθμός, το χιούμορ. Το **ύφος** (style) είναι το σύνολο των επιλογών γλώσσας που κάνει ένα κείμενο να ακούγεται όπως ακούγεται. Ο **τόνος** (tone) είναι η στάση απέναντι στο θέμα: σοβαρός, ειρωνικός, τρυφερός, ψυχρός.","Η φωνή δεν επιβάλλεται. Βρίσκεται καθώς γράφεις πολύ και διαβάζεις πολύ, και καθώς αφαιρείς ό,τι δεν είναι δικό σου. Τα πρώτα κείμενα συχνά μιμούνται άλλους συγγραφείς, και αυτό είναι φυσιολογικό.","Η επιλογή του **προσώπου αφήγησης** είναι ουσιαστική: πρώτο πρόσωπο («πήγα στον φάρο», οικειότητα και περιορισμένη γνώση) ή τρίτο («η Μαρίνα πήγε στον φάρο», ευελιξία και απόσταση). Θα το δεις αναλυτικά στην ενότητα Μνήμη."]},{"h":"Ρυθμός και μήκος προτάσεων","p":["Ο **ρυθμός** προκύπτει από το μήκος και τη δομή των προτάσεων και των παραγράφων. Οι κοντές προτάσεις δίνουν ένταση και ταχύτητα. Οι μακριές δίνουν ροή, περιγραφή, ηρεμία.","> Έτρεξε. Η πόρτα έκλεισε. Ο φάρος σκοτείνιασε.\n> Περπάτησε αργά στην ακτή, όπου τα κύματα έγλειφαν τους βράχους με μια υπομονή που θύμιζε προσευχή, και σκέφτηκε ότι ο καιρός θα άλλαζε.","Η μονοτονία προέρχεται από προτάσεις ίδιου μήκους και δομής. Η λύση είναι **ποικιλία**: ανάμειξε κοντές και μακριές, αλλάζοντας και την αρχή τους. Διάβασε το κείμενό σου φωναχτά: όπου σκοντάφτεις, ο ρυθμός χρειάζεται δουλειά.","Και οι παράγραφοι έχουν ρυθμό. Μία γραμμή μπορεί να είναι μια παράγραφος που κάνει δραματική πίεση. Μια ολόκληρη σελίδα χωρίς αλλαγή παραγράφου κουράζει τον αναγνώστη."]},{"h":"Δείξε, μην λες (show, don't tell)","p":["Η συμβουλή «δείξε, μην λες» σημαίνει ότι αντί να ονομάζεις ένα συναίσθημα ή μια ιδιότητα, την κάνεις να φανεί με συγκεκριμένες εικόνες και πράξεις.","> Λες: «Η Μαρίνα ήταν φοβισμένη.»\n> Δείχνεις: «Η Μαρίνα έσφιξε το κιγκλίδωμα τόσο, που τα δάχτυλά της άσπρισαν, και ο φάρος έτριξε πάνω από το κεφάλι της.»","Χρησιμοποίησε τις πέντε αισθήσεις: τι βλέπει, ακούει, μυρίζει, γεύεται και αγγίζει ο χαρακτήρας. Οι **συγκεκριμένες** λεπτομέρειες («σκουριασμένο κιγκλίδωμα») πείθουν περισσότερο από τις αφηρημένες («ένα όμορφο μέρος»).","Το «λες» δεν είναι απαγορευμένο. Σε μια γρήγορη μετάβαση («Πέρασαν τρεις μήνες») το «λες» είναι το σωστό εργαλείο. Δείξε εκεί που έχει σημασία για τον αναγνώστη."]},{"h":"Η ακριβής λέξη","p":["Η ακριβής λέξη κάνει το ίδιο έργο με πολλές αδύναμες. Αντί για «περπάτησε αργά και κουρασμένα» γράψε «σύρθηκε». Τα **δυνατά ρήματα** (σύρθηκε, ξεπήδησε, γλίστρησε) δίνουν εικόνα χωρίς βοηθητικά επιρρήματα.","Πρόσεχε τις «κενές» λέξεις: πολύ, κάπως, ίσως, μάλλον, πραγματικά, τελικά, σχεδόν. Ένα επίρρημα που ενισχύει ένα ήδη δυνατό ρήμα («φώναξε δυνατά») είναι συνήθως περιττό.","Πρόσεχε και τα **κλισέ**: εκφράσεις που τόσο έχουν χρησιμοποιηθεί, ώστε δεν δείχνουν τίποτα πια. «Μαύρος σαν το κάρβουνο», «γλυκός σαν μέλι», στα αγγλικά «cold as ice», «at the end of the day». Αντικατάστησέ τα με μια δική σου, ακριβή εικόνα.","Στη μη μυθοπλασία η ακριβής λέξη σημαίνει σαφής: προτίμησε τον απλό όρο από τον περίπλοκο, και ξεκαθάρισε κάθε τεχνικό όρο την πρώτη φορά που τον χρησιμοποιείς."]},{"h":"Ενεργητική και παθητική φωνή","p":["Στην **ενεργητική** φωνή το υποκείμενο κάνει την πράξη: «Η εταιρεία έκλεισε τον φάρο.» Στην **παθητική** φωνή το υποκείμενο υφίσταται την πράξη: «Ο φάρος έκλεισε από την εταιρεία.»","Η ενεργητική είναι συνήθως πιο ζωντανή και κοντή, και λέει καθαρά ποιος κάνει τι. Η παθητική είναι χρήσιμη όταν ο δράστης δεν είναι γνωστός ή δεν έχει σημασία («Το γράμμα στάλθηκε χθες»), ή όταν θέλεις να τονίσεις αυτό που συνέβη.","Το πρόβλημα προκύπτει όταν όλο το κείμενο είναι παθητικό και ο αναγνώστης δεν ξέρει ποιος κάνει τι: «Η απόφαση ελήφθη.» Ποιος την έλαβε;","Στα αγγλικά το ίδιο: «The letter was sent.» (παθητική) και «Marina sent the letter.» (ενεργητική)."]},{"h":"Εικόνες: μεταφορά, παρομοίωση, προσωποποίηση","p":["Η **παρομοίωση** συγκρίνει ανοιχτά με «σαν» ή «όπως»: «Η πόλη βουίζε σαν κυψέλη.» Η **μεταφορά** ταυτίζει χωρίς σύνδεσμο: «Η πόλη ήταν κυψέλη.» Η **προσωποποίηση** δίνει ανθρώπινες ιδιότητες σε πράγματα: «Ο άνεμος ψιθύριζε στα παράθυρα.»","Μια εικόνα λειτουργεί όταν φέρνει κάτι νέο στο μυαλό του αναγνώστη. Αν ακούγεται γνώριμη, είναι κλισέ. Αν είναι υπερβολικά περίπλοκη, αποσπά την προσοχή.","Πρόσεχε τις **ανάμεικτες μεταφορές**: δύο εικόνες που δεν ταιριάζουν στην ίδια πρόταση. «Ο ήρωας πάτησε το πόδι στο τιμόνι και άνοιξε τα πανιά» μπερδεύει εικόνες. Μία καθαρή εικόνα κάθε φορά."]},{"h":"Ελληνικά και αγγλικά: τι αλλάζει στο ύφος","p":["Σε κάθε γλώσσα αλλάζουν κάποια πράγματα. Στα ελληνικά το υποκείμενο συχνά **παραλείπεται**, επειδή το ρήμα δείχνει το πρόσωπο: «Πήγα στον φάρο.» Το «Εγώ πήγα στον φάρο» δίνει έμφαση («εγώ και όχι άλλος»). Στα αγγλικά το υποκείμενο είναι υποχρεωτικό: «I went to the lighthouse.»","Στα ελληνικά τα κύρια ονόματα συνοδεύονται συχνά από άρθρο («η Μαρίνα»). Στα αγγλικά όχι («Marina»). Στη μετάφραση ή στη δίγλωσση γραφή το ξεχνάμε εύκολα.","Στα αγγλικά η συμβουλή «προτίμησε την ενεργητική» και «κόψε τα περιττά» είναι εξαιρετικά διαδεδομένη. Στα ελληνικά οι ίδιες αρχές ισχύουν, αλλά και οι μεγαλύτερες περίοδοι είναι φυσικές όταν ο ρυθμός τις δικαιολογεί.","Δεν υπάρχει μία σωστή φωνή. Ο στόχος είναι να ταιριάζει το ύφος στο θέμα, στον αναγνώστη και στη γλώσσα."]}],"sum":["**Φωνή** = προσωπικός τρόπος γραφής, **ύφος** = σύνολο γλωσσικών επιλογών, **τόνος** = στάση απέναντι στο θέμα.","Ο **ρυθμός** προκύπτει από το μήκος των προτάσεων: κοντές για ένταση, μακριές για ροή. Μίξε και διάβασε φωναχτά.","**Δείξε, μην λες**: συγκεκριμένες εικόνες και αισθήσεις. Το «λες» είναι εντάξει στις γρήγορες μεταβάσεις.","Προτίμησε **δυνατά ρήματα** και ακριβείς λέξεις. Απόφυγε τις κενές λέξεις και τα κλισέ.","Ενεργητική φωνή συνήθως, παθητική όταν ο δράστης δεν έχει σημασία. Μία καθαρή εικόνα κάθε φορά."],"ex":{"t":"Παράδειγμα: από αδύναμο σε δυνατό","x":"Αδύναμο: «Η Μαρίνα περπάτησε πολύ αργά και κουρασμένα προς τον φάρο.»\nΔυνατό: «Η Μαρίνα σύρθηκε ως τον φάρο.»\n\nΠαθητική: «Η απόφαση ελήφθη.»\nΕνεργητική: «Ο δήμαρχος πήρε την απόφαση.»"},"cards":[["Φωνή","Ο προσωπικός τρόπος του συγγραφέα ή του αφηγητή να μιλά."],["Ύφος (style)","Το σύνολο των γλωσσικών επιλογών ενός κειμένου: λέξεις, προτάσεις, εικόνες."],["Τόνος (tone)","Η στάση απέναντι στο θέμα: σοβαρός, ειρωνικός, τρυφερός, ψυχρός."],["Ρυθμός","Η κίνηση του κειμένου που προκύπτει από το μήκος και τη δομή των προτάσεων."],["Show, don't tell","Δείχνω συναισθήματα και ιδιότητες με εικόνες και πράξεις αντί να τα ονομάζω."],["Δυνατό ρήμα","Ρήμα που δίνει εικόνα χωρίς βοηθητικά επιρρήματα (σύρθηκε αντί για περπάτησε αργά)."],["Κλισέ","Έκφραση που έχει χρησιμοποιηθεί τόσο, ώστε δεν δείχνει τίποτα (μαύρος σαν το κάρβουνο)."],["Παρομοίωση και μεταφορά","Παρομοίωση: με «σαν/όπως». Μεταφορά: ταύτιση χωρίς σύνδεσμο."],["Προσωποποίηση","Ανθρώπινες ιδιότητες σε πράγματα: ο άνεμος ψιθύριζε."],["Ενεργητική και παθητική","Ενεργητική: το υποκείμενο κάνει την πράξη. Παθητική: την υφίσταται."]],"qs":[{"t":"mcq","q":"Τι είναι η φωνή του συγγραφέα;","o":["Ο προσωπικός τρόπος που μιλά ο συγγραφέας ή ο αφηγητής","Ο ήχος που κάνει όταν διαβάζει","Ο τίτλος","Το ύψος των γραμμάτων"],"why":"Η φωνή είναι ο προσωπικός τρόπος γραφής."},{"t":"mcq","q":"Τι είναι ο τόνος (tone) ενός κειμένου;","o":["Η στάση του κειμένου απέναντι στο θέμα: σοβαρή, ειρωνική, τρυφερή","Το μέγεθος της γραμματοσειράς","Η ένταση της φωνής","Το σημάδι τονισμού"],"why":"Ο τόνος είναι η στάση απέναντι στο θέμα."},{"t":"mcq","q":"Ποιο είναι το ύφος (style);","o":["Το σύνολο των γλωσσικών επιλογών που κάνει ένα κείμενο να ακούγεται όπως ακούγεται","Ο αριθμός των σελίδων","Η τιμή του βιβλίου","Ο εκδότης"],"why":"Το ύφος είναι το σύνολο των γλωσσικών επιλογών."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η φωνή του συγγραφέα βρίσκεται καθώς γράφεις πολύ και διαβάζεις πολύ.","a":true,"why":"Δεν επιβάλλεται· χτίζεται με πρακτική."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Αν τα πρώτα κείμενα μιμούνται άλλους συγγραφείς, είναι σημάδι ότι δεν μπορώ να γράψω.","a":false,"why":"Είναι φυσιολογικό στάδιο."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Πήγα στον φάρο και κοίταξα τη θάλασσα.»","o":["Πρώτο πρόσωπο","Τρίτο πρόσωπο"],"why":"Το ρήμα είναι σε πρώτο πρόσωπο."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Η Μαρίνα πήγε στον φάρο και κοίταξε τη θάλασσα.»","o":["Τρίτο πρόσωπο","Πρώτο πρόσωπο"],"why":"Η αφηγήτρια μιλά για άλλο πρόσωπο."},{"t":"mcq","q":"Τι δίνουν οι κοντές προτάσεις;","o":["Ένταση και ταχύτητα","Πάντα ηρεμία","Μόνο περιγραφή","Μεγάλο ύφος"],"why":"Δίνουν ένταση και ταχύτητα."},{"t":"mcq","q":"Τι δίνουν οι μακριές προτάσεις;","o":["Ροή, περιγραφή, ηρεμία","Πάντα βιασύνη","Μόνο διάλογο","Πάντα ένταση"],"why":"Δίνουν ροή και ηρεμία."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η μονοτονία προέρχεται από προτάσεις ίδιου μήκους και δομής.","a":true,"why":"Η λύση είναι η ποικιλία."},{"t":"mcq","q":"Πώς ελέγχεις τον ρυθμό ενός κειμένου πρακτικά;","o":["Το διαβάζεις φωναχτά","Το τυπώνεις μικρότερο","Το μεταφράζεις","Το κρύβεις από τους άλλους"],"why":"Αν σκοντάφτεις, ο ρυθμός χρειάζεται δουλειά."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Μια παράγραφος μίας γραμμής μπορεί να δώσει δραματική πίεση.","a":true,"why":"Η παράγραφος έχει ρυθμό και μπορεί να λειτουργήσει σαν παύση."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Η Μαρίνα ήταν φοβισμένη.»","o":["Λες (tell)","Δείχνεις (show)"],"why":"Ονομάζει το συναίσθημα."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Η Μαρίνα έσφιξε το κιγκλίδωμα τόσο, που τα δάχτυλά της άσπρισαν.»","o":["Δείχνεις (show)","Λες (tell)"],"why":"Η πράξη δείχνει τον φόβο."},{"t":"mcq","q":"Σε ποια περίπτωση το «λες» (tell) είναι σωστό εργαλείο;","o":["Σε μια γρήγορη μετάβαση όπως «Πέρασαν τρεις μήνες»","Στην κορύφωση πάντα","Ποτέ","Σε κάθε πρόταση"],"why":"Σε γρήγορες μεταβάσεις, όπου δεν χρειάζεται εικόνα."},{"t":"mcq","q":"Ποια λεπτομέρεια είναι πιο συγκεκριμένη;","o":["Σκουριασμένο κιγκλίδωμα","Ένα όμορφο μέρος","Κάτι ωραίο","Ένα πράγμα"],"why":"Οι συγκεκριμένες λεπτομέρειες πείθουν περισσότερο."},{"t":"mcq","q":"Ποιες αισθήσεις βοηθούν να «δείξεις»;","o":["Και οι πέντε: όραση, ακοή, όσφρηση, γεύση, αφή","Μόνο η όραση","Μόνο η ακοή","Καμία"],"why":"Όλες οι πέντε αισθήσεις ζωντανεύουν τη σκηνή."},{"t":"mcq","q":"Ποιο ρήμα είναι δυνατό και αρκεί μόνο του;","o":["σύρθηκε","πήγε","έκανε","έγινε"],"why":"Το «σύρθηκε» εμπεριέχει «περπάτησε αργά και κουρασμένα»."},{"t":"fix","q":"«Φώναξε δυνατά.»","x":"Ποια εκδοχή αφαιρεί το περιττό επίρρημα;","o":["«Φώναξε.»","«Φώναξε πολύ δυνατά.»","«Φώναξε αρκετά δυνατά.»","«Φώναξε κάπως δυνατά.»"],"why":"Το «φώναξε» περιέχει ήδη την ένταση."},{"t":"mcq","q":"Ποια από τις παρακάτω λέξεις είναι «κενή» και συχνά περιττή;","o":["πραγματικά","φάρος","μαχαίρι","ακτή"],"why":"Το «πραγματικά» σπάνια προσθέτει νόημα."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Μαύρος σαν το κάρβουνο»","o":["Κλισέ","Πρωτότυπη εικόνα"],"why":"Είναι έκφραση που έχει χρησιμοποιηθεί υπερβολικά."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"“Cold as ice”","o":["Κλισέ","Πρωτότυπη εικόνα"],"why":"Η αγγλική φράση είναι πολυχρησιμοποιημένη."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Ο ουρανός ήταν μελάνι που μόλις είχε χυθεί.»","o":["Πρωτότυπη εικόνα","Κλισέ"],"why":"Φρέσκια, συγκεκριμένη εικόνα."},{"t":"mcq","q":"Τι πρέπει να κάνεις με ένα κλισέ;","o":["Να το αντικαταστήσεις με δική σου, ακριβή εικόνα","Να το επαναλάβεις","Να το βάλεις στον τίτλο","Να το αφήσεις πάντα"],"why":"Η δική σου ακριβής εικόνα δείχνει περισσότερο."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Η εταιρεία έκλεισε τον φάρο.»","o":["Ενεργητική φωνή","Παθητική φωνή"],"why":"Το υποκείμενο κάνει την πράξη."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Ο φάρος έκλεισε από την εταιρεία.»","o":["Παθητική φωνή","Ενεργητική φωνή"],"why":"Το υποκείμενο υφίσταται την πράξη."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"“Marina sent the letter.”","o":["Ενεργητική φωνή","Παθητική φωνή"],"why":"Το υποκείμενο κάνει την πράξη."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"“The letter was sent.”","o":["Παθητική φωνή","Ενεργητική φωνή"],"why":"Το γράμμα υφίσταται την πράξη."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η παθητική φωνή είναι χρήσιμη όταν ο δράστης δεν είναι γνωστός ή δεν έχει σημασία.","a":true,"why":"Για παράδειγμα: «Το γράμμα στάλθηκε χθες»."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Ένα κείμενο γεμάτο παθητικές προτάσεις δεν δείχνει καθαρά ποιος κάνει τι.","a":true,"why":"«Η απόφαση ελήφθη» – ποιος την έλαβε;"},{"t":"fix","q":"«Η απόφαση ελήφθη.»","x":"Ποια εκδοχή είναι πιο ζωντανή και δείχνει δράστη;","o":["Ο δήμαρχος πήρε την απόφαση.","Η απόφαση ελήφθη.","Η απόφαση ελήφθη από κάποιον.","Η απόφαση έγινε ληφθείσα."],"why":"Η ενεργητική φωνή λέει ποιος κάνει τι."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Η πόλη βούιζε σαν κυψέλη.»","o":["Παρομοίωση","Μεταφορά"],"why":"Έχει το «σαν»."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Η πόλη ήταν κυψέλη.»","o":["Μεταφορά","Παρομοίωση"],"why":"Ταυτίζει χωρίς σύνδεσμο."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"«Ο άνεμος ψιθύριζε στα παράθυρα.»","o":["Προσωποποίηση","Παρομοίωση"],"why":"Ο άνεμος μιλά σαν άνθρωπος."},{"t":"mcq","q":"Ποια εικόνα είναι ανάμεικτη μεταφορά;","o":["Ο ήρωας πάτησε το πόδι στο τιμόνι και άνοιξε τα πανιά","Η πόλη ήταν κυψέλη","Ο άνεμος ψιθύριζε","Έτρεξε σαν αστραπή"],"why":"Το τιμόνι και τα πανιά ανήκουν σε διαφορετικές εικόνες."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Μια εικόνα λειτουργεί όταν φέρνει κάτι νέο στο μυαλό του αναγνώστη.","a":true,"why":"Αν ακούγεται γνώριμη, είναι κλισέ."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στα ελληνικά το υποκείμενο παραλείπεται συχνά, επειδή το ρήμα δείχνει το πρόσωπο.","a":true,"why":"«Πήγα στον φάρο»."},{"t":"fix","q":"Ποια εκδοχή είναι η συνηθισμένη στα ελληνικά;","x":"Θέλεις να πεις ότι πήγες στον φάρο, χωρίς να τονίσεις ότι ήσουν εσύ.","o":["Πήγα στον φάρο.","Εγώ πήγα στον φάρο.","Πήγε εγώ στον φάρο.","Εγώ πήγε στον φάρο."],"why":"Το «εγώ» δίνει έμφαση, άρα συνήθως παραλείπεται."},{"t":"mcq","q":"Γιατί το «Εγώ πήγα στον φάρο» έχει διαφορετική σημασία από το «Πήγα στον φάρο»;","o":["Επειδή τονίζει το πρόσωπο (εγώ και όχι άλλος)","Επειδή είναι πιο ευγενικό","Επειδή είναι παλαιότερο ύφος","Επειδή αλλάζει ο χρόνος"],"why":"Η αναφορά στο υποκείμενο τονίζει το πρόσωπο."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στα αγγλικά το υποκείμενο είναι υποχρεωτικό: “I went to the lighthouse.”","a":true,"why":"Στα αγγλικά δεν παραλείπεται το υποκείμενο στην κανονική πρόζα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στα ελληνικά δεν υπάρχει άρθρο πριν από τα κύρια ονόματα.","a":false,"why":"Συνήθως υπάρχει: «η Μαρίνα», «ο Γιάννης»."},{"t":"mcq","q":"Τι είναι τα «δυνατά ρήματα»;","o":["Ρήματα που δίνουν εικόνα χωρίς βοηθητικά επιρρήματα","Ρήματα με πολλές συλλαβές","Ρήματα που τελειώνουν σε -ω","Ρήματα στην παθητική"],"why":"Κρατούν μέσα τους το επίρρημα."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Ένα κείμενο με προτάσεις ίδιου μήκους γίνεται ___.","o":["μονότονο","ρυθμικό","πιο σύντομο","πιο ακριβές"],"why":"Η ποικιλία σπάει τη μονοτονία."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Η ___ ονομάζει ανοιχτά με «σαν» ή «όπως».","o":["παρομοίωση","μεταφορά","προσωποποίηση","ανατροπή"],"why":"Η παρομοίωση χρησιμοποιεί σύνδεσμο σύγκρισης."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Στη μη μυθοπλασία, κάθε τεχνικό όρο τον ___ την πρώτη φορά.","o":["εξηγούμε","κρύβουμε","διαγράφουμε","μεταφράζουμε σιωπηλά"],"why":"Έτσι ο αρχάριος τον καταλαβαίνει."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Το «___ ελήφθη» είναι παθητική φωνή.","o":["η απόφαση","ο δήμαρχος","η Μαρίνα","ο φάρος"],"why":"Η παθητική: η απόφαση υφίσταται την πράξη."},{"t":"ord","q":"Βάλε τα στάδια βελτίωσης μιας πρότασης στη σειρά.","lines":["Ξεκαθαρίζω τι θέλω να πω","Διαλέγω δυνατό ρήμα","Κόβω περιττές λέξεις","Διαβάζω φωναχτά για τον ρυθμό"],"why":"Πρώτα ξεκαθαρίζεις τι θέλεις να πεις, μετά διαλέγεις ρήμα, κόβεις περιττά και διαβάζεις φωναχτά."},{"t":"mcq","q":"Ποιο χαρακτηριστικό ταιριάζει σε εγχειρίδιο για αρχάριους;","o":["Το κείμενο εξηγεί κάθε όρο όταν τον χρησιμοποιεί πρώτη φορά.","Όλοι οι όροι χρησιμοποιούνται χωρίς εξήγηση.","Οι προτάσεις έχουν πάντα 60 λέξεις.","Το κείμενο αποφεύγει τα παραδείγματα."],"why":"Σύντομη, ενεργητική και χωρίς περιττούς όρους."},{"t":"mcq","q":"Ποιο από τα παρακάτω είναι τόνος (tone);","o":["Ειρωνικός","Έντονη γραφή","Πλάγια γράμματα","Σύντομος τίτλος"],"why":"Ο τόνος είναι η στάση απέναντι στο θέμα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Δεν υπάρχει μία σωστή φωνή· το ύφος πρέπει να ταιριάζει στο θέμα, στον αναγνώστη και στη γλώσσα.","a":true,"why":"Η καταλληλότητα μετρά, όχι ένα ιδανικό ύφος."}],"labs":[{"t":"Δείξε το συναίσθημα","p":"Ξαναγράψε τις τρεις προτάσεις ώστε να δείξεις το συναίσθημα χωρίς να το ονομάσεις: α) «Ο Γιάννης ήταν θυμωμένος.» β) «Η Ζωή ήταν χαρούμενη.» γ) «Ο Πέτρος ήταν κουρασμένος.»","h":"Χρησιμοποίησε μια κίνηση, έναν ήχο ή ένα αντικείμενο για κάθε πρόταση.","m":"α) Ο Γιάννης άφησε το φλιτζάνι στο τραπέζι τόσο απότομα, που ο καφές πέταξε έξω.\nβ) Η Ζωή κατέβηκε τα σκαλιά δύο δύο και το τραγούδι της ακουγόταν ως τη γωνία.\nγ) Ο Πέτρος κάθισε στο τελευταίο σκαλί και δεν βρήκε δύναμη να βγάλει τα παπούτσια του.","c":["Δεν περιέχει τη λέξη του συναισθήματος.","Έχει συγκεκριμένη πράξη ή εικόνα.","Ο αναγνώστης μπορεί να μαντέψει το συναίσθημα."]},{"t":"Δυνατά ρήματα","p":"Αντικατάστησε κάθε ζεύγος «ρήμα + επίρρημα» με ένα δυνατό ρήμα: α) περπάτησε αργά β) έτρεξε γρήγορα γ) κοίταξε προσεκτικά δ) μίλησε σιγά.","h":"Σκέψου την εικόνα που θέλεις και ψάξε το ρήμα που την έχει ήδη μέσα του.","m":"α) σύρθηκε / παραπατούσε\nβ) πετάχτηκε / όρμησε\nγ) παρατήρησε / ξεψάχνισε\nδ) ψιθύρισε / μουρμούρισε","c":["Κάθε απάντηση είναι ένα ρήμα.","Το νόημα δεν χάθηκε.","Δεν χρειάζεται επίρρημα."]},{"t":"Ενεργητική φωνή και ρυθμός","p":"Ξαναγράψε σε ενεργητική φωνή: «Το γράμμα γράφτηκε από τη Μαρίνα. Η πόρτα άνοιξε από τον άνεμο. Η απόφαση ελήφθη.» Μετά γράψε μια παράγραφο τριών προτάσεων με διαφορετικά μήκη.","h":"Στην τελευταία πρόταση «Η απόφαση ελήφθη» πρέπει να σκεφτείς ποιος την πήρε.","m":"Η Μαρίνα έγραψε το γράμμα. Ο άνεμος άνοιξε την πόρτα. Ο δήμαρχος πήρε την απόφαση.\n\nΠαράγραφος: Έτρεξε. Η θάλασσα, μαύρη και βαριά, χτυπούσε τους βράχους με έναν ρυθμό που δεν σταματούσε ποτέ. Σταμάτησε.","c":["Έχει υποκείμενο που κάνει την πράξη.","Στην απάντηση ο δράστης ονομάζεται.","Η παράγραφος έχει κοντή και μακριά πρόταση."]}]},{"n":5,"title":"Επιμέλεια, ορθογραφία και στίξη","mentor":{"name":"Δόκτωρ Κόμμα","role":"μέντορας της Επιμέλειας","g":"glass","line":"Ένα κείμενο δεν τελειώνει όταν το γράφεις. Τελειώνει όταν το διαβάσεις με καθαρό μυαλό και διορθώσεις ό,τι βρεις."},"lesson":[{"h":"Οι τρεις φάσεις της επιμέλειας","p":["Η επιμέλεια δεν είναι μία δουλειά, είναι τρεις διαφορετικές, που γίνονται με σειρά. Αν τις μπερδέψεις, χάνεις χρόνο, επειδή διορθώνεις προτάσεις που μετά θα κόψεις.","- **Αναθεώρηση περιεχομένου** (structural ή developmental edit): ελέγχεις δομή, πλοκή, χαρακτήρες, κενά, επαναλήψεις. Μεγάλες αλλαγές.\n- **Επιμέλεια γλώσσας** (copy edit): ελέγχεις πρόταση προς πρόταση για γραμματική, ύφος, στίξη, ορθογραφία και συνέπεια.\n- **Διόρθωση τυπογραφικών** (proofreading): τελευταίος έλεγχος του τελικά στοιχειοθετημένου κειμένου για μικρά λάθη, κενά, λάθος αριθμούς σελίδων.","Η σειρά είναι πάντα από το μεγάλο στο μικρό. Δεν γυαλίζεις πρόταση σε κεφάλαιο που ίσως θα κοπεί."]},{"h":"Πώς αναθεωρείς το πρώτο προσχέδιο","p":["Πρώτα **άφησε το κείμενο να κρυώσει**: μερικές μέρες ή εβδομάδες χωρίς να το δεις. Όταν το ξανανοίξεις, θα το διαβάσεις σαν αναγνώστης και όχι σαν συγγραφέας.","Διάβασε όλο το κείμενο μία φορά χωρίς να διορθώνεις. Σημείωσε μόνο ερωτήματα: πού βαριέμαι; πού μπερδεύομαι; πού λείπει κάτι; Μετά διόρθωσε τη δομή, μετά τις προτάσεις, και στο τέλος τα λάθη.","Μερικά κόλπα βοηθούν: διάβασε **φωναχτά**, άλλαξε τη γραμματοσειρά ή τη συσκευή (τύπωσε το κείμενο ή άνοιξέ το στο κινητό), διάβασε **προς τα πίσω** πρόταση πρόταση για τον έλεγχο λαθών. Το μάτι ξεγελιέται εύκολα από κείμενο που ξέρει απέξω.","Κόψε χωρίς οίκτο. Αν μια σκηνή ή ένα κεφάλαιο δεν προσφέρει κάτι, αφαίρεσέ το, ακόμη κι αν το αγαπάς."]},{"h":"Ορθογραφία στα ελληνικά: τα συχνά λάθη","p":["Η ελληνική ορθογραφία έχει δυσκολίες επειδή πολλοί ήχοι γράφονται με περισσότερα γράμματα (ι, η, υ, ει, οι, υι) ή (ο, ω) ή (ε, αι). Δεν γίνεται να τα μάθεις όλα με αποστήθιση. Βοηθούν οι κανόνες και οι οικογένειες λέξεων.","Συχνά ζευγάρια που μπερδεύονται:\n- **ότι** (σύνδεσμος: «Είπε ότι θα έρθει») και **ό,τι** (αόριστη αντωνυμία, γράφεται με κόμμα: «Κάνε ό,τι θέλεις»)\n- **πως** (σύνδεσμος: «Είπε πως θα έρθει») και **πώς** (ερωτηματικό: «Πώς σε λένε;»)\n- **που** (αναφορικό: «Ο φάρος που είδα») και **πού** (ερωτηματικό: «Πού είσαι;»)\n- **η** (άρθρο) και **ή** (διαζευκτικός σύνδεσμος, «τσάι ή καφές»)","Η κατάληξη των ρημάτων βοηθά: όσα ρήματα έχουν παθητική φωνή τελειώνουν σε **-αι** (γράφεται, κοιμάται, θυμούνται), ενώ τα ενεργητικά σε **-ει, -εις, -ουν**. Το «θα γράφεται» και το «θα γράφει» είναι διαφορετικά ρήματα με διαφορετική σημασία.","Για το ν στο τέλος των λέξεων «δεν, μην, τον, την, στον, στην»: το **ν** διατηρείται όταν η επόμενη λέξη αρχίζει από **φωνήεν** ή από **κ, π, τ, ξ, ψ, γκ, μπ, ντ, τσ, τζ**. Στις άλλες περιπτώσεις πέφτει: «δε βλέπω», «μη φοβάσαι».","Όταν αμφιβάλλεις, κοίταξε το λεξικό. Ένα καλό λεξικό (π.χ. το ηλεκτρονικό λεξικό του Κέντρου Ελληνικής Γλώσσας) λύνει τις περισσότερες απορίες."]},{"h":"Στίξη στα ελληνικά","p":["Η στίξη δείχνει παύσεις, ρυθμό και νόημα. Ελληνικά σημεία:\n- **τελεία** (.): τέλος πρότασης.\n- **κόμμα** (,): μικρή παύση, χωρίζει απαριθμήσεις και προσφωνήσεις.\n- **άνω τελεία** (·): μεγαλύτερη παύση από το κόμμα και μικρότερη από την τελεία.\n- **ερωτηματικό** (;): τελειώνει ερώτηση («Πού πας;»). Μοιάζει με το αγγλικό semicolon, αλλά έχει άλλη χρήση.\n- **θαυμαστικό** (!), **αποσιωπητικά** (…) και **εισαγωγικά** (« »).","Το κόμμα βάζουμε πριν από «αλλά», «όμως», «ενώ», και σε προσφωνήσεις: «Μαρίνα, έλα εδώ». Όχι μεταξύ υποκειμένου και ρήματος: «Η Μαρίνα, πήγε» είναι λάθος (εκτός αν υπάρχει παρένθετο στοιχείο ανάμεσα).","Προσοχή: το ελληνικό ερωτηματικό (;) μοιάζει οπτικά με το αγγλικό semicolon, αλλά δεν έχει την ίδια χρήση. Η άνω τελεία (·) είναι η πιο κοντινή στη χρήση του αγγλικού semicolon.","Στα αποσιωπητικά βάζουμε τρεις τελείες. Μη βάζεις περισσότερες ούτε μπλέκεις με θαυμαστικό και ερωτηματικό σε σωρούς («;;;», «!!!»)."]},{"h":"Στίξη στα αγγλικά: τα συχνά λάθη","p":["Τα συχνότερα λάθη στα αγγλικά είναι τα εξής:","- **its / it’s**: «its» δείχνει κτήση («The cat licked its paws»), «it’s» σημαίνει «it is» ή «it has» («It’s raining»).\n- **their / there / they’re**: κτήση, τόπος, «they are».\n- **your / you’re**: κτήση και «you are».\n- **comma splice**: δύο ανεξάρτητες προτάσεις ενωμένες μόνο με κόμμα («I was tired, I went to bed»).","Το comma splice διορθώνεται με τελεία («I was tired. I went to bed.»), με semicolon («I was tired; I went to bed»), ή με σύνδεσμο («I was tired, so I went to bed»).","Το **Oxford comma** είναι το κόμμα πριν από το «and» στην απαρίθμηση τριών ή περισσότερων: «apples, oranges, and pears». Άλλοι οδηγοί το απαιτούν, άλλοι όχι. Σημασία έχει να είσαι **συνεπής** σε όλο το βιβλίο.","Η απόστροφος δεν φτιάχνει πληθυντικό: «two apples», όχι «two apple’s»."]},{"h":"Συνέπεια και φύλλο στυλ","p":["Το κείμενο δείχνει επαγγελματικό όταν ό,τι μπορεί να γραφτεί με δύο τρόπους γράφεται πάντα με τον ίδιο. Πρόσεξε: ονόματα προσώπων (Μαρίνα, όχι άλλοτε Μαρίνα και άλλοτε Μαρίνη), ορθογραφία ξένων λέξεων, ημερομηνίες, αριθμοί, κεφαλαία γράμματα, εισαγωγικά.","Κράτησε ένα **φύλλο στυλ** (style sheet): ένα έγγραφο με όλες τις αποφάσεις σου. Για παράδειγμα: «Ονόματα: Μαρίνα Δρόσου. Εισαγωγικά: « ». Αριθμοί: ολογράφως έως το δέκα. Ημερομηνίες: 12 Μαρτίου 1998.»","Στη μυθοπλασία γράψε και ένα **ημερολόγιο γεγονότων**: ποιος ήταν πού, τι ώρα, τι ηλικία είχε, τι χρώμα μάτια είχε. Έτσι δεν προκύπτουν λάθη συνέχειας.","Στη μη μυθοπλασία ελέγχεις **τα στοιχεία**: ονόματα, χρονολογίες, αριθμούς, παραπομπές, ορθογραφία ξένων όρων. Ένας λανθασμένος αριθμός μπορεί να χαλάσει την αξιοπιστία όλου του βιβλίου."]},{"h":"Δοκιμαστές αναγνώστες και τελικός έλεγχος","p":["Ο συγγραφέας δεν μπορεί να δει τα λάθη του. Γι' αυτό χρειάζεται **δοκιμαστές αναγνώστες** (beta readers): άνθρωποι από τον κύκλο του κοινού σου, που διαβάζουν το κείμενο και σου λένε πού βαρέθηκαν, πού μπερδεύτηκαν, πού τους άρεσε.","Ζήτησε συγκεκριμένα σχόλια: «Πού σταμάτησες να διαβάζεις; Ποιο σημείο δεν κατάλαβες; Ποιος χαρακτήρας δεν σε έπεισε;» Αν πολλοί λένε το ίδιο, πάρ' το στα σοβαρά. Αν ένας λέει κάτι που δεν σε ενοχλεί, ξανασκέψου, αλλά δεν είναι υποχρεωτικό να αλλάξεις.","Πριν την έκδοση κάνε **τελικό έλεγχο** με λίστα: τίτλοι, αρίθμηση κεφαλαίων, αριθμοί σελίδων, παραπομπές, εισαγωγικά, κενά, ονόματα. Διάβασε το τελικό αρχείο όπως θα το δει ο αναγνώστης (σε οθόνη ή σε δοκιμαστική εκτύπωση).","Αν μπορείς, ζήτησε από άλλον να κάνει την τελική διόρθωση. Ένα φρέσκο μάτι βρίσκει τα λάθη που εσύ δεν βλέπεις πια."]}],"sum":["Τρεις φάσεις: **αναθεώρηση περιεχομένου**, **επιμέλεια γλώσσας**, **διόρθωση τυπογραφικών**. Πάντα από το μεγάλο στο μικρό.","Άφησε το κείμενο να κρυώσει. Διάβασε φωναχτά, σε άλλη συσκευή ή προς τα πίσω.","Ελληνικά: ότι/ό,τι, πως/πώς, που/πού, η/ή. Τα ρήματα παθητικής φωνής τελειώνουν σε -αι.","Αγγλικά: its/it’s, their/there/they’re, comma splice, συνέπεια στο Oxford comma.","Φύλλο στυλ για συνέπεια. Δοκιμαστές αναγνώστες για σχόλια. Τελική λίστα ελέγχου πριν την έκδοση."],"ex":{"t":"Παράδειγμα: πριν και μετά την επιμέλεια","x":"Πριν: «Η Μαρίνα είπε πως, δεν ξέρει ποιος το έκανε αυτό ούτε πως να το βρει. Ο φάρος ήταν κλειστός, Ο δήμαρχος δεν ήξερε.»\nΜετά: «Η Μαρίνα είπε ότι δεν ξέρει ποιος το έκανε ούτε πώς να το βρει. Ο φάρος ήταν κλειστός. Ο δήμαρχος δεν ήξερε.»"},"cards":[["Αναθεώρηση περιεχομένου","Έλεγχος δομής, πλοκής, χαρακτήρων, κενών. Μεγάλες αλλαγές."],["Επιμέλεια γλώσσας (copy edit)","Πρόταση προς πρόταση: γραμματική, ύφος, στίξη, ορθογραφία, συνέπεια."],["Διόρθωση τυπογραφικών (proofreading)","Τελευταίος έλεγχος του στοιχειοθετημένου κειμένου για μικρά λάθη."],["Ότι και ό,τι","ότι = σύνδεσμος («είπε ότι θα έρθει»). ό,τι = αντωνυμία με κόμμα («κάνε ό,τι θέλεις»)."],["Πως και πώς","πως = σύνδεσμος. πώς = ερωτηματικό με τόνο («Πώς σε λένε;»)."],["Που και πού","που = αναφορικό. πού = ερωτηματικό με τόνο («Πού είσαι;»)."],["Άνω τελεία (·)","Παύση μεγαλύτερη από το κόμμα και μικρότερη από την τελεία. Ανάλογο του αγγλικού semicolon."],["Its και it’s","its = κτήση. it’s = it is ή it has."],["Comma splice","Δύο ανεξάρτητες προτάσεις ενωμένες μόνο με κόμμα. Διορθώνεται με τελεία, semicolon ή σύνδεσμο."],["Φύλλο στυλ (style sheet)","Έγγραφο με τις αποφάσεις συνέπειας του βιβλίου: ονόματα, εισαγωγικά, αριθμοί, ημερομηνίες."]],"qs":[{"t":"mcq","q":"Ποια είναι η σωστή σειρά των φάσεων επιμέλειας;","o":["Αναθεώρηση περιεχομένου, επιμέλεια γλώσσας, διόρθωση τυπογραφικών","Διόρθωση τυπογραφικών, επιμέλεια γλώσσας, αναθεώρηση περιεχομένου","Επιμέλεια γλώσσας, διόρθωση τυπογραφικών, αναθεώρηση περιεχομένου","Όλες ταυτόχρονα"],"why":"Πάντα από το μεγάλο στο μικρό."},{"t":"mcq","q":"Τι κάνει η αναθεώρηση περιεχομένου;","o":["Ελέγχει δομή, πλοκή, χαρακτήρες, κενά και επαναλήψεις","Βάζει τα κόμματα","Διορθώνει τον αριθμό σελίδων","Επιλέγει το εξώφυλλο"],"why":"Ελέγχει δομή, πλοκή, χαρακτήρες και κενά."},{"t":"mcq","q":"Τι κάνει η επιμέλεια γλώσσας (copy edit);","o":["Ελέγχει πρόταση προς πρόταση γραμματική, ύφος, στίξη και συνέπεια","Αλλάζει την πλοκή","Επιλέγει τον τίτλο","Ετοιμάζει το εξώφυλλο"],"why":"Πρόταση προς πρόταση."},{"t":"mcq","q":"Τι είναι η διόρθωση τυπογραφικών (proofreading);","o":["Ο τελικός έλεγχος του στοιχειοθετημένου κειμένου για μικρά λάθη","Η πρώτη ανάγνωση","Η συγγραφή του περιγράμματος","Η μετάφραση"],"why":"Γίνεται στο τελικό στοιχειοθετημένο κείμενο."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Αν γυαλίσεις τις προτάσεις πριν αναθεωρήσεις τη δομή, μπορεί να χάσεις χρόνο, επειδή θα κόψεις κεφάλαια.","a":true,"why":"Γι' αυτό πάμε από το μεγάλο στο μικρό."},{"t":"mcq","q":"Γιατί αφήνουμε το κείμενο να «κρυώσει»;","o":["Για να το διαβάσουμε αργότερα σαν αναγνώστες και όχι σαν συγγραφείς","Για να τελειώσει η μελάνη","Για να το ξεχάσουμε για πάντα","Δεν έχει σημασία"],"why":"Μετά από καιρό διαβάζεις σαν αναγνώστης."},{"t":"mcq","q":"Ποιο κόλπο βοηθά να βρεις λάθη που το μάτι δεν βλέπει;","o":["Διάβασμα φωναχτά, σε άλλη συσκευή ή προς τα πίσω","Γρήγορο ξεφύλλισμα","Μικρότερη γραμματοσειρά","Απόκρυψη των κεφαλαίων"],"why":"Διάβασμα προς τα πίσω ή φωναχτά, σε άλλη συσκευή."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Αν μια σκηνή δεν προσφέρει τίποτα στην ιστορία, πρέπει να τη διατηρήσω επειδή την αγαπώ.","a":false,"why":"Κόψε χωρίς οίκτο ό,τι δεν προσφέρει."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"«Είπε ___ θα έρθει.» (σύνδεσμος που εισάγει δευτερεύουσα)","o":["ότι","ό,τι"],"why":"Ο σύνδεσμος είναι «ότι»."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"«Κάνε ___ θέλεις.» (αόριστη αντωνυμία)","o":["ό,τι","ότι"],"why":"Η αντωνυμία γράφεται «ό,τι», με κόμμα."},{"t":"fix","q":"«Πως σε λένε;»","x":"Ποια εκδοχή είναι σωστή;","o":["Πώς σε λένε;","Πως σε λένε;","Πος σε λένε;","Πως, σε λένε;"],"why":"Στην ερώτηση γράφεται «πώς» με τόνο."},{"t":"fix","q":"«Πού είσαι;»","x":"Ποια εκδοχή είναι σωστή;","o":["Πού είσαι;","Που είσαι;","Πού, είσαι;","Πο είσαι;"],"why":"Το ερωτηματικό «πού» παίρνει τόνο."},{"t":"fix","q":"«Ο φάρος πού είδα ήταν κλειστός.»","x":"Ποια εκδοχή είναι σωστή;","o":["Ο φάρος που είδα ήταν κλειστός.","Ο φάρος πού είδα ήταν κλειστός.","Ο φάρος ποιος είδα ήταν κλειστός.","Ο φάρος πως είδα ήταν κλειστός."],"why":"Το αναφορικό «που» δεν τονίζεται."},{"t":"fix","q":"«Θέλεις τσάι η καφέ;»","x":"Ποια εκδοχή είναι σωστή;","o":["Θέλεις τσάι ή καφέ;","Θέλεις τσάι η καφέ;","Θέλεις τσάι ει καφέ;","Θέλεις τσάι ή, καφέ;"],"why":"Ο διαζευκτικός σύνδεσμος γράφεται «ή» με τόνο."},{"t":"fix","q":"«Είπε πώς θα έρθει.» (εννοώ: είπε ότι θα έρθει)","x":"Ποια εκδοχή είναι σωστή;","o":["Είπε πως θα έρθει.","Είπε πώς θα έρθει.","Είπε πως, θα έρθει.","Είπε πως θα, έρθει."],"why":"Ως σύνδεσμος (=ότι) γράφεται «πως» ή «ότι», χωρίς τόνο."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το «ό,τι» γράφεται με κόμμα όταν είναι αόριστη αντωνυμία.","a":true,"why":"Π.χ. «Φάε ό,τι θέλεις»."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το «ότι» ως σύνδεσμος γράφεται με κόμμα.","a":false,"why":"Ο σύνδεσμος «ότι» γράφεται χωρίς κόμμα."},{"t":"mcq","q":"Με ποια κατάληξη τελειώνουν τα ρήματα της παθητικής φωνής στον ενεστώτα (γ΄ ενικό);","o":["-αι (π.χ. γράφεται)","-ει","-η","-ι"],"why":"Τα παθητικά ρήματα γράφονται με -αι."},{"t":"fix","q":"«Το φαγητό ετοιμάζετε.»","x":"Ποια εκδοχή είναι σωστή;","o":["Το φαγητό ετοιμάζεται.","Το φαγητό ετοιμάζετε.","Το φαγητό ετοιμάζεται;","Το φαγητό ετοιμάζετε;"],"why":"Παθητικό ρήμα: «ετοιμάζεται» με -αι."},{"t":"mcq","q":"Ποια φράση έχει σωστά γραμμένο το «δεν»;","o":["Δεν μπορώ να έρθω.","Δε μπορώ να έρθω.","Δε ξέρω τίποτα.","Δε έρχομαι."],"why":"Μπροστά από μπ το ν διατηρείται."},{"t":"mcq","q":"Πότε διατηρείται το ν στο «μην»;","o":["Πριν από φωνήεν ή από κ, π, τ, ξ, ψ, γκ, μπ, ντ, τσ, τζ","Πάντα","Ποτέ","Μόνο πριν από ρήμα"],"why":"Πριν από φωνήεν ή κ, π, τ, ξ, ψ, γκ, μπ, ντ, τσ, τζ."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το «δε βλέπω» γράφεται σύμφωνα με τον κανόνα χωρίς ν, επειδή το «β» δεν ανήκει στα σύμφωνα που κρατούν το ν.","a":true,"why":"Το β δεν είναι ανάμεσα στα κ, π, τ, ξ, ψ, γκ, μπ, ντ, τσ, τζ."},{"t":"mcq","q":"Ποιο ελληνικό σημείο στίξης δείχνει μεγαλύτερη παύση από το κόμμα και μικρότερη από την τελεία;","o":["Η άνω τελεία (·)","Το θαυμαστικό","Τα εισαγωγικά","Η παρένθεση"],"why":"Η άνω τελεία."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στα ελληνικά το ερωτηματικό γράφεται με το σημάδι (;).","a":true,"why":"Μοιάζει οπτικά με το αγγλικό semicolon."},{"t":"fix","q":"«Η Μαρίνα, πήγε στον φάρο.»","x":"Ποια εκδοχή είναι σωστή;","o":["Η Μαρίνα πήγε στον φάρο.","Η Μαρίνα, πήγε στον φάρο.","Η Μαρίνα πήγε, στον φάρο.","Η, Μαρίνα πήγε στον φάρο."],"why":"Δεν βάζουμε κόμμα ανάμεσα σε υποκείμενο και ρήμα."},{"t":"fix","q":"«Μαρίνα έλα εδώ.»","x":"Ποια εκδοχή έχει σωστή προσφώνηση;","o":["Μαρίνα, έλα εδώ.","Μαρίνα έλα, εδώ.","Μαρίνα έλα εδώ,","Μαρίνα; έλα εδώ."],"why":"Η προσφώνηση χωρίζεται με κόμμα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Πριν από το «αλλά» βάζουμε συνήθως κόμμα.","a":true,"why":"Π.χ. «Ήθελε να έρθει, αλλά δεν μπορούσε»."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στα αποσιωπητικά βάζουμε όσες τελείες θέλουμε.","a":false,"why":"Τρεις τελείες."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"“The cat licked ___ paws.”","o":["its","it’s"],"why":"Κτήση: its."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"“___ raining outside.”","o":["It’s","Its"],"why":"Σημαίνει «it is»: it’s."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"“___ car is red.” (κτήση)","o":["their","there"],"why":"Κτήση: their."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"“___ going to be late.” (they are)","o":["They’re","Their"],"why":"Συντομογραφία του «they are»: they’re."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"“___ welcome.” (you are)","o":["You’re","Your"],"why":"Συντομογραφία του «you are»: you’re."},{"t":"fix","q":"“I was tired, I went to bed.”","x":"Ποια εκδοχή διορθώνει το comma splice;","o":["I was tired, so I went to bed.","I was tired, I went to bed.","I was tired I, went to bed.","I was, tired I went to bed."],"why":"Δύο ανεξάρτητες προτάσεις δεν ενώνονται μόνο με κόμμα."},{"t":"mcq","q":"Ποιο από τα παρακάτω είναι comma splice;","o":["She left early, the meeting was dull.","She left early because the meeting was dull.","She left early; the meeting was dull.","She left early. The meeting was dull."],"why":"Δύο ανεξάρτητες προτάσεις με μόνο ένα κόμμα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Το Oxford comma είναι το κόμμα πριν από το «and» στην απαρίθμηση τριών ή περισσότερων: apples, oranges, and pears.","a":true,"why":"Σημασία έχει η συνέπεια."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η απόστροφος φτιάχνει τον πληθυντικό των ουσιαστικών: «two apple’s».","a":false,"why":"Ο σωστός πληθυντικός είναι «two apples»."},{"t":"mcq","q":"Τι είναι το φύλλο στυλ (style sheet);","o":["Έγγραφο με τις αποφάσεις συνέπειας του βιβλίου","Το εξώφυλλο","Η πρώτη σελίδα","Ο τίτλος του κεφαλαίου"],"why":"Κρατά τις αποφάσεις συνέπειας."},{"t":"mcq","q":"Σε ποια περίπτωση ένα φύλλο στυλ βοηθά;","o":["Για συνέπεια σε ονόματα, εισαγωγικά, αριθμούς και ημερομηνίες","Για να αλλάζουμε ορθογραφία κάθε φορά","Για να κρύβουμε λάθη","Για να κοντύνουμε τον τίτλο"],"why":"Ονόματα, εισαγωγικά, αριθμοί, ημερομηνίες."},{"t":"mcq","q":"Τι είναι το ημερολόγιο γεγονότων στη μυθοπλασία;","o":["Σημειώσεις για το ποιος ήταν πού, πότε και τι ηλικία είχε, ώστε να μην προκύπτουν λάθη συνέχειας","Ο πρόλογος","Ο κατάλογος εκδοτών","Το εξώφυλλο"],"why":"Αποφεύγονται λάθη συνέχειας."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στη μη μυθοπλασία ένας λανθασμένος αριθμός μπορεί να χαλάσει την αξιοπιστία όλου του βιβλίου.","a":true,"why":"Γι' αυτό ελέγχεις στοιχεία και παραπομπές."},{"t":"mcq","q":"Ποιος είναι ο ρόλος των δοκιμαστών αναγνωστών (beta readers);","o":["Διαβάζουν το κείμενο και λένε πού βαρέθηκαν, μπερδεύτηκαν ή τους άρεσε","Εκδίδουν το βιβλίο","Σχεδιάζουν το εξώφυλλο","Μεταφράζουν"],"why":"Δείχνουν πού βαρέθηκαν ή μπερδεύτηκαν."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Αν πολλοί δοκιμαστές αναγνώστες λένε το ίδιο πρόβλημα, πρέπει να το πάρω σοβαρά.","a":true,"why":"Το κοινό σημείο είναι συνήθως πραγματικό πρόβλημα."},{"t":"mcq","q":"Ποιες ερωτήσεις βοηθούν περισσότερο τους δοκιμαστές;","o":["Πού σταμάτησες; Τι δεν κατάλαβες; Ποιος χαρακτήρας δεν σε έπεισε;","Σου άρεσε;","Είναι καλό;","Τι ώρα το διάβασες;"],"why":"Συγκεκριμένα σχόλια."},{"t":"ord","q":"Βάλε τα βήματα αναθεώρησης στη σωστή σειρά.","lines":["Αφήνω το κείμενο να κρυώσει","Το διαβάζω ολόκληρο χωρίς να διορθώνω","Διορθώνω τη δομή","Διορθώνω τη γλώσσα"],"why":"Αφήνω να κρυώσει, διαβάζω χωρίς διορθώσεις, διορθώνω δομή, διορθώνω γλώσσα."},{"t":"ord","q":"Βάλε τις φάσεις σε σειρά.","lines":["Αναθεώρηση περιεχομένου","Επιμέλεια γλώσσας","Διόρθωση τυπογραφικών"],"why":"Αναθεώρηση, επιμέλεια γλώσσας, διόρθωση τυπογραφικών."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Το ___ είναι το κόμμα πριν από το «and» στην απαρίθμηση.","o":["Oxford comma","comma splice","semicolon","apostrophe"],"why":"Λέγεται Oxford comma."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Το «ότι» ως σύνδεσμος γράφεται ___ κόμμα.","o":["χωρίς","με","πάντα με","μόνο στην αρχή"],"why":"Μόνο το «ό,τι» έχει κόμμα."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Η ερώτηση «___ σε λένε;» γράφεται με τόνο.","o":["Πώς","Πως","Πος","Πως,"],"why":"Το ερωτηματικό «πώς» τονίζεται."},{"t":"blank","q":"Τι συμπληρώνει το κενό;","x":"Το αναφορικό ___ δεν παίρνει τόνο.","o":["που","πού","πως","πώς"],"why":"Το αναφορικό «που» δεν τονίζεται."}],"labs":[{"t":"Διόρθωσε το κείμενο","p":"Διόρθωσε τα λάθη: «Ρώτησα πως ήταν η μέρα της και μου απάντησε, ότι ήθελε ό τι θέλει ο καθένας. Θέλεις τσάι η καφέ; Το φαγητό ετοιμάζετε στην κουζίνα.»","h":"Έλεγξε: πως/πώς, ότι, ό,τι, ή/η, το κόμμα και την κατάληξη του ρήματος.","m":"«Ρώτησα πώς ήταν η μέρα της και μου απάντησε ότι ήθελε ό,τι θέλει ο καθένας. Θέλεις τσάι ή καφέ; Το φαγητό ετοιμάζεται στην κουζίνα.»","c":["Το «πώς» με τόνο στην ερώτηση.","Το «ότι» χωρίς κόμμα πριν.","Το «ό,τι» με κόμμα.","Το «ή» με τόνο.","Το «ετοιμάζεται» με -αι."]},{"t":"Δύο φάσεις επιμέλειας","p":"Πάρε μια παράγραφο δικής σου και κάνε δύο περάσματα: πρώτα στο περιεχόμενο (τι λείπει, τι περισσεύει), μετά στη γλώσσα (στίξη, ορθογραφία). Γράψε τι άλλαξες σε κάθε πέρασμα.","h":"Μην κάνεις και τα δύο μαζί. Σημείωσε χωριστά.","m":"Πέρασμα 1: κόβω την πρώτη πρόταση, γιατί επαναλαμβάνει όσα λέει η δεύτερη, και προσθέτω μία λεπτομέρεια για τον χώρο.\nΠέρασμα 2: διορθώνω το κόμμα πριν από το «αλλά» και το «πως» σε «ότι».","c":["Υπάρχουν δύο ξεχωριστά περάσματα.","Το πρώτο αφορά περιεχόμενο, το δεύτερο γλώσσα.","Οι αλλαγές είναι καταγεγραμμένες."]},{"t":"Το φύλλο στυλ του βιβλίου σου","p":"Γράψε ένα φύλλο στυλ έξι γραμμών για το βιβλίο σου: ονόματα χαρακτήρων, εισαγωγικά, αριθμοί, ημερομηνίες, κεφαλαία, αγγλικοί όροι.","h":"Αποφάσισε μία φορά και κράτα την απόφαση σε όλο το βιβλίο.","m":"Ονόματα: Μαρίνα Δρόσου, Στέλιος Κ.\nΕισαγωγικά: « » για διάλογο και ' ' για ονόματα έργων.\nΑριθμοί: ολογράφως έως το δέκα.\nΗμερομηνίες: 12 Μαρτίου 1998.\nΚεφαλαία: μόνο στην αρχή πρότασης και σε κύρια ονόματα.\nΞένοι όροι: πλάγια γράμματα την πρώτη φορά, με μετάφραση.","c":["Καλύπτει τουλάχιστον έξι θέματα.","Είναι συγκεκριμένο.","Το κείμενο μπορεί να το ακολουθήσει."]}]},{"n":6,"title":"Έκδοση και διάθεση","mentor":{"name":"Κύριος Τόμος","role":"μέντορας της Έκδοσης","g":"send","line":"Ένα βιβλίο που δεν φτάνει σε αναγνώστη μένει συρτάρι. Μάθε τι χρειάζεται για να βγει στον κόσμο."},"lesson":[{"h":"Οι δρόμοι προς την έκδοση","p":["Υπάρχουν τρεις βασικοί δρόμοι. Στον **παραδοσιακό εκδότη** στέλνεις το χειρόγραφο, και ο εκδοτικός οίκος το αξιολογεί. Αν το δεχτεί, αναλαμβάνει επιμέλεια, εξώφυλλο, εκτύπωση και διανομή, και η συμφωνία γίνεται με σύμβαση. Δεν πληρώνεις εσύ για να εκδοθεί, αλλά η αποδοχή είναι δύσκολη και παίρνει χρόνο.","Στην **αυτοέκδοση** (self-publishing) αναλαμβάνεις εσύ ό,τι κάνει ένας εκδότης: επιμέλεια, εξώφυλλο, μορφοποίηση, ISBN, διάθεση, προβολή. Ελέγχεις τα πάντα, αλλά αναλαμβάνεις και το κόστος και την ευθύνη.","Υπάρχουν και **υπηρεσίες έκδοσης επί πληρωμή**. Πρόσεξε: αν σου ζητούν χρήματα, ρώτησε ακριβώς τι περιλαμβάνεται (επιμέλεια, διανομή, προβολή;) και τι δικαιώματα κρατά ο συνεργάτης. Ένα τυπογραφείο που τυπώνει αντίτυπα δεν είναι το ίδιο με έναν εκδότη που τα διανέμει."]},{"h":"Μορφές βιβλίου","p":["Το ίδιο κείμενο μπορεί να εκδοθεί σε περισσότερες μορφές: **έντυπο** (χαρτόδετο, σκληρό εξώφυλλο), **ηλεκτρονικό βιβλίο** (e-book) και **ηχητικό βιβλίο** (audiobook).","Το γνωστό ανοιχτό πρότυπο e-book είναι το **EPUB**. Ρέει ανάλογα με το μέγεθος της οθόνης (το κείμενο αναδιατάσσεται), σε αντίθεση με το PDF που έχει σταθερή διάταξη σελίδας.","Η **εκτύπωση κατά παραγγελία** (print on demand, POD) τυπώνει το αντίτυπο μόλις παραγγελθεί. Δεν χρειάζεται να τυπώσεις και να αποθηκεύσεις εκατοντάδες αντίτυπα εκ των προτέρων. Το κόστος ανά αντίτυπο είναι συνήθως υψηλότερο από την παραδοσιακή εκτύπωση μεγάλης παρτίδας, αλλά το ρίσκο είναι μικρότερο."]},{"h":"Το ISBN","p":["Το **ISBN** (International Standard Book Number) είναι ο διεθνής αριθμός που ταυτοποιεί ένα βιβλίο. Από το 2007 έχει **13 ψηφία**. Κάθε μορφή και κάθε έκδοση χρειάζεται δικό της ISBN: το έντυπο και το e-book του ίδιου βιβλίου έχουν διαφορετικά.","Το τελευταίο ψηφίο είναι **ψηφίο ελέγχου**. Υπολογίζεται από τα πρώτα 12: πολλαπλασιάζεις τα ψηφία εναλλάξ με 1 και με 3, τα προσθέτεις, παίρνεις το υπόλοιπο της διαίρεσης με το 10 και το συμπληρώνεις μέχρι το 10 (αν βγει 10, το ψηφίο είναι 0).","> Παράδειγμα: 978030640615 → 9·1 + 7·3 + 8·1 + 0·3 + 3·1 + 0·3 + 6·1 + 4·3 + 0·1 + 6·3 + 1·1 + 5·3 = 93. Το υπόλοιπο με το 10 είναι 3, άρα το ψηφίο ελέγχου είναι 10 − 3 = 7. Το ISBN είναι 9780306406157.","Στην Ελλάδα το ISBN δίνεται από το Ελληνικό Κέντρο Αριθμοδότησης ISBN, ISSN και ISMN της Εθνικής Βιβλιοθήκης της Ελλάδος. Οι πλατφόρμες αυτοέκδοσης, όπως το Amazon KDP, μπορεί να δίνουν δωρεάν ISBN για έντυπο, αλλά αυτό συνδέεται με την πλατφόρμα και το όνομα του εκδότη εμφανίζεται ως της πλατφόρμας. Αν θέλεις δικό σου εκδοτικό όνομα και έλεγχο σε όποια πλατφόρμα διαλέξεις, αγόρασε ή ζήτησε δικό σου ISBN πριν την έκδοση."]},{"h":"Τίτλος και εξώφυλλο","p":["Ο τίτλος και το εξώφυλλο είναι η πρώτη επαφή του αναγνώστη με το βιβλίο. Ο καλός τίτλος είναι **σύντομος, ευκολομνημόνευτος** και δείχνει το είδος ή το θέμα. Στα βιβλία μη μυθοπλασίας ένας **υπότιτλος** εξηγεί την υπόσχεση («Γράφω βιβλίο από το μηδέν: οδηγός για αρχάριους»).","Το εξώφυλλο πρέπει να διαβάζεται και σε **μικρό μέγεθος** (μικρογραφία στο διαδίκτυο). Δοκίμασέ το σε μέγεθος νυχιού: αν ο τίτλος διαβάζεται, είσαι καλά. Το στυλ πρέπει να ταιριάζει στο είδος του βιβλίου: ένα αστυνομικό και ένα παιδικό δεν έχουν την ίδια εμφάνιση.","Για έντυπα, τα αρχεία χρειάζονται **περιθώριο αιμορραγίας** (bleed): η εικόνα προεκτείνεται λίγο έξω από το τελικό όριο, ώστε το κόψιμο να μη αφήνει λευκή ακμή. Συνήθως είναι περίπου 3 χιλιοστά, αλλά έλεγξε τις οδηγίες του τυπογραφείου ή της πλατφόρμας.","Χρησιμοποίησε εικόνες και γραμματοσειρές για τις οποίες έχεις **άδεια**. Μια εικόνα από το διαδίκτυο δεν είναι ελεύθερη επειδή τη βρήκες εκεί."]},{"h":"Μεταδεδομένα και περιγραφή","p":["Τα **μεταδεδομένα** είναι οι πληροφορίες που συνοδεύουν το βιβλίο στα βιβλιοπωλεία και στις πλατφόρμες: τίτλος, υπότιτλος, όνομα συγγραφέα, περιγραφή, κατηγορίες, λέξεις-κλειδιά, γλώσσα, ISBN, ημερομηνία έκδοσης.","Η **περιγραφή** (blurb) είναι το κείμενο που πείθει τον αναγνώστη. Στη μυθοπλασία ξεκινά με το λογλάιν του κεφαλαίου 1 και φτάνει στο εμπόδιο, χωρίς να αποκαλύπτει το τέλος. Στη μη μυθοπλασία λέει ποιον βοηθά και τι θα μάθει.","Οι **λέξεις-κλειδιά** και οι **κατηγορίες** βοηθούν να βρεθεί το βιβλίο σε αναζήτηση. Διάλεξε όρους που θα έγραφε ο αναγνώστης που ψάχνει το θέμα σου.","Η σύντομη **βιογραφία του συγγραφέα** λέει γιατί είσαι κατάλληλος να γράψεις αυτό το βιβλίο. Δύο ή τρεις προτάσεις αρκούν."]},{"h":"Πνευματικά δικαιώματα και άδειες","p":["Τα πνευματικά δικαιώματα του συγγραφέα ισχύουν **από τη στιγμή της δημιουργίας**, χωρίς εγγραφή ή αίτηση. Στις χώρες της ΕΕ η προστασία διαρκεί **70 χρόνια μετά τον θάνατο του δημιουργού**. Η σήμανση © με το έτος είναι προαιρετική, αλλά πρακτική.","Όταν υπογράφεις σύμβαση με εκδότη, διάβασε προσεκτικά: τι δικαιώματα παραχωρείς, για πόσα χρόνια, σε ποιες γλώσσες και μορφές, ποιο ποσοστό παίρνεις, και αν έχεις δικαίωμα να πάρεις πίσω τα δικαιώματα αν το βιβλίο δεν πουλά. Για σύμβαση, ζήτα νομική συμβουλή. Αυτό το μάθημα δεν αντικαθιστά δικηγόρο.","Οι **άδειες Creative Commons** είναι έτοιμες άδειες με τις οποίες ο δημιουργός επιτρέπει σε άλλους να χρησιμοποιούν το έργο υπό όρους (π.χ. αναφορά πηγής, μη εμπορική χρήση). Δεν σημαίνουν ότι παραιτείσαι από τα δικαιώματά σου.","Όταν παραθέτεις κείμενο άλλου, κράτα το σύντομο, δήλωσε την πηγή και μην αντιγράφεις μεγάλα κομμάτια. Για περισσότερα, ζήτα άδεια από τον δικαιούχο."]},{"h":"Τιμή, διάθεση και προβολή","p":["Η **τιμή** προκύπτει από το κόστος εκτύπωσης (για το έντυπο), το ποσοστό της πλατφόρμας ή του βιβλιοπωλείου, και το ποσό που θέλεις να κερδίσεις ανά αντίτυπο. Τα ποσοστά των πλατφορμών αλλάζουν, γι' αυτό έλεγξε πάντα τους τρέχοντες όρους πριν αποφασίσεις.","Η **διάθεση** μπορεί να γίνεται μέσω πλατφορμών (Amazon KDP και παρόμοιες), βιβλιοπωλείων, του προσωπικού σου ιστότοπου και άμεσα σε εκδηλώσεις. Για φορολογικές υποχρεώσεις και έσοδα συμβουλεύσου λογιστή.","Η **προβολή** ξεκινά πριν την έκδοση: μοιράσου αποσπάσματα (δικά σου), ζήτα από τους δοκιμαστές αναγνώστες να γράψουν ειλικρινή κριτική, φτιάξε μία σελίδα με την περιγραφή και ένα δείγμα κεφαλαίου. Η πιο ισχυρή προβολή είναι ένας ικανοποιημένος αναγνώστης που το προτείνει σε άλλον.","Μην ξεχνάς ότι ένα βιβλίο δεν τελειώνει με την έκδοση. Συγκέντρωσε σχόλια, διόρθωσε λάθη, και σκέψου το επόμενο."]}],"sum":["Τρεις δρόμοι: **παραδοσιακός εκδότης**, **αυτοέκδοση**, **υπηρεσίες επί πληρωμή** (ρώτα τι περιλαμβάνουν).","Μορφές: έντυπο, e-book (EPUB), ηχητικό. **POD** = εκτύπωση κατά παραγγελία, χωρίς απόθεμα.","**ISBN-13**: διαφορετικό για κάθε μορφή, με ψηφίο ελέγχου στο τέλος.","Τίτλος σύντομος, εξώφυλλο ευανάγνωστο σε μικρό μέγεθος, εικόνες με **άδεια**. Περιθώριο αιμορραγίας για έντυπο.","Πνευματικά δικαιώματα από τη δημιουργία, **70 χρόνια μετά τον θάνατο** (ΕΕ). Διάβασε τη σύμβαση και ζήτα νομική συμβουλή."],"ex":{"t":"Παράδειγμα: περιγραφή (blurb) βιβλίου","x":"«Μια νεαρή φαροφύλακας θέλει να κρατήσει τον φάρο της ανοιχτό, αλλά η εταιρεία έχει υπογράψει να τον κλείσει πριν από τον χειμώνα. Για να τον σώσει, πρέπει να βρει σύμμαχο σε ένα χωριό που έχει ξεχάσει τη θάλασσα. Ένα μυθιστόρημα για την υπομονή, τη γειτονιά και το φως.»"},"cards":[["Παραδοσιακός εκδότης","Εκδοτικός οίκος που αξιολογεί το χειρόγραφο και, αν το δεχτεί, αναλαμβάνει επιμέλεια, εκτύπωση και διανομή με σύμβαση."],["Αυτοέκδοση (self-publishing)","Ο συγγραφέας αναλαμβάνει επιμέλεια, εξώφυλλο, μορφοποίηση, ISBN, διάθεση και προβολή."],["EPUB","Ανοιχτό πρότυπο e-book με ρέουσα διάταξη που προσαρμόζεται στην οθόνη."],["POD (print on demand)","Εκτύπωση κατά παραγγελία: τυπώνεται το αντίτυπο μόλις παραγγελθεί, χωρίς απόθεμα."],["ISBN-13","Διεθνής αριθμός βιβλίου με 13 ψηφία. Κάθε μορφή ή έκδοση έχει δικό της ISBN."],["Ψηφίο ελέγχου ISBN","Το 13ο ψηφίο, που υπολογίζεται από τα πρώτα 12 με εναλλαγή βαρών 1 και 3."],["Περιθώριο αιμορραγίας (bleed)","Η εικόνα προεκτείνεται λίγο εκτός ορίων ώστε το κόψιμο να μην αφήνει λευκή ακμή (περίπου 3 χιλιοστά)."],["Μεταδεδομένα","Πληροφορίες του βιβλίου στις πλατφόρμες: τίτλος, περιγραφή, κατηγορίες, λέξεις-κλειδιά, γλώσσα, ISBN."],["Blurb","Η περιγραφή του βιβλίου που πείθει τον αναγνώστη, χωρίς να αποκαλύπτει το τέλος."],["Πνευματικά δικαιώματα","Ισχύουν από τη δημιουργία, χωρίς εγγραφή. Στην ΕΕ διαρκούν 70 χρόνια μετά τον θάνατο του δημιουργού."]],"qs":[{"t":"mcq","q":"Τι αναλαμβάνει ο παραδοσιακός εκδότης, αν δεχτεί το χειρόγραφο;","o":["Επιμέλεια, εξώφυλλο, εκτύπωση και διανομή","Μόνο την ιδέα","Μόνο το ISBN","Τίποτα"],"why":"Συνήθως επιμέλεια, εξώφυλλο, εκτύπωση και διανομή."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στον παραδοσιακό εκδότη, ο συγγραφέας πληρώνει συνήθως για να εκδοθεί το βιβλίο του.","a":false,"why":"Ο παραδοσιακός εκδότης αναλαμβάνει το κόστος και πληρώνει τον συγγραφέα με ποσοστά."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στην αυτοέκδοση ο συγγραφέας ελέγχει τα πάντα, αλλά αναλαμβάνει και το κόστος.","a":true,"why":"Ελευθερία και ευθύνη."},{"t":"mcq","q":"Τι πρέπει να ρωτήσεις πριν πληρώσεις μια υπηρεσία έκδοσης;","o":["Τι ακριβώς περιλαμβάνεται και τι δικαιώματα κρατά ο συνεργάτης","Πόσο όμορφο είναι το λογότυπο","Πόσα βιβλία έχει τυπώσει ο διευθυντής","Τίποτα"],"why":"Ρώτα τι ακριβώς περιλαμβάνεται και τι δικαιώματα κρατά ο συνεργάτης."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Εταιρεία που τυπώνει αντίτυπα, χωρίς διανομή ή προβολή","o":["Τυπογραφείο","Εκδοτικός οίκος"],"why":"Είναι τυπογραφείο, όχι εκδοτικός οίκος."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Οίκος που αξιολογεί, επιμελείται, τυπώνει και διανέμει το βιβλίο με σύμβαση","o":["Εκδοτικός οίκος","Τυπογραφείο"],"why":"Αυτά είναι χαρακτηριστικά εκδοτικού οίκου."},{"t":"mcq","q":"Ποιο είναι το ανοιχτό πρότυπο e-book που προσαρμόζεται στο μέγεθος της οθόνης;","o":["EPUB","JPG","MP3","PNG"],"why":"Το EPUB έχει ρέουσα διάταξη."},{"t":"mcq","q":"Ποια είναι η βασική διαφορά PDF και EPUB;","o":["Το PDF τι θα μάθει (μη μυθοπλασία). Μην αποκαλύψεις το τέλος.","h":"Τελείωσε με μια πρόταση που κάνει τον αναγνώστη να θέλει να ανοίξει το βιβλίο.","m":"«Ο Στέλιος ψαρεύει στη Σύμη όπως ο πατέρας του. Όταν το νέο λιμάνι απειλεί τη λιμνοθάλασσα, πρέπει να μάθει τη θάλασσα στον εφηβικό του γιο, με τον οποίο δεν μιλούν. Μια ιστορία για τους ανθρώπους που ξέρουν να περιμένουν, και για αυτούς που μάθαιναν να κρατούν τη σιωπή.»","c":["Έχει 60 έως 90 λέξεις.","Δείχνει ήρωα, στόχο, εμπόδιο.","Δεν αποκαλύπτει το τέλος.","Κλείνει με πρόσκληση."]},{"t":"Τίτλος και υπότιτλος","p":"Γράψε τρεις υποψήφιους τίτλους για το βιβλίο σου και διάλεξε έναν. Αν είναι μη μυθοπλασία, πρόσθεσε υπότιτλο που εξηγεί την υπόσχεση. Εξήγησε σε μία πρόταση γιατί διάλεξες τον έναν.","h":"Διάβασέ τον φωναχτά. Είναι ευκολομνημόνευτος;","m":"Υποψήφιοι: «Ο φάρος της Μαρίνας», «Λάδι και φως», «Πριν από τον χειμώνα». Διαλέγω το «Πριν από τον χειμώνα», επειδή δείχνει προθεσμία και ένταση. (Μη μυθοπλασία: «Γράφω βιβλίο από το μηδέν: οδηγός για αρχάριους».)","c":["Υπάρχουν τρεις τίτλοι.","Ένας έχει επιλεγεί.","Υπάρχει αιτιολόγηση.","Ο τίτλος είναι σύντομος."]},{"t":"Το σχέδιο έκδοσης","p":"Γράψε σε έξι γραμμές το σχέδιο έκδοσης του βιβλίου σου: ποιον δρόμο διαλέγεις, ποιες μορφές, πώς θα βρεις ISBN, ποιος κάνει το εξώφυλλο, πού θα το διαθέσεις και πώς θα το προβάλεις.","h":"Σημείωσε και ένα σημείο που θα ελέγξεις με νομικό ή λογιστή.","m":"1. Δρόμος: αυτοέκδοση.\n2. Μορφές: έντυπο (POD) και e-book (EPUB).\n3. ISBN: δικό μου, από το εθνικό κέντρο, ένα για κάθε μορφή.\n4. Εξώφυλλο: το σχεδιάζει γραφίστας, με άδεια για τις εικόνες.\n5. Διάθεση: πλατφόρμα και προσωπικός ιστότοπος.\n6. Προβολή: δείγμα κεφαλαίου και δοκιμαστές αναγνώστες. Θα ρωτήσω λογιστή για τη φορολογία.","c":["Έχει έξι γραμμές.","Επιλέγει δρόμο και μορφές.","Λέει πώς θα βρει ISBN.","Σημειώνει τι θα ελέγξει με ειδικό."]}]},{"n":7,"title":"Μη μυθοπλασία: από το θέμα στο βιβλίο","mentor":{"name":"Κύριος Οδηγός","role":"μέντορας της Μη μυθοπλασίας","g":"pen","line":"Ο αναγνώστης ανοίγει ένα βιβλίο γνώσης για να αλλάξει κάτι στη ζωή ή στη σκέψη του. Δώσ' του λόγο να φτάσει ως το τέλος."},"lesson":[{"h":"Τι είναι η μη μυθοπλασία","p":["**Μη μυθοπλασία** είναι κάθε βιβλίο που αφηγείται ή εξηγεί πραγματικά πράγματα: οδηγοί («πώς να...»), βιογραφίες, απομνημονεύματα, ιστορικά βιβλία, δοκίμια, ταξιδιωτικά, εκλαϊκευμένη επιστήμη.","Δεν σημαίνει «βαρετό». Ένα καλό βιβλίο μη μυθοπλασίας έχει σαφή φωνή, παραδείγματα και ρυθμό, όπως ένα μυθιστόρημα.","Η βασική διαφορά με τη μυθοπλασία: ο αναγνώστης περιμένει ότι όσα διαβάζει είναι **αληθή και ελέγξιμα**."]},{"h":"Ο αναγνώστης και η υπόσχεση","p":["Πριν γράψεις, απάντησε σε τρεις ερωτήσεις: **ποιος** θα το διαβάσει, **ποιο πρόβλημα ή ερώτημα** έχει, και **τι θα μπορεί να κάνει ή να καταλαβαίνει μετά την ανάγνωση**.","Η απάντηση γίνεται η **υπόσχεση** του βιβλίου και φαίνεται στον τίτλο, στον υπότιτλο και στην περιγραφή.","> Παράδειγμα υπόσχεσης: «Μετά από αυτό το βιβλίο, ένας αρχάριος θα μπορεί να σχεδιάσει και να ολοκληρώσει το πρώτο του βιβλίο μέσα σε έναν χρόνο.»","Ένα βιβλίο που προσπαθεί να απευθυνθεί σε όλους συνήθως δεν πείθει κανέναν."]},{"h":"Δομή και περίγραμμα","p":["Φτιάξε πρώτα **περίγραμμα**: λίστα κεφαλαίων και, για κάθε κεφάλαιο, μία πρόταση με το τι θα μάθει ο αναγνώστης.","Συνηθισμένες λογικές σειράς: **χρονολογική** (ιστορία, βιογραφία), **από το απλό στο σύνθετο** (οδηγοί και εγχειρίδια), **θεματική** (δοκίμια, συλλογές).","Δώσε στα κεφάλαια ένα **σταθερό μοτίβο**: σύντομη εισαγωγή, κύριο μέρος με παραδείγματα, σύνοψη, και, όπου ταιριάζει, άσκηση. Ο αναγνώστης νιώθει ότι ξέρει πού βρίσκεται.","Βάλε στην αρχή του βιβλίου τον χάρτη του, και στο τέλος κάθε κεφαλαίου μία φράση που οδηγεί στο επόμενο."]},{"h":"Έρευνα και πηγές","p":["Οι **πρωτογενείς πηγές** είναι το αρχικό υλικό: έγγραφα, επιστολές, συνεντεύξεις, δεδομένα, η δική σου εμπειρία. Οι **δευτερογενείς** μιλούν για το αρχικό υλικό: βιβλία, άρθρα, μελέτες άλλων.","Κράτα **σημειώσεις με πηγή** από την πρώτη ημέρα: τι διάβασες, από πού, ποια σελίδα. Αργότερα θα εξοικονομήσεις ώρες.","Έλεγξε τους ισχυρισμούς σε **περισσότερες από μία αξιόπιστες πηγές**, ειδικά αριθμούς, ημερομηνίες και ονόματα.","Μην αντιγράφεις. Γράψε με δικά σου λόγια και δήλωσε την πηγή. Αν παραθέτεις αυτούσιο κείμενο, βάλε εισαγωγικά και πηγή."]},{"h":"Σαφήνεια: γράψε για να τον καταλάβουν","p":["Εξήγησε κάθε νέο όρο την πρώτη φορά που τον χρησιμοποιείς. Προτίμησε σύντομες προτάσεις και καθημερινές λέξεις.","Ένα **παράδειγμα** συχνά εξηγεί καλύτερα από έναν ορισμό. Ένας **αριθμός** ή μια **σύγκριση** κάνουν την ιδέα απτή.","Χώρισε το κείμενο με **υπότιτλους**, σύντομες παραγράφους και, όπου χρειάζεται, λίστες ή πλαίσια.","> Αντί για «η αποτελεσματικότητα βελτιώνεται σημαντικά», γράψε «ο χρόνος έκδοσης έπεσε από έξι εβδομάδες σε δύο»."]},{"h":"Αφήγηση, απομνημονεύματα και ιδιωτικότητα","p":["Οι **ιστορίες και τα περιστατικά** κρατούν το ενδιαφέρον και εξηγούν ιδέες. Οι ιστορίες που χρησιμοποιείς πρέπει να είναι αληθινές ή να δηλώνονται ως φανταστικές.","Στα **απομνημονεύματα** (memoir) ο συγγραφέας γράφει για τη δική του ζωή. Μπορείς να θυμάσαι διαφορετικά από άλλους. Γράψε «όπως τα θυμάμαι» και μην παρουσιάζεις υποθέσεις ως γεγονότα.","Όταν γράφεις για **πραγματικούς ανθρώπους**, σκέψου την ιδιωτικότητά τους. Μπορείς να ζητήσεις συγκατάθεση ή να αλλάξεις στοιχεία που τους αναγνωρίζουν. Αν υπάρχει σοβαρός νομικός κίνδυνος, ζήτα νομική συμβουλή."]},{"h":"Ακρίβεια και εντιμότητα","p":["Ξεχώρισε το **γεγονός** («το βιβλίο εκδόθηκε το 2019») από τη **γνώμη** («είναι το καλύτερο βιβλίο»). Δήλωσε πότε κάτι είναι γνώμη ή εκτίμηση.","Όταν δεν είσαι βέβαιος, γράψ' το: «μάλλον», «σύμφωνα με», «δεν υπάρχουν σαφή στοιχεία». Η εντιμότητα χτίζει εμπιστοσύνη.","Ενημέρωνε το βιβλίο όταν αλλάζουν τα δεδομένα: νέα έκδοση ή διορθώσεις. Στα βιβλία που περιέχουν υγεία, νομικά ή οικονομικά, αναφέρε ότι δεν αντικαθιστούν τον ειδικό."]}],"sum":["Μη μυθοπλασία = αληθή και ελέγξιμα πράγματα: οδηγοί, βιογραφίες, δοκίμια, απομνημονεύματα.","Ξεκίνα από **ποιος** διαβάζει, **ποιο πρόβλημα** έχει και **τι θα κάνει μετά**: αυτή είναι η υπόσχεση.","Περίγραμμα πρώτα, σταθερό μοτίβο κεφαλαίου, λογική σειρά.","Σημείωσε πηγές από την αρχή, έλεγξε σε περισσότερες από μία πηγές, μην αντιγράφεις.","Σαφήνεια: εξήγησε όρους, δώσε παραδείγματα και αριθμούς. Ξεχώρισε γεγονός από γνώμη."],"ex":{"t":"Παράδειγμα: υπόσχεση βιβλίου","x":"Τίτλος: «Το πρώτο μου βιβλίο». Υπότιτλος: «Οδηγός 12 μηνών για όποιον ξεκινά από το μηδέν». Υπόσχεση: ο αναγνώστης θα έχει, στο τέλος, σχέδιο, πρώτο πρόχειρο και δρόμο προς την έκδοση."},"cards":[["Μη μυθοπλασία","Βιβλία με αληθή και ελέγξιμα περιεχόμενα: οδηγοί, βιογραφίες, δοκίμια, απομνημονεύματα."],["Υπόσχεση του βιβλίου","Τι θα μπορεί να κάνει ή να καταλαβαίνει ο αναγνώστης μετά την ανάγνωση."],["Περίγραμμα","Λίστα κεφαλαίων με μία πρόταση για το καθένα, πριν την πλήρη γραφή."],["Πρωτογενής πηγή","Αρχικό υλικό: έγγραφα, επιστολές, συνεντεύξεις, δεδομένα."],["Δευτερογενής πηγή","Υλικό που μιλά για το αρχικό: βιβλία, άρθρα, μελέτες άλλων."],["Απομνημονεύματα (memoir)","Βιβλίο του συγγραφέα για τη δική του ζωή."],["Γεγονός και γνώμη","Το γεγονός ελέγχεται. Η γνώμη δηλώνεται ως γνώμη."],["Σταθερό μοτίβο κεφαλαίου","Εισαγωγή, κύριο μέρος με παραδείγματα, σύνοψη, άσκηση."],["Σαφήνεια","Σύντομες προτάσεις, εξήγηση όρων, παραδείγματα, αριθμοί."],["Ιδιωτικότητα","Προσοχή όταν γράφεις για πραγματικούς ανθρώπους: συγκατάθεση ή αλλαγή αναγνωρίσιμων στοιχείων."]],"qs":[{"t":"mcq","q":"Ποιο ανήκει στη μη μυθοπλασία;","o":["Μια βιογραφία","Ένα αστυνομικό μυθιστόρημα","Ένα παραμύθι","Ένα ποίημα φαντασίας"],"why":"Οι βιογραφίες αφηγούνται πραγματικούς ανθρώπους."},{"t":"mcq","q":"Τι περιμένει ο αναγνώστης από ένα βιβλίο μη μυθοπλασίας;","o":["Να είναι αληθές και ελέγξιμο","Να είναι ευχάριστο μόνο","Να έχει πάντα ανατροπή","Να είναι σύντομο πάντα"],"why":"Να είναι αληθή και ελέγξιμα."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Η μη μυθοπλασία δεν μπορεί να έχει καλή φωνή και ρυθμό.","a":fals  ποιος θα διαβάσει το βιβλίο σου, ποιο πρόβλημα έχει, και τι θα μπορεί να κάνει μετά. Πρόσθεσε έναν τίτλο και έναν υπότιτλο.","h":"Αν δεν μπορείς να το πεις σε μία πρόταση, το θέμα ίσως είναι πολύ μεγάλο.","m":"«Αναγνώστης: ένας ενήλικας που θέλει να γράψει το πρώτο του βιβλίο και δεν ξέρει από πού να ξεκινήσει. Πρόβλημα: αναβάλλει επειδή το έργο φαίνεται τεράστιο. Υπόσχεση: σε 12 μήνες θα έχει πρώτο πρόχειρο και σχέδιο έκδοσης. Τίτλος: Το πρώτο μου βιβλίο. Υπότιτλος: Οδηγός 12 μηνών για όποιον ξεκινά από το μηδέν.»","c":["Λέει ποιος είναι ο αναγνώστης.","Λέει ποιο πρόβλημα έχει.","Λέει τι θα κάνει μετά.","Έχει τίτλο και υπότιτλο."]},{"t":"Περίγραμμα σε οκτώ γραμμές","p":"Γράψε ένα περίγραμμα με 8 κεφάλαια για το βιβλίο σου. Για κάθε κεφάλαιο γράψε έναν τίτλο και μία πρόταση για το τι θα μάθει ο αναγνώστης.","h":"Έλεγξε τη σειρά: κάθε κεφάλαιο στηρίζεται σε όσα προηγούνται;","m":"1. Γιατί να γράψω βιβλίο: καταλαβαίνεις τον σκοπό σου. 2. Η ιδέα: διαλέγεις θέμα και αναγνώστη. 3. Το περίγραμμα: χωρίζεις το έργο σε κεφάλαια. 4. Η έρευνα: μαζεύεις και ελέγχεις πηγές. 5. Το πρώτο πρόχειρο: γράφεις χωρίς να διορθώνεις. 6. Η επιμέλεια: καθαρίζεις το κείμενο. 7. Η έκδοση: διαλέγεις δρόμο. 8. Η προβολή: φτάνεις στους αναγνώστες.","c":["Έχει 8 κεφάλαια.","Κάθε κεφάλαιο έχει τίτλο και μία πρόταση.","Η σειρά έχει λογική.","Δεν επαναλαμβάνεται το ίδιο θέμα."]},{"t":"Εξήγησε έναν όρο","p":"Διάλεξε έναν όρο από το θέμα σου που ο αρχάριος δεν γνωρίζει. Γράψε σε 5 έως 7 προτάσεις: ορισμό, ένα παράδειγμα και έναν αριθμό ή μια σύγκριση.","h":"Διάβασέ το σε κάποιον που δεν ξέρει το θέμα. Κατάλαβε;","m":"«Το ISBN είναι ο αριθμός που ταυτοποιεί ένα βιβλίο. Σκέψου το σαν τον αριθμό ταυτότητας του βιβλίου. Έχει 13 ψηφία και κάθε μορφή, για παράδειγμα έντυπο και e-book, παίρνει δικό της. Το χρειάζονται τα βιβλιοπωλεία και οι πλατφόρμες για να το βρίσκουν και να το παραγγέλνουν.»","c":["Έχει ορισμό.","Έχει παράδειγμα.","Έχει αριθμό ή σύγκριση.","Οι προτάσεις είναι σύντομες."]}]},{"n":8,"title":"Συνήθειες γραφής και ανατροφοδότηση","mentor":{"name":"Κυρία Ρουτίνα","role":"μέντορας του Συγγραφέα στην πράξη","g":"lamp","line":"Ένα βιβλίο γράφεται λέξη τη λέξη, μέρα τη μέρα. Μάθε να κρατάς τον ρυθμό και να μαθαίνεις από τους αναγνώστες σου."},"lesson":[{"h":"Η συνήθεια της γραφής","p":["Τα περισσότερα βιβλία δεν τελειώνουν επειδή ο συγγραφέας περιμένει έμπνευση. Τελειώνουν επειδή γράφεται λίγο **κάθε φορά**, σε σταθερές στιγμές.","Διάλεξε **σταθερή ώρα και τόπο**, και έναν **μικρό στόχο**: 20 λεπτά ή 300 λέξεις την ημέρα είναι πολύ καλό ξεκίνημα. Ο στόχος πρέπει να είναι τόσο μικρός που να μην μπορείς να αρνηθείς.","Κράτα **ημερολόγιο γραφής**: μέρα, λέξεις, μία γραμμή για το πώς πήγε. Η πρόοδος που φαίνεται σε κρατά κινητοποιημένο.","Αν χάσεις μια μέρα, μην ξεκινήσεις από το μηδέν: συνέχισε την επόμενη."]},{"h":"Πρώτα γράψε, μετά διόρθωσε","p":["Το **πρώτο πρόχειρο** δεν χρειάζεται να είναι καλό. Χρειάζεται να υπάρχει. Αν διορθώνεις κάθε πρόταση καθώς γράφεις, προχωράς πολύ αργά.","Ξεχώρισε δύο ρόλους: ο **δημιουργός** γράφει και ο **επιμελητής** διορθώνει. Δεν δουλεύουν την ίδια στιγμή.","Όταν δεν θυμάσαι ένα όνομα ή ένα στοιχείο, γράψε ένα σημάδι όπως [ΕΛΕΓΞΕ] και συνέχισε. Θα το βρεις αργότερα."]},{"h":"Το μπλοκάρισμα","p":["Το **μπλοκάρισμα** συμβαίνει στους περισσότερους συγγραφείς. Συχνές αιτίες: τελειομανία, φόβος της κριτικής, ασαφής πλοκή ή περίγραμμα, κούραση.","Τεχνικές: **ελεύθερη γραφή** για 10 λεπτά χωρίς διορθώσεις, γράψε τη **σκηνή που ξέρεις** αντί για αυτήν που σε μπλοκάρει, ρώτα «τι θα γινόταν αν...» ή «τι θέλει ο ήρωας τώρα;», περπάτα ή κάνε διάλειμμα, μίκρυνε τον στόχο σε 5 λεπτά.","Αν η δυσκολία επιμένει, ξαναδές το περίγραμμα. Συχνά το μπλοκάρισμα δείχνει πρόβλημα στη δομή, όχι στη γραφή."]},{"h":"Σχεδιάζεις ή ανακαλύπτεις","p":["Κάποιοι συγγραφείς σχεδιάζουν λεπτομερώς πριν γράψουν (στα αγγλικά **plotters**). Άλλοι ανακαλύπτουν την ιστορία γράφοντας (**pantsers**, από το «by the seat of your pants»).","Κανένας τρόπος δεν είναι σωστός για όλους. Πολλοί δουλεύουν **υβριδικά**: γενικό σχέδιο και ελευθερία στις λεπτομέρειες.","Στη μη μυθοπλασία χρειάζεται συνήθως περισσότερος σχεδιασμός, γιατί η δομή πρέπει να στηρίζει τα επιχειρήματα."]},{"h":"Ανατροφοδότηση από αναγνώστες","p":["Οι **δοκιμαστές αναγνώστες** (beta readers) διαβάζουν το χειρόγραφο πριν από την έκδοση και λένε τι ένιωσαν και πού μπερδεύτηκαν. Μια **ομάδα συγγραφής** δίνει τακτική ανατροφοδότηση.","Ζήτα συγκεκριμένα πράγματα: «Πού βαρέθηκες; Πού μπερδεύτηκες; Ποιος χαρακτήρας σου άρεσε;» Οι γενικές ερωτήσεις δίνουν γενικές απαντήσεις.","Όταν ακούς κριτική: **άκου χωρίς να υπερασπίζεσαι**, ρώτα για παραδείγματα, και μετά αποφάσισε μόνος. Αν πολλοί λένε το ίδιο, πρόσεξέ το. Η κριτική αφορά το κείμενο, όχι εσένα."]},{"h":"Αναθεώρηση και ασφάλεια των αρχείων","p":["Άσε το κείμενο να **κρυώσει**: μερικές ημέρες ή εβδομάδες χωρίς να το δεις. Μετά το διαβάζεις σαν αναγνώστης.","Η αναθεώρηση πάει **από το μεγάλο στο μικρό**: πρώτα δομή και πλοκή, μετά σκηνές και παράγραφοι, στο τέλος ορθογραφία και στίξη. Διάβασε και **φωναχτά**.","Φρόντισε τα αρχεία σου: **κανόνας 3-2-1**: 3 αντίγραφα, σε 2 διαφορετικά μέσα, με 1 εκτός του χώρου σου. Αποθήκευε εκδόσεις με ημερομηνία (π.χ. βιβλιο-2026-11-08).","Μην σβήνεις κομμένα κομμάτια: κράτα ένα αρχείο «αποκόμματα». Ίσως τα χρειαστείς."]},{"h":"Για τη μεγάλη διαδρομή","p":["Μοίρασε το βιβλίο σε μικρά βήματα: στόχοι ανά εβδομάδα και ανά μήνα. Γιόρτασε τις μικρές νίκες: κεφάλαιο τελειωμένο, πρώτο πρόχειρο, πρώτη επιμέλεια.","Διάβαζε. Ό,τι διαβάζεις στο είδος σου είναι σχολείο: πρόσεχε πώς ξεκινούν τα κεφάλαια, πώς χτίζεται η ένταση, πώς εξηγούνται οι ιδέες.","Αν διακόψεις για καιρό, ξεκίνα ξανά με μια μικρή συνεδρία και διάβασε τις τελευταίες σελίδες. Φρόντισε και τον εαυτό σου: διαλείμματα, ύπνο, κίνηση. Η γραφή είναι μαραθώνιος."]}],"sum":["Σταθερή ώρα, μικρός στόχος (π.χ. 20 λεπτά ή 300 λέξεις), ημερολόγιο γραφής.","Πρώτα γράφεις, μετά διορθώνεις. Δημιουργός και επιμελητής δεν δουλεύουν μαζί.","Μπλοκά κρατήσεις.","h":"Αν κολλήσεις, γράψε «δεν ξέρω τι να γράψω» ως το επόμενο να έρθει.","m":"«Ανακάλυψα ότι ο ήρωας φοβάται τη θάλασσα, κάτι που δεν είχα σκεφτεί. Θα κρατήσω αυτήν την ιδέα για τη δεύτερη πράξη.»","c":["Έγραψα χωρίς να σταματήσω.","Δεν διόρθωσα όσο έγραφα.","Έγραψα τι ανακάλυψα.","Έγραψα τι θα κρατήσω."]},{"t":"Ερωτήσεις προς δοκιμαστές αναγνώστες","p":"Γράψε 5 συγκεκριμένες ερωτήσεις που θα έκανες στους δοκιμαστές αναγνώστες του βιβλίου σου. Τουλάχιστον μία για τον ρυθμό, μία για τη σαφήνεια και μία για το τέλος.","h":"Απόφυγε ερωτήσεις που απαντώνται με ναι ή όχι.","m":"«1. Σε ποιο σημείο θέλησες να σταματήσεις να διαβάζεις; 2. Πού μπερδεύτηκες; 3. Ποιος χαρακτήρας σε κράτησε; 4. Πώς ένιωσες στο τέλος; 5. Τι θα άλλαζες στο τρίτο κεφάλαιο;»","c":["Έχει 5 ερωτήσεις.","Μία είναι για τον ρυθμό.","Μία είναι για τη σαφήνεια.","Μία είναι για το τέλος."]}]}],"MS":[{"n":"m1","title":"Ορθογραφία: τα λάθη που ξαναγυρίζουν","mentor":{"name":"Δόκτωρ Κόμμα","role":"φύλακας της μνήμης","g":"glass","line":"Τα ίδια λάθη επιστρέφουν μέχρι να τους βάλεις κανόνα. Εδώ είναι οι κανόνες."},"lesson":[{"h":"Το τελικό ν","p":["Το **ν** στο τέλος των λέξεων «δεν», «μην», «την», «αυτήν» **διατηρείται** πριν από φωνήεν και πριν από τα **κ, π, τ, ξ, ψ, γκ, μπ, ντ, τσ, τζ**. Πριν από όλα τα άλλα σύμφωνα (β, γ, δ, ζ, θ, λ, μ, ν, ρ, σ, φ, χ) **παραλείπεται**.","> Δεν έρχομαι. · Δεν πάω. · Δε βλέπω. · Δε θέλω. · Την καλημέρα. · Τη βιβλιοθήκη.","Το άρθρο «τον» (αιτιατική αρσενικού) συνήθως γράφεται με ν. Αν έχεις αμφιβολία, κοίτα το πρώτο γράμμα της επόμενης λέξης. Σε όλο το βιβλίο κράτα τον ίδιο κανόνα, ώστε το κείμενο να είναι συνεπές."]},{"h":"Ότι, ό,τι, πως, πώς, που, πού, ή, η","p":["Το **ότι** είναι σύνδεσμος και εισάγει δευτερεύουσα πρόταση: «Είπε **ότι** θα έρθει.» Το **ό,τι** (με κόμμα) σημαίνει «οτιδήποτε»: «Κάνε **ό,τι** θέλεις.»","Το **πως** (χωρίς τόνο) είναι σύνδεσμος, όπως το «ότι»: «Είπε **πως** κουράστηκε.» Το **πώς** (με τόνο) ρωτά τρόπο: «**Πώς** το έγραψες;»","Το **πού** (με τόνο) ρωτά τόπο: «**Πού** πας;» Το **που** (χωρίς τόνο) είναι αναφορικό ή σύνδεσμος: «Το βιβλίο **που** διάβασα.»","Το **ή** (με τόνο) είναι διαζευκτικό: «τσάι **ή** καφές». Το **η** (χωρίς τόνο) είναι το άρθρο: «**η** ιστορία»."]},{"h":"Καταλήξεις ρημάτων","p":["Στη **μέση (παθητική) φωνή** οι καταλήξεις -μαι, -σαι, -ται, -νται γράφονται με **αι**: γράφομαι, γράφεσαι, γράφεται, γράφονται. Οι καταλήξεις -όμαστε και -εστε γράφονται με ε.","Στο **β' πληθυντικό** της ενεργητικής φωνής η κατάληξη είναι **-ετε**: γράφετε, λέτε, κάνετε.","Στο **γ' ενικό** η κατάληξη είναι **-ει**: αυτός γράφει, λέει, κάνει. Στο β' ενικό: εσύ γράφεις, λες, κάνεις."]},{"h":"Κεφαλαία, μικρά και διπλά σύμφωνα","p":["Οι **γλώσσες** γράφονται με μικρά (ελληνικά, αγγλικά). Οι **εθνικότητες** με κεφαλαίο (ο Έλληνας, η Αγγλίδα).","Οι ημέρες και οι μήνες συνήθως γράφονται με μικρό αρχικό (τη δευτέρα, τον μάρτιο), εκτός αν ξεκινούν πρόταση. Διάλεξε ένα ύφος και κράτα το σε όλο το βιβλίο.","Το **συν-** γίνεται **συγ-** πριν από γ: συγγραφέας, συγγνώμη. Το **εν-** γίνεται **εγ-** πριν από γ: εγγραφή."]}],"sum":["Τελικό **ν** μένει πριν από φωνήεν και κ π τ ξ ψ γκ μπ ντ τσ τζ.","**ότι** = σύνδεσμος, **ό,τι** = οτιδήποτε. **πώς** = τρόπος, **πού** = τόπος, **ή** = διαζευκτικό.","Μέση φωνή: -μαι, -σαι, -ται, -νται με **αι**. Β' πληθυντικό: -ετε.","Συγγραφέας και συγγνώμη με διπλό **γ**."],"ex":{"t":"Παράδειγμα","x":"Δεν ξέρω πού να βρω αυτό που ψάχνω. Είπε ότι θα το φέρει, αλλά ό,τι κι αν πω, δεν με ακούει. Πώς θα το γράψετε;"},"cards":[["δεν / δε","Το ν μένει πριν από φωνήεν και κ π τ ξ ψ γκ μπ ντ τσ τζ."],["ότι","Σύνδεσμος: Είπε ότι θα έρθει."],["ό,τι","Οτιδήποτε, με κόμμα: Κάνε ό,τι θέλεις."],["πώς / πως","πώς = με ποιον τρόπο. πως = σύνδεσμος."],["πού / που","πού = σε ποιον τόπο. που = αναφορικό ή σύνδεσμος."],["ή / η","ή = διαζευκτικό. η = άρθρο."],["γράφεται","Μέση φωνή: κατάληξη -ται με αι."],["συγγραφέας","συν + γραφέας: διπλό γ."]],"qs":[{"t":"mcq","q":"Ποια πρόταση είναι σωστή;","o":[ ":"Ο τόπος ρωτιέται με πού."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Εισάγω δευτερεύουσα πρόταση: «Είπε ... έφτασε»","o":["ότι","ό,τι"],"why":"Σύνδεσμος."},{"t":"cls","q":"Σε ποια κατηγορία ανήκει;","x":"Εννοώ «οτιδήποτε»","o":["ό,τι","ότι"],"why":"Οτιδήποτε = ό,τι."},{"t":"ord","q":"Βάλε τα βήματα ελέγχου του τελικού ν στη σειρά.","lines":["Βρίσκω τη λέξη που τελειώνει σε ν (δεν, μην, την)","Κοιτάζω το πρώτο γράμμα της επόμενης λέξης","Αν είναι φωνήεν ή κ π τ ξ ψ γκ μπ ντ τσ τζ, κρατάω το ν","Αλλιώς το παραλείπω"],"why":"Βρίσκεις τη λέξη, κοιτάς το επόμενο γράμμα, αποφασίζεις."},{"t":"tf","q":"Σωστό ή λάθος;","x":"Στη φράση «Ξέρω πως θα έρθει» (= ξέρω ότι θα έρθει) το «πως» γράφεται χωρίς τόνο.","a":true,"why":"Όταν σημαίνει «ότι», είναι σύνδεσμος και δεν παίρνει τόνο."}],"cat":"Ορθογραφία (ελληνικά)"},{"n":"m2","title":"Στίξη στα ελληνικά","mentor":{"name":"Δόκτωρ Κόμμα","role":"φύλακας της μνήμης","g":"glass","line":"Η στίξη είναι η αναπνοή του κειμένου. Μάθε πού ο αναγνώστης παίρνει ανάσα."},"lesson":[{"h":"Τα σημεία και τι κάνει το καθένα","p":["- **Τελεία ( . )**: κλείνει την πρόταση.","- **Κόμμα ( , )**: μικρή παύση. Χωρίζει στοιχεία σε απαρίθμηση, προσφωνήσεις και παρενθετικές φράσεις.","- **Άνω τελεία ( · )**: παύση μεγαλύτερη από το κόμμα και μικρότερη από την τελεία.","- **Ερωτηματικό ( ; )**: στα ελληνικά είναι το σημείο της ερώτησης.","- **Θαυμαστικό ( ! )**: έκπληξη, προσταγή, επιφώνημα.","- **Άνω και κάτω τελεία ( : )**: προαναγγέλλει απαρίθμηση, διευκρίνιση ή λόγο προσώπου.","- **Αποσιωπητικά ( ... )**: τρεις τελείες, για διακοπή ή παράλειψη."]},{"h":"Πού μπαίνει κόμμα","p":["Βάζεις κόμμα **σε απαρίθμηση**: «Αγόρασε βιβλία, τετράδια και στυλό.»","**Μετά την προσφώνηση**: «Μαρία, έλα εδώ.»","**Πριν από τους αντιθετικούς συνδέσμους** «αλλά», «όμως», «ενώ»: «Ήθελε να έρθει, αλλά βράδιασε.»","**Γύρω από μια παρενθετική φράση**: «Ο Νίκος, που ζει στην Κόρινθο, γράφει μυθιστόρημα.»","**Δεν** βάζεις κόμμα ανάμεσα στο υποκείμενο και το ρήμα: «Η κόρη μου γράφει.» Ούτε μετά το «ότι» και το «πως» σε πρόταση που αναφέρει τι λέει κάποιος: «Είπε ότι θα έρθει.»"]},{"h":"Διάλογος και εισαγωγικά","p":["Στα ελληνικά τα εισαγωγικά είναι τα **« »** (γκιγιμέ). Για παράθεση μέσα σε παράθεση χρησιμοποιούνται τα **“ ”**.","Στον διάλογο χρησιμοποιείται συχνά η **παύλα** στην αρχή κάθε ατάκας. Κάθε νέος ομιλητής αρχίζει σε **νέα γραμμή**.","> — Πού πας; ρώτησε η Άννα.\n> — Στη βιβλιοθήκη, απάντησε εκείνος.","Η στίξη μέσα στα εισαγωγικά ακολουθεί το νόημα. Διάλεξε ένα σύστημα και κράτα το σε όλο το βιβλίο."]},{"h":"Κενά και αποσιωπητικά","p":["**Κενό μετά** από κάθε σημείο στίξης, **όχι πριν**: «Ήρθε, είδε, έφυγε.» Εξαίρεση: κενό πριν από ανοιχτή παρένθεση ή εισαγωγικά.","Τα αποσιωπητικά είναι **τρεις** τελείες, όχι δύο ούτε τέσσερις: «Δεν ξέρω...»","Δεν βάζεις πολλά θαυμαστικά ή ερωτηματικά στη σειρά στο λογοτεχνικό κείμενο. Ένα αρκεί."]}],"sum":["Τελεία κλείνει πρόταση. Ερωτηματικό = **;** στα ελληνικά.","Κόμμα σε απαρίθμηση, προσφώνηση, πριν από «αλλά/όμως», γύρω από παρενθετική φράση.","Όχι κόμμα ανάμεσα σε υποκείμενο και ρήμα, ούτε μετά το «ότι».","Εισαγωγικά «...». Διάλογος: παύλα και νέα γραμμή για κάθε ομιλητή.","Αποσιωπητικά: ακριβώς τρεις τελείες."],"ex":{"t":"Παράδειγμα","x":"— Μαρία, πού πας; ρώτησε ο Νίκος.\n— Στη βιβλιοθήκη, απάντησε εκείνη. Θέλω να γράψω, αλλά δεν ξέρω από πού να αρχίσω."},"cards":[["Ερωτηματικό","Στα ελληνικά είναι το ;"],["Άνω τελεία","Το σημάδι · μεγαλύτερη παύση από κόμμα, μικρότερη από τελεία."],["Εισαγωγικά","Τα ελληνικά εισαγωγικά είναι « »."],["Αποσιωπητικά","Ακριβώς τρεις τελείες."],["Κόμμα στην προσφώνηση","Μαρία, έλα εδώ."],["Κόμμα πριν το «αλλά»","Ήθελε, αλλά δεν μπόρεσε."],["Διάλογος","Παύλα και νέα γραμμή για κάθε ομιλητή."],["Κενό","Μετά το σημείο στίξης, όχι πριν."]],"qs":[{"t":"mcq","q":"Ποιο είναι το ελληνικό ερωτηματικό;","o":[";","?","·",":"],"why":"Στα ελληνικά η ερώτηση κλείνει με το ;"},{"t":"mcq","q":"Ποια πρόταση έχει σωστή στίξη;","o":["Πού πας;","Πού πας.","Πού πας!","Πο
